      - "Un filtro de acción que inicie un hilo nuevo con cada petición recibida"
      - "Un temporizador de JavaScript en la página que invoque la API cada segundo exacto"
    why: "Se registra con `AddHostedService<T>()` y respeta la cancelación al apagar la aplicación."
  en:
    q: "In ASP.NET Core, what would you use for a task that runs continuously in the background?"
    options:
      - "A class that inherits from `BackgroundService`, registered as a hosted service"
      - "A controller that calls `Thread.Sleep` inside of an endless loop"
      - "An action filter that starts a new thread for every request received by the app"
      - "A JavaScript timer on the page that calls the API once every second"
    why: "Register it with `AddHostedService<T>()`; it honors cancellation when the app shuts down."

