      - "`readonly` se fija al compilar; `const` también puede asignarse en el constructor"
      - "`const` solo existe en estructuras y `readonly` solo existe en clases"
      - "Ambos admiten cambios en cualquier momento, pero `const` es más rápido"
    why: "El valor de un `const` queda incrustado en quien lo usa, lo que importa entre ensamblados."
  en:
    q: "What is the difference between `const` and `readonly`?"
