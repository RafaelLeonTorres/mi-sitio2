      - "Almacenamiento en la pila y liberación inmediata sin recolector de basura"
      - "La posibilidad de heredar de varias clases base al mismo tiempo"
      - "Serialización automática a una base de datos sin configurar nada"
    why: "Es ideal para datos inmutables, como DTO u objetos de valor."
  en:
    q: "What does a (class) `record` offer compared with a regular class?"
    options:
      - "Value equality, a readable `ToString` and generated copies with `with`"
      - "Storage on the stack and immediate release without a garbage collector"
      - "The ability to inherit from several base classes at the same time"
      - "Automatic serialization into a database without any configuration"
    why: "It fits immutable data such as DTOs or value objects."

- id: net-select-many
