      - "Como método de instancia en una clase que hereda del tipo que se quiere extender"
      - "Como método privado dentro del propio tipo, marcado con el atributo `[Extension]`"
      - "Como una interfaz que el compilador agrega al tipo original en tiempo de ejecución"
