- id: net-captive-dependency
  es:
    q: "¿Qué problema tiene que un servicio `Singleton` reciba por constructor uno `Scoped`?"
    options:
      - "La dependencia queda cautiva: vive tanto como el singleton y se comparte entre peticiones"
      - "El servicio `Scoped` se convierte en `Transient` y se crea uno en cada llamada"
      - "El contenedor ignora el singleton y crea una instancia nueva por petición"
      - "No hay ningún problema: el contenedor renueva la dependencia automáticamente en cada petición web"
    why: "En desarrollo, ASP.NET Core valida los ámbitos y lanza un error al detectarlo."
  en:
    q: "What is wrong with a `Singleton` service receiving a `Scoped` one through its constructor?"
    options:
      - "The dependency is captured: it lives as long as the singleton and is shared by requests"
      - "The `Scoped` service becomes `Transient` and a new one is created on every call to the app"
      - "The container ignores the singleton and creates a new instance per request"
      - "Nothing is wrong: the container renews the dependency automatically"
    why: "In development, ASP.NET Core validates scopes and throws when it detects this."

- id: net-http-client-factory
  es:
    q: "¿Por qué se recomienda `IHttpClientFactory` en lugar de crear un `HttpClient` en cada petición?"
    options:
      - "Reutiliza los manejadores y evita agotar sockets y quedarse con DNS desactualizado"
      - "Convierte las llamadas HTTP en llamadas directas a la base de datos remota de la app"
      - "Es la única forma de enviar peticiones HTTPS desde una aplicación .NET"
      - "Guarda en caché las respuestas para no volver a llamar nunca al servicio"
    why: "También permite configurar clientes con nombre, tipados y políticas de resiliencia."
  en:
    q: "Why is `IHttpClientFactory` recommended over creating an `HttpClient` per request?"
    options:
      - "It reuses handlers and avoids exhausting sockets or holding stale DNS entries"
      - "It turns HTTP calls into direct calls against the remote database server"
      - "It is the only way to send HTTPS requests from a .NET application"
      - "It caches responses so that the service is never called again"
    why: "It also lets you configure named and typed clients plus resilience policies."

- id: net-background-service
