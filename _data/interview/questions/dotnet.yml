    why: "Los casos se evalúan en orden: el primero que coincide, con su condición `when`, gana."
  en:
    q: "What does this program print?"
    options:
      - "`big`"
      - "`number`"
      - "`other`"
      - "It does not compile because `int` appears twice"
    why: "Arms are evaluated in order: the first match, including its `when` condition, wins."

