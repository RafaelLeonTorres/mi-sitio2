      - "`2`"
      - "`0`"
      - "It does not compile: `x` cannot be changed in `finally`"
    why: "The return value is evaluated before `finally` runs; changing `x` afterwards does not affect it."

- id: net-ref-out
  es:
    q: "¿Qué distingue a los parámetros `ref` de los `out`?"
    options:
