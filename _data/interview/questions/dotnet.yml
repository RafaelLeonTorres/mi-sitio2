      - "`ref` debe asignarse dentro del método; `out` exige que la variable llegue inicializada"
      - "`ref` solo funciona con tipos de referencia y `out` solo con tipos por valor"
      - "`out` copia el valor al entrar y `ref` nunca permite modificar la variable"
    why: "Ambos pasan por referencia; `TryParse` es el uso típico de `out`."
  en:
    q: "What sets `ref` parameters apart from `out` parameters?"
    options:
      - "`out` must be assigned inside the method; `ref` requires an initialized variable"
      - "`ref` must be assigned inside the method; `out` requires an initialized variable"
      - "`ref` only works with reference types and `out` only with value types"
      - "`out` copies the value on entry and `ref` never allows changing the variable"
    why: "Both pass by reference; `TryParse` is the typical use of `out`."

- id: net-in-parameter
  es:
    q: "¿Qué indica el modificador `in` en un parámetro?"
    options:
      - "Que se recibe por referencia y el método no puede reasignarlo"
      - "Que el parámetro es opcional y tiene un valor predeterminado fijo"
      - "Que el método debe asignarle un valor antes de terminar"
      - "Que solo acepta valores constantes escritos en el código"
    why: "Útil para pasar estructuras grandes sin copiarlas."
  en:
    q: "What does the `in` modifier mean on a parameter?"
    options:
      - "It is received by reference and the method cannot reassign it"
      - "The parameter is optional and has a default value"
      - "The method must assign a value to it before finishing the method"
      - "It only accepts constant values written in the code"
    why: "Handy for passing large structs without copying them."

- id: net-nullable-reference
  es:
    q: "¿Qué hacen los tipos de referencia anulables (`string?`)?"
    options:
      - "El compilador avisa de posibles usos de `null`; en ejecución no cambia nada"
      - "Convierten la referencia en un tipo por valor que ocupa menos memoria"
      - "Lanzan una excepción automáticamente cuando se asigna `null` a la variable"
      - "Impiden que cualquier variable del programa pueda llegar a ser `null`"
    why: "Es análisis estático: ayuda a evitar `NullReferenceException`, no la impide en ejecución."
  en:
    q: "What do nullable reference types (`string?`) do?"
    options:
      - "The compiler warns about possible `null` use; nothing changes at run time"
      - "They turn the reference into a value type that takes up less memory"
      - "They throw automatically when `null` is assigned to the variable"
      - "They prevent any variable in the program from ever becoming `null`"
    why: "It is static analysis: it helps avoid `NullReferenceException`, without preventing it at run time."

- id: net-null-coalescing
