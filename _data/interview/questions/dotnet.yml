      - "`A B 1 2`"
      - "`B A 1 2`"
      - "`A 1 2`"
      - "`B 1 2 A`"
    why: "Un iterador con `yield` no ejecuta su cuerpo hasta que se recorre: `B` aparece dentro del `foreach`."
  en:
    q: "What does this program print?"
    options:
      - "`A B 1 2`"
      - "`B A 1 2`"
      - "`A 1 2`"
      - "`B 1 2 A`"
    why: "A `yield` iterator does not run its body until it is enumerated: `B` appears inside the `foreach`."

- id: net-rethrow
  es:
    q: "Dentro de un `catch`, ¿qué diferencia hay entre `throw;` y `throw ex;`?"
    options:
      - "`throw;` conserva la pila original; `throw ex;` la reinicia desde ese punto"
      - "`throw ex;` conserva la pila original; `throw;` la reinicia desde ese punto"
      - "`throw;` oculta la excepción y `throw ex;` es la única que la propaga"
      - "No hay diferencia: ambas generan exactamente la misma información de la pila"
    why: "Para relanzar usa `throw;`, o lanza una excepción nueva con la original como `InnerException`."
  en:
    q: "Inside a `catch`, what is the difference between `throw;` and `throw ex;`?"
    options:
      - "`throw;` keeps the original stack trace; `throw ex;` restarts it from that point"
      - "`throw ex;` keeps the original stack trace; `throw;` restarts it from that point"
      - "`throw;` swallows the exception and only `throw ex;` actually propagates it"
      - "There is no difference: both produce exactly the same stack information"
    why: "Rethrow with `throw;`, or throw a new exception with the original as `InnerException`."

- id: net-finally-return
