      - "`readonly` is fixed at compile time; `const` can also be assigned in the constructor"
      - "`const` only exists in structs and `readonly` only exists in classes"
      - "Both can be changed at any time, but `const` is the faster of the two"
    why: "A `const` value is baked into the code that uses it, which matters across assemblies."
