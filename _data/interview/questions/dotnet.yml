    why: "`??=` asigna solo si la variable es `null`: la segunda vez ya tiene valor."
  en:
    q: "What does this program print?"
    options:
      - "`guest`"
      - "`admin`"
      - "An empty line"
      - "It throws `NullReferenceException`"
    why: "`??=` assigns only when the variable is `null`: the second time it already has a value."

- id: net-switch-expression
