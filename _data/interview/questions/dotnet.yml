      - "As a static method in a static class, with `this` on the first parameter"
      - "As an instance method in a class inheriting from the type being extended"
      - "As a private method inside the type itself, marked with an `[Extension]` attribute"
      - "As an interface that the compiler adds to the original type at run time"
