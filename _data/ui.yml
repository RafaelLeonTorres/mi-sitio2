  about:
    title: Sobre mí
    paragraphs:
      - "Soy ingeniero de software con más de 8 años de experiencia desarrollando soluciones con C#/.NET, Angular y SQL Server. En Qualis Technologies trabajo en EMA Salud, un ecosistema para clínicas, hospitales y farmacias que usan instituciones públicas de salud en México: desarrollo funcionalidades de punta a punta, optimizo consultas y reportes críticos y resuelvo incidencias productivas con análisis de causa raíz."
      - "Antes, en Qualtop, desarrollé APIs .NET y aplicaciones Angular para Jabil con CI/CD en Azure DevOps. En NTT DATA dirigí, para Citibanamex, la migración de las aplicaciones y APIs del banco a una nueva infraestructura durante su separación. En CECOBAN, Proveedor Autorizado de Certificación (PAC), participé en la migración a CFDI 4.0 y en el complemento Carta Porte 2.0."
      - "Me enfoco en código mantenible (SOLID, patrones de diseño y pruebas), en el rendimiento de las bases de datos y en integrar IA —Claude Code, skills propias y servidores MCP— para acelerar el análisis, las revisiones de código y la documentación."
    principles_title: Cómo trabajo
    principles:
      - name: Liderazgo técnico.
        text: Coordino equipos en migraciones y entregas críticas, con tareas claras y seguimiento cercano.
      - name: Trabajo en equipo.
        text: Reviso pull requests con criterios explícitos y documento para que cualquiera pueda continuar el trabajo.
      - name: Resolución de problemas.
        text: Reproduzco el error, encuentro la causa raíz y la explico en lenguaje claro a negocio y QA.
      - name: Persistencia.
        text: "Sigo un problema hasta cerrarlo y dejo evidencia: pruebas, scripts y pasos de validación."
