    photo_alt: Portrait of Rafael León
  about:
    title: About
    paragraphs:
      - "I'm a software engineer with more than 8 years of experience building solutions with C#/.NET, Angular, and SQL Server. At Qualis Technologies I work on EMA Salud, a platform for clinics, hospitals, and pharmacies used by public healthcare institutions in Mexico. I build features end to end, optimize critical queries and reports, and resolve production incidents through root-cause analysis."
      - "Before that, at Qualtop, I built .NET APIs and Angular applications for Jabil with CI/CD on Azure DevOps. At NTT DATA I led the migration of Citibanamex's applications and APIs to new infrastructure during the bank's separation. At CECOBAN, an authorized certification provider (PAC) for Mexican e-invoicing, I worked on the migration to CFDI 4.0 and the Carta Porte 2.0 complement."
      - "I focus on maintainable code (SOLID, design patterns, and tests), database performance, and using AI—Claude Code, custom skills, and MCP servers—to speed up analysis, code reviews, and documentation."
    principles_title: How I work
    principles:
      - name: Technical leadership.
        text: I coordinate teams through migrations and critical releases, with clear tasks and close follow-up.
      - name: Teamwork.
        text: I review pull requests against explicit criteria and document my work so anyone can pick it up.
      - name: Problem solving.
        text: I reproduce the issue, find the root cause, and explain it in plain language to business and QA.
      - name: Persistence.
        text: "I follow a problem until it is closed and leave evidence behind: tests, scripts, and validation steps."
