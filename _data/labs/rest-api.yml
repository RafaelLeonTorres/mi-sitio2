en:
  groups:
    auth: Authentication
    products: Products
  token:
    title: Demo token
    text: >-
      There's no password: choose a role and ask for a token. It's a real JWT, signed with
      HMAC-SHA256, that expires in 5 minutes. You can see it decoded, expire it, or change its
      contents to see how the API responds.
    role: Role
    roles:
      Reader: Reader
      Editor: Editor
      Admin: Admin
    get: Get token
    view: View
    hide: Hide
    expire: Expire
    none: No token
    header: Header
    payload: Payload
    edit_hint: >-
      Change the payload and apply it: the token keeps its original signature, so the API will
      reject it with a 401.
    apply: Apply changes
  options:
    failure: Simulate a server failure
    failure_hint: Requests respond 500, as if the service threw an exception.
    reset: Reset data
  operations:
    - id: token
      summary: Get a demo token
      description: >-
        Takes the role and returns a JWT signed with that role, which expires in 5 minutes. The bar
        above does the same with one click.
      body: |-
        {
          "role": "Editor"
        }
      codes:
        - { status: 200, text: "The token, its type, and how many seconds until it expires." }
        - { status: 400, text: The role doesn't exist or the body isn't JSON. }
    - id: list
      summary: List products
      description: >-
        Returns a page of products with its metadata. `search` looks in the name and the SKU,
        ignoring case and accents.
      codes:
        - { status: 200, text: "The requested page, the total number of products, and the total number of pages." }
        - { status: 400, text: "`page` below 1, or `pageSize` outside 1 to 50." }
    - id: get
      summary: Get a product
      description: >-
        Returns a product as its `ProductResponse`: without the cost, the version, or the audit
        fields the entity stores.
      codes:
        - { status: 200, text: The product. }
        - { status: 404, text: "It doesn't exist, or it was deleted. An id that isn't a number doesn't find the route either." }
    - id: create
      summary: Create a product
      description: >-
        Requires an Editor or Admin token. It validates the body, checks that the SKU doesn't exist
        yet, and responds with the product and its address in `Location`. If you add fields the DTO
        doesn't have, such as `id` or `costPrice`, the API ignores them.
      body: |-
        {
          "name": "75% mechanical keyboard",
          "sku": "KBD-1006",
          "price": 1499,
          "stock": 12,
          "categoryId": 1
        }
      codes:
        - { status: 201, text: "The new product, with `Location`." }
        - { status: 400, text: Validation errors by field. }
        - { status: 401, text: "No token, or one that's expired or tampered with." }
        - { status: 403, text: The token belongs to a Reader. }
        - { status: 409, text: A product with that SKU already exists. }
    - id: update
      summary: Update a product
      description: >-
        Requires an Editor or Admin token and replaces the whole product. It responds with no body.
      body: |-
        {
          "name": "TKL mechanical keyboard",
          "sku": "KBD-1001",
          "price": 1199,
          "stock": 20,
          "categoryId": 1
        }
      codes:
        - { status: 204, text: It was updated. }
        - { status: 400, text: Validation errors by field. }
        - { status: 401, text: "No token, or one that's expired or tampered with." }
        - { status: 403, text: The token belongs to a Reader. }
        - { status: 404, text: The product doesn't exist. }
        - { status: 409, text: Another product already uses that SKU. }
    - id: delete
      summary: Delete a product
      description: >-
        Requires an Admin token. It's a soft delete: the row stays with `IsDeleted` set, and the
        product stops showing up.
      codes:
        - { status: 204, text: It was deleted. }
        - { status: 401, text: "No token, or one that's expired or tampered with." }
        - { status: 403, text: The token belongs to a Reader or an Editor. }
        - { status: 404, text: The product doesn't exist. }
  params:
    - { name: id, text: Product id }
    - { name: page, text: "Page, starting at 1" }
    - { name: pageSize, text: "Products per page, from 1 to 50" }
    - { name: search, text: Text to look for in the name or the SKU }
  form:
    params: Parameters
    body: Body (JSON)
    use_token: Use token
    send: Send
    lock: Requires a token
    roles: "Roles: {value}"
    codes: Responses
    code: Endpoint in C#
  model:
    title: Model
    text: >-
      The entity stores more than the API shows: the cost, the concurrency version, the soft delete
      flag, and the audit fields. The DTOs say what goes in and what comes out, and the mapping is
      written by hand. That's why a `costPrice` in the body never reaches the entity.
  pipeline:
    title: The pipeline
    text: >-
      Every request goes through the middleware in the order the ASP.NET Core documentation
      recommends: exception handling, logging, routing, rate limiting, authentication, and
      authorization. Validation is a filter that runs when the endpoint executes, and then come the
      service and the repository. This is how `Program.cs` sets it up:
  how_title: How this simulation works
  how_text: >-
    There's no server: the API, its data, and the pipeline run in your browser, in TypeScript, and
    the timings are simulated. The token is a real JWT, signed with Web Crypto; the key is created
    when the page opens and lives in the browser only because this is a simulation (in a real
    system the server or an identity provider holds it). Problem Details titles and the log are in
    English, the way ASP.NET Core writes them. Reloading the page resets the data to the starting
    catalog.
  source_label: This demo's code is on GitHub
  source_url: https://github.com/RafaelLeonTorres/mi-sitio2/tree/main/labs/rest-api
  client:
    categories:
      - { id: 1, name: Keyboards }
      - { id: 2, name: Mice }
      - { id: 3, name: Monitors }
      - { id: 4, name: Audio }
      - { id: 5, name: Accessories }
    products:
      - { id: 1, name: TKL mechanical keyboard }
      - { id: 2, name: Low-profile wireless keyboard }
      - { id: 3, name: Split ergonomic keyboard }
      - { id: 4, name: Numeric keypad }
      - { id: 5, name: Compact 60% keyboard }
      - { id: 6, name: Vertical ergonomic mouse }
      - { id: 7, name: Wireless mouse }
      - { id: 8, name: Gaming mouse }
      - { id: 9, name: Trackball }
      - { id: 10, name: Travel mouse }
      - { id: 11, name: 24-inch monitor }
      - { id: 12, name: 27-inch QHD monitor }
      - { id: 13, name: 34-inch ultrawide monitor }
      - { id: 14, name: 15-inch portable monitor }
      - { id: 15, name: Monitor arm }
      - { id: 16, name: Wireless headphones }
      - { id: 17, name: Noise-canceling headphones }
      - { id: 18, name: USB microphone }
      - { id: 19, name: Desktop speakers }
      - { id: 20, name: Headset with microphone }
      - { id: 21, name: 8-port USB-C dock }
      - { id: 22, name: Full HD webcam }
      - { id: 23, name: XL desk mat }
      - { id: 24, name: Laptop stand }
      - { id: 25, name: Monitor light bar }
    messages:
      validation:
        required: This field is required.
        length: Must have between {min} and {max} characters.
        positive: Must be greater than 0.
        notNegative: Can't be negative.
        integer: Must be a whole number.
        number: Must be a number.
        skuFormat: Must have the format ABC-1234.
        category: There's no category with id {value}.
        role: "Must be one of these: {value}."
        page: Must be 1 or more.
        pageSize: Must be between 1 and {max}.
      notFound: There's no product with id {value}.
