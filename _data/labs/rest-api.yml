# Simulador de API REST.
# `shared` tiene lo que no se traduce: el catálogo inicial (sin nombres) y las operaciones con su
# método, su ruta, sus parámetros, los roles que piden y el archivo de su código en
# _includes/labs/code/rest-api/ (`open` deja una abierta al cargar la página). En `es` y `en` va lo que se lee; `client` es lo que el
# TypeScript necesita (nombres del catálogo, mensajes de la API y textos de la consola).

