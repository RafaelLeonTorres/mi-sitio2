es:
  groups:
    auth: Autenticación
    products: Productos
  token:
    title: Token de demostración
    text: >-
      No hay contraseña: elige un rol y pide un token. Es un JWT de verdad, firmado con
      HMAC-SHA256, que vence en 5 minutos. Puedes verlo decodificado, vencerlo o cambiar su
      contenido para ver cómo responde la API.
    role: Rol
    roles:
      Reader: Lector
      Editor: Editor
      Admin: Admin
    get: Obtener token
    view: Ver
    hide: Ocultar
    expire: Vencer
    none: Sin token
    header: Encabezado
    payload: Contenido
    edit_hint: >-
      Cambia el contenido y aplícalo: el token conserva la firma original, así que la API lo
      rechazará con un 401.
    apply: Aplicar cambios
  options:
    failure: Simular falla del servidor
    failure_hint: Las peticiones responden 500, como si el servicio lanzara una excepción.
    reset: Restablecer datos
  operations:
    - id: token
      summary: Obtener un token de demostración
      description: >-
        Recibe el rol y devuelve un JWT firmado con ese rol, que vence en 5 minutos. La barra de
        arriba hace lo mismo con un clic.
      body: |-
        {
          "role": "Editor"
        }
      codes:
        - { status: 200, text: "El token, su tipo y en cuántos segundos vence." }
        - { status: 400, text: El rol no existe o el cuerpo no es JSON. }
    - id: list
      summary: Listar productos
      description: >-
        Devuelve una página de productos con sus metadatos. `search` busca en el nombre y el SKU
        sin distinguir mayúsculas ni acentos.
      codes:
        - { status: 200, text: "La página pedida, el total de productos y el total de páginas." }
        - { status: 400, text: "`page` menor que 1, o `pageSize` fuera de 1 a 50." }
    - id: get
      summary: Obtener un producto
      description: >-
        Devuelve un producto con su `ProductResponse`: sin el costo, la versión ni la auditoría
        que guarda la entidad.
      codes:
        - { status: 200, text: El producto. }
        - { status: 404, text: "No existe, o se borró. Un id que no es número tampoco encuentra la ruta." }
    - id: create
      summary: Crear un producto
      description: >-
        Pide un token de Editor o Admin. Valida el cuerpo, revisa que el SKU no exista y responde
        con el producto y su dirección en `Location`. Si agregas campos que el DTO no tiene, como
        `id` o `costPrice`, la API los ignora.
      body: |-
        {
          "name": "Teclado mecánico de 75 %",
          "sku": "KBD-1006",
          "price": 1499,
          "stock": 12,
          "categoryId": 1
        }
      codes:
        - { status: 201, text: "El producto creado, con `Location`." }
        - { status: 400, text: Errores de validación por campo. }
        - { status: 401, text: "Sin token, o con uno vencido o alterado." }
        - { status: 403, text: El token es de un Lector. }
        - { status: 409, text: Ya existe un producto con ese SKU. }
    - id: update
      summary: Actualizar un producto
      description: >-
        Pide un token de Editor o Admin y reemplaza el producto completo. Responde sin cuerpo.
      body: |-
        {
          "name": "Teclado mecánico TKL",
          "sku": "KBD-1001",
          "price": 1199,
          "stock": 20,
          "categoryId": 1
        }
      codes:
        - { status: 204, text: Se actualizó. }
        - { status: 400, text: Errores de validación por campo. }
        - { status: 401, text: "Sin token, o con uno vencido o alterado." }
        - { status: 403, text: El token es de un Lector. }
        - { status: 404, text: El producto no existe. }
        - { status: 409, text: Otro producto ya usa ese SKU. }
    - id: delete
      summary: Eliminar un producto
      description: >-
        Pide un token de Admin. Es un borrado lógico: la fila se queda con `IsDeleted` y el
        producto deja de aparecer.
      codes:
        - { status: 204, text: Se eliminó. }
        - { status: 401, text: "Sin token, o con uno vencido o alterado." }
        - { status: 403, text: El token es de un Lector o de un Editor. }
        - { status: 404, text: El producto no existe. }
  params:
    - { name: id, text: Id del producto }
    - { name: page, text: "Página, desde 1" }
    - { name: pageSize, text: "Productos por página, de 1 a 50" }
    - { name: search, text: Texto que se busca en el nombre o el SKU }
  form:
    params: Parámetros
    body: Cuerpo (JSON)
    use_token: Usar token
    send: Enviar
    lock: Pide token
    roles: "Roles: {value}"
    codes: Respuestas
    code: Endpoint en C#
  model:
    title: Modelo
    text: >-
      La entidad guarda más de lo que la API muestra: el costo, la versión para la concurrencia,
      el borrado lógico y la auditoría. Los DTOs dicen qué entra y qué sale, y el mapeo está escrito
      a mano. Por eso un `costPrice` en el cuerpo no llega a la entidad.
  pipeline:
    title: El pipeline
    text: >-
      Cada petición pasa por el middleware en el orden que recomienda la documentación de ASP.NET
      Core: manejo de excepciones, registro, enrutamiento, límite de peticiones, autenticación y
      autorización. La validación es un filtro que corre al ejecutar el endpoint, y después vienen
      el servicio y el repositorio. Así se configura en `Program.cs`:
  how_title: Cómo funciona esta simulación
  how_text: >-
    No hay servidor: la API, sus datos y el pipeline corren en tu navegador, en TypeScript, y los
    tiempos son simulados. El token sí es un JWT real, firmado con Web Crypto; la llave se crea al
    abrir la página y vive en el navegador solo porque es una simulación (en un sistema real la
    tiene el servidor o un proveedor de identidad). Los títulos de Problem Details y el registro
    salen en inglés, como los escribe ASP.NET Core. Al recargar la página, los datos vuelven al
    catálogo inicial.
  source_label: El código de esta demo está en GitHub
  source_url: https://github.com/RafaelLeonTorres/mi-sitio2/tree/main/labs/rest-api
  client:
