# Textos del laboratorio en español (es) e inglés (en): el índice, el encabezado de las demos y
# las piezas compartidas (kit). Cada demo tendrá su propio archivo en _data/labs/.
# Las dos partes deben tener las mismas claves; scripts/content-parity.test.ts lo revisa.
# Evita usar como clave: items, keys, values, get, update, copy, size, first, last.

es:
  index_url: /laboratorio/
  back: Laboratorio
  soon: Próximamente
  source_label: El código del laboratorio está en GitHub
  source_url: https://github.com/RafaelLeonTorres/mi-sitio2/tree/main/labs
  demos:
    - id: architecture
      ready: true
      url: /laboratorio/arquitecturas/
      name: Simulador de arquitecturas
      question: ¿Qué cambia entre un monolito y unos microservicios cuando llega un pedido?
      text: >-
        Cinco arquitecturas como diagramas interactivos. Abre cada pieza para ver qué hace, con
        qué se construye, sus ventajas, sus desventajas y un ejemplo en C#, y sigue una petición
        paso a paso.
    - id: rest-api
      ready: true
      url: /laboratorio/api-rest/
      name: Simulador de API REST
      question: ¿Qué responde una API cuando el token ya venció o faltan datos?
      text: >-
        Una consola para probar una API de productos: edita la petición, envíala y revisa la
        respuesta, su paso por el middleware y el código del endpoint en C#.
    - id: sql
      ready: true
      url: /laboratorio/sql/
      name: Laboratorio de rendimiento SQL
      question: ¿Por qué `YEAR(OrderDate)` lee varias veces más páginas que un rango de fechas?
      text: >-
        Dos consultas lado a lado con su plan de ejecución, lecturas, filas examinadas e índice
        usado, en seis escenarios: SARGabilidad, índices, N+1, JOIN y subconsultas, paginación y
        `AsNoTracking`.
    - id: challenges
      ready: true
      url: /laboratorio/retos/
      name: Retos de código
      question: ¿Tu código sigue funcionando cuando la lista llega vacía?
      text: >-
        35 retos de C# y 30 de SQL con casos de prueba, y un modo entrevista con tiempo. Tu
        solución corre en tu navegador, compilada con Roslyn o en PostgreSQL, y cada reto trae pistas
        y una solución explicada.
  kit:
    copy_label: Copiar
    copied: Copiado
    copy_failed: No se pudo copiar
  architecture:
    switch_label: Arquitectura
    hint: >-
      Elige una pieza del diagrama para ver qué hace, con qué se construye, sus ventajas, sus
      desventajas y un ejemplo de código.
    use_when: Cuándo conviene
    avoid_when: Cuándo no conviene
    role: Responsabilidad
    tech: Tecnologías
    pros: Ventajas
    cons: Desventajas
    code: Ejemplo
    back: Volver al resumen
    legend_uses: Usa o llama
    legend_implements: Implementa una interfaz
    legend_event: Envía mensajes
    flow_prev: Anterior
    flow_next: Siguiente
    flow_play: Reproducir
    flow_pause: Pausa
    flow_step: Paso {n} de {total}
    flow_hint: Sigue la petición pieza por pieza con Reproducir o Siguiente.
    how_title: Cómo funciona esta demo
    how_text: >-
      No hay servidor: los diagramas, las piezas y el recorrido salen de
      `_data/labs/architecture/`, y Jekyll los publica como HTML, así que la página se lee
      completa sin JavaScript. El TypeScript dibuja las conexiones, abre cada pieza y recorre la
      petición.
    source_label: El código de esta demo está en GitHub
    source_url: https://github.com/RafaelLeonTorres/mi-sitio2/tree/main/labs/architecture

en:
  index_url: /en/lab/
  back: Lab
  soon: Coming soon
  source_label: The lab's code is on GitHub
  source_url: https://github.com/RafaelLeonTorres/mi-sitio2/tree/main/labs
  demos:
    - id: architecture
      ready: true
      url: /en/lab/architectures/
      name: Architecture simulator
      question: What changes between a monolith and microservices when an order comes in?
      text: >-
        Five architectures as interactive diagrams. Open each piece to see what it does, what it's
        built with, its pros, its cons, and a C# example, and follow a request step by step.
    - id: rest-api
      ready: true
      url: /en/lab/rest-api/
      name: REST API simulator
      question: What does an API return when the token has expired or data is missing?
      text: >-
        A console for trying out a products API: edit the request, send it, and review the
        response, its path through the middleware, and the endpoint's C# code.
    - id: sql
      ready: true
      url: /en/lab/sql/
      name: SQL performance lab
      question: Why does `YEAR(OrderDate)` read several times more pages than a date range?
      text: >-
        Two queries side by side with their execution plans, reads, rows examined, and index used,
        across six scenarios: SARGability, indexes, N+1, JOINs and subqueries, pagination, and
        `AsNoTracking`.
    - id: challenges
      ready: true
      url: /en/lab/challenges/
      name: Coding challenges
      question: Does your code still work when the list arrives empty?
      text: >-
        35 C# and 30 SQL challenges with test cases, and a timed interview mode. Your solution runs
        in your browser, compiled with Roslyn or on PostgreSQL, and each challenge comes with hints
        and an explained solution.
  kit:
    copy_label: Copy
    copied: Copied
    copy_failed: Couldn't copy
  architecture:
    switch_label: Architecture
    hint: >-
      Choose a piece of the diagram to see what it does, what it's built with, its pros, its cons,
      and a code example.
    use_when: When it fits
    avoid_when: When it doesn't
    role: Responsibility
    tech: Technologies
    pros: Pros
    cons: Cons
    code: Example
    back: Back to the overview
    legend_uses: Uses or calls
    legend_implements: Implements an interface
    legend_event: Sends messages
    flow_prev: Previous
    flow_next: Next
    flow_play: Play
    flow_pause: Pause
    flow_step: Step {n} of {total}
    flow_hint: Follow the request piece by piece with Play or Next.
    how_title: How this demo works
    how_text: >-
      There's no server: the diagrams, the pieces, and the request path come from
      `_data/labs/architecture/`, and Jekyll publishes them as HTML, so the page reads in full
      without JavaScript. The TypeScript draws the connections, opens each piece, and walks
      through the request.
    source_label: This demo's code is on GitHub
    source_url: https://github.com/RafaelLeonTorres/mi-sitio2/tree/main/labs/architecture
