shared:
  language: sql
  category: optimization
  difficulty: medium
  tables: [Customers, Orders]
  setup: |
    CREATE INDEX IX_Orders_CustomerId ON Orders (CustomerId);
  check: plan
  plan:
    - { kind: semi-join }
    - { kind: no-subplan }
  starter: |
    SELECT c.Id, c.Name
    FROM Customers AS c
    WHERE (SELECT COUNT(*)
           FROM Orders AS o
           WHERE o.CustomerId = c.Id AND o.Total > 900) > 0;
  solution: |
    SELECT c.Id, c.Name
    FROM Customers AS c
    WHERE EXISTS (
      SELECT 1
      FROM Orders AS o
      WHERE o.CustomerId = c.Id AND o.Total > 900
    );
  cases:
    - sample: true
      tables:
        Customers:
          columns: [Id, Name]
          rows:
            - [1, Ana Torres]
            - [2, Luis Hernández]
            - [3, María López]
        Orders:
          columns: [Id, CustomerId, Total]
          rows:
            - [101, 1, 950.00]
            - [102, 1, 30.00]
            - [103, 2, 899.99]
            - [104, 3, 901.00]
            - [105, 3, 905.00]
      expected:
        columns: [Id, Name]
        rows:
          - [1, Ana Torres]
          - [3, María López]
    - generate: [customers, orders]
      explain: true

es:
  slug: existe-sin-contar
  title: Saber si existe, sin contar
  summary: "`EXISTS` en lugar de comparar un `COUNT(*)` con 0."
  statement: >-
    Lista a los clientes (`Id` y `Name`) que tienen al menos un pedido de más de 900. La consulta
    cuenta, para cada uno de los 6,000 clientes, todos sus pedidos grandes y compara el conteo con 0.
    Reescríbela para que la pregunta sea solo si existe alguno.
  hints:
    - >-
      No importa cuántos pedidos grandes tiene un cliente, solo si existe alguno.
    - >-
      `EXISTS (subconsulta)` es verdadero en cuanto la subconsulta encuentra una fila.
    - >-
      `WHERE EXISTS (SELECT 1 FROM Orders AS o WHERE o.CustomerId = c.Id AND o.Total > 900)`.
      También sirve `c.Id IN (SELECT CustomerId FROM Orders WHERE Total > 900)`.
  explanation: >-
    Con el conteo, PostgreSQL corre la subconsulta para cada uno de los 6,000 clientes (un SubPlan) y
    cuenta todos sus pedidos aunque le baste con uno. Con `EXISTS`, la convierte en un semi join:
    junta los clientes con los pedidos grandes y deja pasar a cada cliente una sola vez, sin contar.
    Unir con `JOIN` y quitar repetidos con `DISTINCT` da el mismo resultado, pero primero produce una
    fila por pedido y luego las agrupa: más trabajo para decir lo mismo. Lo muestra el escenario de
    [JOIN y subconsultas](../../sql/#sql-joins).

en:
  slug: exists-instead-of-count
  title: Knowing it exists, without counting
  summary: "`EXISTS` instead of comparing a `COUNT(*)` with 0."
  statement: >-
    List the customers (`Id` and `Name`) who have at least one order over 900. The query counts, for
    each of the 6,000 customers, all their large orders and compares the count with 0. Rewrite it so
    the question is only whether any exists.
  hints:
    - >-
      It doesn't matter how many large orders a customer has, only whether any exists.
    - >-
      `EXISTS (subquery)` is true as soon as the subquery finds a row.
    - >-
      `WHERE EXISTS (SELECT 1 FROM Orders AS o WHERE o.CustomerId = c.Id AND o.Total > 900)`.
      `c.Id IN (SELECT CustomerId FROM Orders WHERE Total > 900)` works too.
  explanation: >-
    With the count, PostgreSQL runs the subquery for each of the 6,000 customers (a SubPlan) and
    counts all their orders even though one would be enough. With `EXISTS`, it turns it into a semi
    join: it joins the customers with the large orders and lets each customer through only once,
    without counting. Joining with `JOIN` and removing duplicates with `DISTINCT` gives the same
    result, but it first produces one row per order and then groups them: more work to say the same
    thing. The [JOINs and subqueries](../../sql/#sql-joins) scenario shows it.
