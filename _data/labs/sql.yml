# Laboratorio de rendimiento SQL.
# `shared` tiene lo que no se traduce: los escenarios en el orden de las pestañas, con el nombre de
# los lados A y B con los valores iniciales (claves de `labels`) y, en los de EF Core, las variantes
# de su código (`linq`), que están en _includes/labs/code/sql/<escenario>-<variante>.cs. El SQL de
# cada lado con los valores iniciales está en <escenario>-a.sql y <escenario>-b.sql; una prueba
# revisa que sea el mismo que genera el TypeScript (labs/sql/).
# En `es` y `en` va lo que se lee. `labels`, `controls` y `client` llegan también al TypeScript:
# los nombres de cada lado, los textos de los controles y los de la interfaz.

shared:
  scenarios:
    - { id: sargability, a: function, b: range }
    - { id: indexes, a: no-index, b: key }
    - { id: n-plus-one, a: loop, b: projection, linq: [loop, include, projection] }
    - { id: joins, a: in, b: join }
    - { id: pagination, a: offset, b: keyset }
    - { id: tracking, a: tracked, b: no-tracking, linq: [tracked, no-tracking, projection] }

es:
  tabs_label: Escenarios
  nojs: >-
    Sin JavaScript, cada escenario muestra sus dos consultas con los valores iniciales y la
    explicación. Los controles, los planes de ejecución y las mediciones necesitan JavaScript.
  linq_title: El código en EF Core
  notes_title: Por qué cambia
  doc_label: "En Microsoft Learn:"
  scenarios:
    - id: sargability
      name: SARGabilidad
      question: ¿Por qué `YEAR(OrderDate) = 2026` no busca en el índice?
      text: >-
        Los pedidos de un periodo, escritos de dos formas. A envuelve la columna en `YEAR()` (y en
        `MONTH()` y `DAY()`); B la compara con un rango de fechas. Cambia el tamaño de la tabla, el
        periodo, las columnas y el índice para ver cuándo cada una busca en el índice y cuándo lo
        recorre entero.
      labels:
        function: Función sobre la columna
        range: Rango de fechas
      controls:
        columns:
          label: Columnas
          options: { narrow: "Id, OrderDate, Total", all: "Todas (*)" }
        index:
          label: Existe IX_Orders_OrderDate
      notes:
        - id: function
          title: La función esconde la columna
          text: >-
            El índice está ordenado por `OrderDate`, no por `YEAR(OrderDate)`, así que para A SQL
            Server calcula la función en cada fila y recorre el índice entero (Index Scan). B
            compara la columna tal cual: baja por el árbol hasta la primera fecha del rango y lee
            solo las que entran (Index Seek). A una condición que permite buscar así se le llama
            SARGable, de *search argument*. En EF Core, `o.OrderDate.Year == 2026` se traduce a
            `DATEPART(year, [o].[OrderDate]) = 2026`, con el mismo problema.
          url: https://learn.microsoft.com/sql/relational-databases/sql-server-index-design-guide
          link: Guía de arquitectura y diseño de índices
        - id: no-index
          title: Sin índice, las dos leen la tabla
          text: >-
            Sin `IX_Orders_OrderDate` no hay un índice ordenado por fecha, así que el rango no tiene
            dónde buscar: las dos consultas leen la tabla completa (Clustered Index Scan) y hacen
            las mismas lecturas. A tarda un poco más porque calcula las funciones en cada fila.
        - id: tipping
          title: El punto de inflexión
          text: >-
            Con `SELECT *`, el índice no tiene todas las columnas, y cada fila que encuentra
            necesita un Key Lookup a la tabla. Con muchas filas, al optimizador le sale más barato
            leer la tabla entera que hacer una búsqueda por fila, así que B también hace un scan
            aunque podría buscar. Cambia el periodo a un día para ver el seek con sus Key Lookup.
        - id: lookups
          title: Un Key Lookup por fila
          text: >-
            El índice encuentra las filas del rango, pero `SELECT *` pide columnas que no tiene: por
            cada fila, SQL Server va a buscar el resto a la tabla (Key Lookup). Con pocas filas
            conviene; con muchas, el optimizador prefiere leer la tabla. Si la consulta pide siempre
            las mismas columnas, `INCLUDE` las agrega al índice.
          url: https://learn.microsoft.com/sql/relational-databases/indexes/create-indexes-with-included-columns
          link: Índices con columnas incluidas
        - id: covering
          title: El índice cubre la consulta
          text: >-
            `IX_Orders_OrderDate` tiene `OrderDate` como clave, `Total` en `INCLUDE` y, como todo
            índice no agrupado, el `Id` de la clave agrupada. Con eso responde
            `SELECT Id, OrderDate, Total` sin tocar la tabla, y B lee solo las páginas del rango.
          url: https://learn.microsoft.com/sql/relational-databases/indexes/create-indexes-with-included-columns
          link: Índices con columnas incluidas
        - id: cast
          title: "`CAST(OrderDate AS date)` es la excepción"
          text: >-
            No toda función impide buscar: SQL Server convierte
            `CAST(OrderDate AS date) = '20261015'` en un rango y hace un seek. Es un caso especial;
            el rango explícito, desde el inicio (`>=`) hasta antes del día siguiente (`<`), sirve
            igual para un día, un mes o un año e incluye todas las horas del último día.

    - id: indexes
      name: Índices
      question: ¿Qué cambia con un índice en `CustomerId` y con `INCLUDE`?
      text: >-
        Los pedidos de un cliente, con `WHERE CustomerId = @CustomerId`. En A la tabla solo tiene
        su clave primaria; en B tiene `IX_Orders_CustomerId`, con la clave sola o con
        `INCLUDE (OrderDate, Total)`. A muestra además el índice que sugiere SSMS.
      labels:
        no-index: Sin índice
        key: Índice en CustomerId
        include: Índice con INCLUDE
      controls:
        index:
          label: Índice de B
          options: { key: Solo la clave, include: Con INCLUDE }
      notes:
        - id: lookups
          title: La clave sola obliga a volver a la tabla
          text: >-
            Con `IX_Orders_CustomerId`, SQL Server encuentra los pedidos del cliente en unas pocas
            páginas, pero `OrderDate` y `Total` no están en el índice. Cada pedido es un Key Lookup
            a la tabla, y como el cliente compró en fechas distintas, cada uno cae en otra página.
          url: https://learn.microsoft.com/sql/relational-databases/indexes/create-indexes-with-included-columns
          link: Índices con columnas incluidas
        - id: include
          title: "`INCLUDE` completa el índice"
          text: >-
            Las columnas de `INCLUDE` se guardan solo en las hojas del índice: no sirven para
            buscar ni para ordenar, pero evitan el Key Lookup. B baja por el árbol y encuentra los
            pedidos del cliente juntos en las hojas.
          url: https://learn.microsoft.com/sql/relational-databases/indexes/create-indexes-with-included-columns
          link: Índices con columnas incluidas
        - id: missing
          title: La sugerencia de índice
          text: >-
            Cuando al optimizador le falta un índice, SSMS lo sugiere en verde arriba del plan, con
            un `CREATE NONCLUSTERED INDEX` y el impacto estimado. Es un punto de partida, no una
            receta: se calcula para esta consulta sola, hay que combinarlo con los índices que ya
            existen, y cada índice nuevo se mantiene en cada `INSERT`, `UPDATE` y `DELETE`.
          url: https://learn.microsoft.com/sql/relational-databases/indexes/tune-nonclustered-missing-index-suggestions
          link: Sugerencias de índices que faltan

    - id: n-plus-one
      name: N+1
      question: ¿Cuánto cuesta pedir el cliente de cada pedido por separado?
      text: >-
        Los últimos pedidos con el nombre de su cliente, en EF Core. A trae los pedidos y luego
        cada cliente con `FindAsync`, una consulta por cliente; B lo trae todo en una sola
        consulta, con una proyección o con `Include`. Cambia cuántos pedidos se muestran y la
        latencia de la red.
      labels:
        loop: Una consulta por cliente
        include: Con Include
        projection: Con proyección
      controls:
        count:
          label: Pedidos
          format: "{value}"
        rtt:
          label: Latencia de la red
          format: "{value} ms"
        loading:
          label: Consulta de B
          options: { projection: Proyección, include: Include }
      notes:
        - id: round-trips
          title: Lo que suma es el viaje
          text: >-
            Cada consulta de A es rápida en la base: buscar un cliente por su clave lee tres
            páginas. Pero cada una es un viaje de ida y vuelta entre la aplicación y la base, y el
            tiempo crece en línea recta con los pedidos y con la latencia. B paga un solo viaje.
          url: https://learn.microsoft.com/ef/core/performance/efficient-querying#load-related-entities-eagerly-when-possible
          link: Consultas eficientes en EF Core
        - id: projection
          title: Una proyección pide solo lo que se usa
          text: >-
            Con `Select` a un DTO, EF Core arma un `JOIN` que pide tres columnas y no registra nada
            en el contexto: es la forma más ligera de traer los pedidos con el nombre del cliente.
          url: https://learn.microsoft.com/ef/core/performance/efficient-querying#project-only-properties-you-need
          link: Proyectar solo las propiedades que se usan
        - id: include
          title: "`Include` trae las entidades completas"
          text: >-
            Con `Include`, EF Core también arma un `JOIN` y resuelve el N+1, pero llena cada
            `Order` y su `Customer` con todas sus columnas y los registra en el contexto. Conviene
            cuando vas a modificarlos; para mostrarlos, una proyección transfiere y guarda menos.
          url: https://learn.microsoft.com/ef/core/querying/related-data/eager
          link: Carga anticipada de datos relacionados
        - id: lazy
          title: La carga diferida esconde el N+1
          text: >-
            Con carga diferida (*lazy loading*), basta leer `order.Customer.Name` dentro de un ciclo
            para lanzar la misma consulta por cada cliente, sin que se vea en el código. EF Core no
            la activa por defecto, y su documentación recomienda evitarla por eso.
          url: https://learn.microsoft.com/ef/core/performance/efficient-querying#beware-of-lazy-loading
          link: Cuidado con la carga diferida
        - id: split
          title: Con colecciones, `AsSplitQuery`
          text: >-
            Si `Include` trae una colección, como las líneas de cada pedido, el `JOIN` repite las
            columnas del pedido en cada fila (la explosión cartesiana). `AsSplitQuery` lo divide en
            una consulta por colección: unos cuantos viajes, sin datos repetidos, y nunca uno por
            pedido.
          url: https://learn.microsoft.com/ef/core/querying/single-split-queries
          link: Consultas únicas y divididas

    - id: joins
      name: JOIN y subconsultas
      question: ¿`IN`, `EXISTS` o `JOIN`? ¿Y qué pasa con `NOT IN` y los `NULL`?
      text: >-
        Dos preguntas sobre los clientes y sus pedidos de octubre de 2026: quiénes compraron y
        quiénes no. Para la primera, compara `IN` o `EXISTS` con un `JOIN`; para la segunda,
        `NOT IN` con `NOT EXISTS`, con pedidos de invitados que no tienen cliente.
      labels:
        in: IN
        exists: EXISTS
        join: JOIN
        join-distinct: JOIN con DISTINCT
        not-in: NOT IN
        not-exists: NOT EXISTS
      controls:
        question:
          label: Pregunta
          options: { with: Compraron en octubre, without: No compraron en octubre }
        subquery:
          label: Subconsulta de A
          options: { in: IN, exists: EXISTS }
        distinct:
          label: DISTINCT en el JOIN
        guests:
          label: Hay pedidos de invitados (CustomerId NULL)
      notes:
        - id: semi
          title: "`IN` y `EXISTS` son la misma pregunta"
          text: >-
            Para el optimizador, `IN (subconsulta)` y `EXISTS` preguntan lo mismo: ¿hay al menos un
            pedido de este cliente? Los dos terminan en el mismo plan, un semi join, que devuelve a
            cada cliente una sola vez, tenga uno o diez pedidos en octubre.
          url: https://learn.microsoft.com/sql/relational-databases/showplan-logical-and-physical-operators-reference
          link: Operadores de los planes de ejecución
        - id: duplicates
          title: El `JOIN` repite a los clientes
          text: >-
            Un `JOIN` devuelve una fila por pedido, así que un cliente con tres pedidos en octubre
            sale tres veces: 12,420 filas para 10,998 clientes. No es otra forma de escribir `IN`:
            es otra pregunta. Activa `DISTINCT` para ver qué pasa.
        - id: same-plan
          title: Con `DISTINCT`, el mismo plan
          text: >-
            Con `DISTINCT`, el `JOIN` vuelve a preguntar quiénes compraron, y el optimizador llega
            al mismo semi join que con `IN` o `EXISTS`: las mismas lecturas y las mismas filas. Usa
            la forma que se lea más clara.
        - id: "null"
          title: "`NOT IN` y un solo `NULL`"
          text: >-
            `NOT IN` compara a cada cliente con todos los valores de la subconsulta. Si uno es
            `NULL`, como el `CustomerId` de un pedido de invitado, la comparación da *desconocido* y
            ningún cliente cumple: la consulta devuelve 0 filas, sin ningún error. `NOT EXISTS`
            solo pregunta si el cliente tiene pedidos, así que los `NULL` no le afectan.
          url: https://learn.microsoft.com/sql/t-sql/language-elements/in-transact-sql
          link: IN (Transact-SQL)
        - id: not-null
          title: Sin `NULL`, la misma respuesta
          text: >-
            Si `CustomerId` no admite `NULL`, `NOT IN` y `NOT EXISTS` devuelven los mismos clientes
            con el mismo anti semi join. Aun así, `NOT EXISTS` es la forma segura: sigue
            respondiendo bien si algún día la columna admite `NULL`.
          url: https://learn.microsoft.com/sql/t-sql/language-elements/exists-transact-sql
          link: EXISTS (Transact-SQL)

    - id: pagination
      name: Paginación
      question: ¿Por qué la página 10,000 tarda más que la primera?
      text: >-
        Los pedidos de 20 en 20, del más reciente al más antiguo. A usa `OFFSET … FETCH`; B,
        keyset: sigue desde la última fila de la página anterior. Mueve la página y cambia el
        tamaño de la tabla.
      labels:
        offset: OFFSET
        keyset: Keyset
      controls:
        page:
          label: Página
          format: "{value} de {total}"
      notes:
        - id: offset
          title: "`OFFSET` lee lo que salta"
          text: >-
            Para entregar una página, `OFFSET` recorre el índice desde el pedido más reciente, lee
            todas las filas de las páginas anteriores y las descarta: las lecturas crecen con el
            número de página. Keyset busca directo la última fila de la página anterior y lee solo
            las 20 que entrega, en la página que sea. En EF Core, `Skip` y `Take` generan este
            mismo `OFFSET … FETCH`.
          url: https://learn.microsoft.com/ef/core/querying/pagination#offset-pagination
          link: Paginación por desplazamiento
        - id: first-page
          title: En la primera página son iguales
          text: >-
            En la primera página no hay una fila anterior de dónde seguir: las dos consultas leen
            los primeros 20 pedidos del índice. La diferencia aparece al avanzar.
        - id: tuples
          title: Keyset necesita un orden único
          text: >-
            Dos pedidos pueden tener la misma fecha, y con un orden solo por `OrderDate` uno se
            saltaría entre páginas. Por eso el `ORDER BY` y la condición llevan `Id` como desempate.
            A cambio, keyset no salta a una página cualquiera: va a la siguiente o a la anterior.
          url: https://learn.microsoft.com/ef/core/querying/pagination#keyset-pagination
          link: Paginación por conjunto de claves

    - id: tracking
      name: AsNoTracking
      question: ¿Qué ahorra `AsNoTracking` si el SQL es el mismo?
      text: >-
        Los pedidos de un periodo, para mostrarlos sin modificarlos. A los carga con seguimiento de
        cambios, como hace EF Core por defecto; B usa `AsNoTracking` o una proyección. Cambia el
        periodo para ver cómo crecen el tiempo y la memoria en .NET.
      labels:
        tracked: Con seguimiento
        no-tracking: AsNoTracking
        projection: Proyección
      controls:
        query:
          label: Consulta de B
          options: { no-tracking: AsNoTracking, projection: Proyección }
      notes:
        - id: same-sql
          title: El SQL es el mismo
          text: >-
            `AsNoTracking` no cambia la consulta: el plan, las lecturas y el tiempo en la base son
            iguales. La diferencia está en .NET: con seguimiento, EF Core guarda cada entidad en el
            contexto con una copia de sus valores originales, para detectar los cambios en
            `SaveChanges`. Sin él, materializa más rápido y usa menos memoria.
          url: https://learn.microsoft.com/ef/core/querying/tracking#no-tracking-queries
          link: Consultas sin seguimiento
        - id: projection
          title: La proyección cambia también el SQL
          text: >-
            Con `Select` a un DTO, EF Core pide tres columnas en lugar de ocho.
            `IX_Orders_OrderDate` las tiene todas, así que la base hace un seek sin Key Lookup ni
            recorrer la tabla, y en .NET no hay entidades que registrar.
          url: https://learn.microsoft.com/ef/core/performance/efficient-querying#project-only-properties-you-need
          link: Proyectar solo las propiedades que se usan
        - id: identity
          title: Sin seguimiento no hay resolución de identidad
          text: >-
            Con seguimiento, el mismo cliente en diez pedidos es un solo objeto. Sin seguimiento,
            cada fila crea el suyo. Si necesitas lo primero sin registrar cambios, existe
            `AsNoTrackingWithIdentityResolution`.
          url: https://learn.microsoft.com/ef/core/querying/tracking#identity-resolution
          link: Resolución de identidad
        - id: default
          title: Sin seguimiento por defecto
          text: >-
            Si un contexto solo lee, `UseQueryTrackingBehavior(QueryTrackingBehavior.NoTracking)`
            en su configuración vuelve todas sus consultas sin seguimiento, y `AsTracking()` lo
            activa en la que lo necesite.
          url: https://learn.microsoft.com/ef/core/querying/tracking#configuring-the-default-tracking-behavior
          link: Configurar el seguimiento por defecto

