  how_title: Cómo funciona esta demo
  how_text: >-
    No hay un SQL Server detrás: cada número sale de un modelo en TypeScript. El modelo calcula
    cuántas páginas de 8 KB ocupan la tabla y cada índice, la profundidad de su árbol B y las filas
    de cada periodo; con eso estima el costo de cada operador con fórmulas como las del optimizador
    y se queda con el plan más barato, así que el punto de inflexión y los Key Lookup aparecen
    solos. Las lecturas siguen las reglas de SQL Server; los tiempos dependen del disco, la memoria
    y la red de cada servidor, así que aquí sirven para comparar, no para predecir. Para medir tus
    consultas, usa `SET STATISTICS IO, TIME ON` y el plan de ejecución real en SSMS.
  source_label: El código de esta demo está en GitHub
  source_url: https://github.com/RafaelLeonTorres/mi-sitio2/tree/main/labs/sql

en:
  tabs_label: Scenarios
  nojs: >-
    Without JavaScript, each scenario shows its two queries with the initial values and the
    explanation. The controls, execution plans, and measurements need JavaScript.
  linq_title: The EF Core code
  notes_title: Why it changes
  doc_label: "On Microsoft Learn:"
  scenarios:
    - id: sargability
      name: SARGability
      question: Why doesn't `YEAR(OrderDate) = 2026` seek on the index?
      text: >-
        The orders from a period, written two ways. A wraps the column in `YEAR()` (and in
        `MONTH()` and `DAY()`); B compares it with a date range. Change the table size, the period,
        the columns, and the index to see when each query seeks on the index and when it scans all
        of it.
      labels:
        function: Function on the column
        range: Date range
      controls:
        columns:
          label: Columns
          options: { narrow: "Id, OrderDate, Total", all: "All (*)" }
        index:
          label: IX_Orders_OrderDate exists
      notes:
        - id: function
          title: The function hides the column
          text: >-
            The index is sorted by `OrderDate`, not by `YEAR(OrderDate)`, so for A, SQL Server
            computes the function on every row and scans the whole index (Index Scan). B compares
            the column as it is: it goes down the tree to the first date in the range and reads only
            the ones that match (Index Seek). A condition that allows that kind of search is called
            SARGable, from *search argument*. In EF Core, `o.OrderDate.Year == 2026` translates to
            `DATEPART(year, [o].[OrderDate]) = 2026`, with the same problem.
          url: https://learn.microsoft.com/sql/relational-databases/sql-server-index-design-guide
          link: Index architecture and design guide
        - id: no-index
          title: Without an index, both read the table
          text: >-
            Without `IX_Orders_OrderDate` there's no index sorted by date, so the range has nowhere
            to seek: both queries read the whole table (Clustered Index Scan) with the same number
            of reads. A takes a little longer because it computes the functions on every row.
        - id: tipping
          title: The tipping point
          text: >-
            With `SELECT *`, the index doesn't have every column, so each row it finds needs a Key
            Lookup into the table. With many rows, reading the whole table is cheaper for the
            optimizer than one lookup per row, so B scans too even though it could seek. Change the
            period to a day to see the seek with its Key Lookups.
        - id: lookups
          title: One Key Lookup per row
          text: >-
            The index finds the rows in the range, but `SELECT *` asks for columns it doesn't have:
            for each row, SQL Server fetches the rest from the table (Key Lookup). With few rows
            that pays off; with many, the optimizer prefers reading the table. If the query always
            asks for the same columns, `INCLUDE` adds them to the index.
          url: https://learn.microsoft.com/sql/relational-databases/indexes/create-indexes-with-included-columns
          link: Create indexes with included columns
        - id: covering
          title: The index covers the query
          text: >-
            `IX_Orders_OrderDate` has `OrderDate` as its key, `Total` in `INCLUDE`, and, like every
            nonclustered index, the clustered key's `Id`. That's enough to answer
            `SELECT Id, OrderDate, Total` without touching the table, so B reads only the pages in
            the range.
          url: https://learn.microsoft.com/sql/relational-databases/indexes/create-indexes-with-included-columns
          link: Create indexes with included columns
        - id: cast
          title: "`CAST(OrderDate AS date)` is the exception"
          text: >-
            Not every function prevents a seek: SQL Server turns
            `CAST(OrderDate AS date) = '20261015'` into a range and seeks. It's a special case; the
            explicit range, from the start (`>=`) up to before the next day (`<`), works the same
            for a day, a month, or a year and includes every time on the last day.

    - id: indexes
      name: Indexes
      question: What changes with an index on `CustomerId`, and with `INCLUDE`?
      text: >-
        One customer's orders, with `WHERE CustomerId = @CustomerId`. In A the table only has its
        primary key; in B it has `IX_Orders_CustomerId`, with just the key or with
        `INCLUDE (OrderDate, Total)`. A also shows the index that SSMS suggests.
      labels:
        no-index: No index
        key: Index on CustomerId
        include: Index with INCLUDE
      controls:
        index:
          label: B's index
          options: { key: Key only, include: With INCLUDE }
      notes:
        - id: lookups
          title: The key alone means going back to the table
          text: >-
            With `IX_Orders_CustomerId`, SQL Server finds the customer's orders in a few pages, but
            `OrderDate` and `Total` aren't in the index. Each order is a Key Lookup into the table,
            and since the customer bought on different dates, each one lands on a different page.
          url: https://learn.microsoft.com/sql/relational-databases/indexes/create-indexes-with-included-columns
          link: Create indexes with included columns
        - id: include
          title: "`INCLUDE` completes the index"
          text: >-
            `INCLUDE` columns are stored only in the index's leaf level: they can't be used to seek
            or sort, but they avoid the Key Lookup. B goes down the tree and finds the customer's
            orders together in the leaf pages.
          url: https://learn.microsoft.com/sql/relational-databases/indexes/create-indexes-with-included-columns
          link: Create indexes with included columns
        - id: missing
          title: The missing index suggestion
          text: >-
            When the optimizer misses an index, SSMS suggests one in green above the plan, with a
            `CREATE NONCLUSTERED INDEX` and its estimated impact. It's a starting point, not a
            recipe: it's computed for this query alone, it has to be combined with the indexes you
            already have, and every new index is maintained on each `INSERT`, `UPDATE`, and
            `DELETE`.
          url: https://learn.microsoft.com/sql/relational-databases/indexes/tune-nonclustered-missing-index-suggestions
          link: Tune nonclustered indexes with missing index suggestions

    - id: n-plus-one
      name: N+1
      question: How much does fetching each order's customer separately cost?
      text: >-
        The latest orders with their customer's name, in EF Core. A loads the orders and then each
        customer with `FindAsync`, one query per customer; B gets everything in a single query,
        with a projection or with `Include`. Change how many orders are shown and the network
        latency.
      labels:
        loop: One query per customer
        include: With Include
        projection: With a projection
      controls:
        count:
          label: Orders
          format: "{value}"
        rtt:
          label: Network latency
          format: "{value} ms"
        loading:
          label: B's query
          options: { projection: Projection, include: Include }
      notes:
        - id: round-trips
          title: The round trips add up
          text: >-
            Each of A's queries is fast in the database: finding a customer by its key reads three
            pages. But each one is a round trip between the application and the database, and the
            time grows linearly with the orders and the latency. B pays for a single trip.
          url: https://learn.microsoft.com/ef/core/performance/efficient-querying#load-related-entities-eagerly-when-possible
          link: Efficient querying in EF Core
        - id: projection
          title: A projection asks only for what's used
          text: >-
            With `Select` into a DTO, EF Core builds a `JOIN` that asks for three columns and tracks
            nothing in the context: it's the lightest way to get the orders with the customer's
            name.
          url: https://learn.microsoft.com/ef/core/performance/efficient-querying#project-only-properties-you-need
          link: Project only the properties you need
        - id: include
          title: "`Include` brings full entities"
          text: >-
            With `Include`, EF Core also builds a `JOIN` and fixes the N+1, but it fills each
            `Order` and its `Customer` with every column and tracks them in the context. That's
            worth it when you're going to modify them; to display them, a projection transfers and
            keeps less.
          url: https://learn.microsoft.com/ef/core/querying/related-data/eager
          link: Eager loading of related data
        - id: lazy
          title: Lazy loading hides the N+1
          text: >-
            With lazy loading, reading `order.Customer.Name` inside a loop is enough to send the
            same query for each customer, with nothing in the code to show it. EF Core doesn't turn
            it on by default, and its docs recommend avoiding it for this reason.
          url: https://learn.microsoft.com/ef/core/performance/efficient-querying#beware-of-lazy-loading
          link: Beware of lazy loading
        - id: split
          title: With collections, `AsSplitQuery`
          text: >-
            If `Include` loads a collection, like each order's lines, the `JOIN` repeats the order's
            columns on every row (the cartesian explosion). `AsSplitQuery` splits it into one query
            per collection: a few round trips, no repeated data, and never one per order.
          url: https://learn.microsoft.com/ef/core/querying/single-split-queries
          link: Single vs. split queries

    - id: joins
      name: JOINs and subqueries
      question: "`IN`, `EXISTS`, or `JOIN`? And what happens with `NOT IN` and `NULL`s?"
      text: >-
        Two questions about customers and their October 2026 orders: who bought and who didn't. For
        the first, compare `IN` or `EXISTS` with a `JOIN`; for the second, `NOT IN` with
        `NOT EXISTS`, with guest orders that have no customer.
      labels:
        in: IN
        exists: EXISTS
        join: JOIN
        join-distinct: JOIN with DISTINCT
        not-in: NOT IN
        not-exists: NOT EXISTS
      controls:
        question:
          label: Question
          options: { with: Bought in October, without: Didn't buy in October }
        subquery:
          label: A's subquery
          options: { in: IN, exists: EXISTS }
        distinct:
          label: DISTINCT on the JOIN
        guests:
          label: There are guest orders (CustomerId NULL)
      notes:
        - id: semi
          title: "`IN` and `EXISTS` ask the same question"
          text: >-
            To the optimizer, `IN (subquery)` and `EXISTS` ask the same thing: does this customer
            have at least one order? Both end in the same plan, a semi join, which returns each
            customer once, whether they have one order in October or ten.
          url: https://learn.microsoft.com/sql/relational-databases/showplan-logical-and-physical-operators-reference
          link: Showplan logical and physical operators reference
        - id: duplicates
          title: The `JOIN` repeats customers
          text: >-
            A `JOIN` returns one row per order, so a customer with three orders in October shows up
            three times: 12,420 rows for 10,998 customers. It isn't another way to write `IN`; it's
            a different question. Turn on `DISTINCT` to see what happens.
        - id: same-plan
          title: With `DISTINCT`, the same plan
          text: >-
            With `DISTINCT`, the `JOIN` asks again who bought, and the optimizer reaches the same
            semi join as with `IN` or `EXISTS`: the same reads and the same rows. Use whichever form
            reads more clearly.
        - id: "null"
          title: "`NOT IN` and a single `NULL`"
          text: >-
            `NOT IN` compares each customer with every value from the subquery. If one is `NULL`,
            like a guest order's `CustomerId`, the comparison is *unknown* and no customer
            qualifies: the query returns 0 rows, with no error at all. `NOT EXISTS` only asks
            whether the customer has orders, so `NULL`s don't affect it.
          url: https://learn.microsoft.com/sql/t-sql/language-elements/in-transact-sql
          link: IN (Transact-SQL)
        - id: not-null
          title: Without `NULL`s, the same answer
          text: >-
            If `CustomerId` doesn't allow `NULL`, `NOT IN` and `NOT EXISTS` return the same
            customers with the same anti semi join. Even so, `NOT EXISTS` is the safe form: it keeps
            answering correctly if the column ever allows `NULL`.
          url: https://learn.microsoft.com/sql/t-sql/language-elements/exists-transact-sql
          link: EXISTS (Transact-SQL)

    - id: pagination
      name: Pagination
      question: Why does page 10,000 take longer than the first one?
      text: >-
        Orders 20 at a time, from newest to oldest. A uses `OFFSET … FETCH`; B uses keyset: it
        continues from the last row of the previous page. Move the page and change the table size.
      labels:
        offset: OFFSET
        keyset: Keyset
      controls:
        page:
          label: Page
          format: "{value} of {total}"
      notes:
        - id: offset
          title: "`OFFSET` reads what it skips"
          text: >-
            To return a page, `OFFSET` walks the index from the newest order, reads every row of the
            previous pages, and throws them away: the reads grow with the page number. Keyset seeks
            straight to the last row of the previous page and reads only the 20 it returns,
            whatever the page. In EF Core, `Skip` and `Take` generate this same `OFFSET … FETCH`.
          url: https://learn.microsoft.com/ef/core/querying/pagination#offset-pagination
          link: Offset pagination
        - id: first-page
          title: On the first page they're the same
          text: >-
            On the first page there's no previous row to continue from: both queries read the first
            20 orders in the index. The difference shows up as you move forward.
        - id: tuples
          title: Keyset needs a unique order
          text: >-
            Two orders can have the same date, and with an order by `OrderDate` alone, one could be
            skipped between pages. That's why the `ORDER BY` and the condition use `Id` as a
            tiebreaker. In exchange, keyset can't jump to any page: it goes to the next or the
            previous one.
          url: https://learn.microsoft.com/ef/core/querying/pagination#keyset-pagination
          link: Keyset pagination

    - id: tracking
      name: AsNoTracking
      question: What does `AsNoTracking` save if the SQL is the same?
      text: >-
        The orders from a period, to display them without changing them. A loads them with change
        tracking, as EF Core does by default; B uses `AsNoTracking` or a projection. Change the
        period to see how time and memory in .NET grow.
      labels:
        tracked: With tracking
        no-tracking: AsNoTracking
        projection: Projection
      controls:
        query:
          label: B's query
          options: { no-tracking: AsNoTracking, projection: Projection }
      notes:
        - id: same-sql
          title: The SQL is the same
          text: >-
            `AsNoTracking` doesn't change the query: the plan, the reads, and the time in the
            database are the same. The difference is in .NET: with tracking, EF Core keeps each
            entity in the context with a copy of its original values, to detect changes in
            `SaveChanges`. Without it, materializing is faster and uses less memory.
          url: https://learn.microsoft.com/ef/core/querying/tracking#no-tracking-queries
          link: No-tracking queries
        - id: projection
          title: A projection changes the SQL too
          text: >-
            With `Select` into a DTO, EF Core asks for three columns instead of eight.
            `IX_Orders_OrderDate` has all of them, so the database seeks without Key Lookups or
            reading the table, and in .NET there are no entities to track.
          url: https://learn.microsoft.com/ef/core/performance/efficient-querying#project-only-properties-you-need
          link: Project only the properties you need
        - id: identity
          title: No tracking, no identity resolution
          text: >-
            With tracking, the same customer in ten orders is a single object. Without it, each row
            creates its own. If you need the former without tracking changes, there's
            `AsNoTrackingWithIdentityResolution`.
          url: https://learn.microsoft.com/ef/core/querying/tracking#identity-resolution
          link: Identity resolution
        - id: default
          title: No tracking by default
          text: >-
            If a context only reads, `UseQueryTrackingBehavior(QueryTrackingBehavior.NoTracking)` in
            its configuration makes all its queries no-tracking, and `AsTracking()` turns tracking
            on for the query that needs it.
          url: https://learn.microsoft.com/ef/core/querying/tracking#configuring-the-default-tracking-behavior
          link: Configuring the default tracking behavior

