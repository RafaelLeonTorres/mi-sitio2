  how_title: How this demo works
  how_text: >-
    There's no SQL Server behind this page: every number comes from a model in TypeScript. The model
    works out how many 8 KB pages the table and each index take, how deep each B-tree is, and how
    many rows fall in each period; with that, it estimates each operator's cost with formulas like
    the optimizer's and keeps the cheapest plan, so the tipping point and the Key Lookups show up
    on their own. The reads follow SQL Server's rules; the times depend on each server's disk,
    memory, and network, so here they're for comparing, not predicting. To measure your own
    queries, use `SET STATISTICS IO, TIME ON` and the actual execution plan in SSMS.
  source_label: This demo's code is on GitHub
  source_url: https://github.com/RafaelLeonTorres/mi-sitio2/tree/main/labs/sql
