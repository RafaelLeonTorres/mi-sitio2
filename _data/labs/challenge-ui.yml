    not_passed: Not passed
    timeout: >-
      It stopped after {seconds} seconds without finishing. Check that the query finishes; the
      engine was restarted.
    engine_error: "PostgreSQL couldn't run in the browser: {message}"
    error: Error
    error_line: Error on line {line}
    error_detail: Detail
    error_hint: Hint
    error_kept_going: As in SSMS, the statements after the error were run.
    expected: Expected
    actual: Got
    actual_table: How the tables ended up
    rows: "{n} rows"
    row: 1 row
    more_rows: And {n} more rows.
    input: The case's data
    mismatch:
      no-result: Your code didn't return the result of any query.
      columns: "{expected} columns were expected and {actual} came back."
      row-count: "{expected} rows were expected and {actual} came back."
      values: Row {row} of the expected result doesn't show up in what you got.
      order: The rows are right, but not in the order the problem asks for. The first one out of place is row {row}.
    refusal:
      empty: Write your code before running it.
      single-query: This challenge checks the plan of a single query. Leave just the SELECT.
      blocked: "This doesn't run on PostgreSQL:"
    line: Line {line}
    plan: PostgreSQL plan
    rules: What's checked in the plan
    rule_ok: Met
    rule_failed: Not met
    notes: What was translated for PostgreSQL

  rules:
    index: Reads `{table}` with an index and a search condition, without scanning the table.
    index-only: Answers from the index, without visiting the `{table}` table (Index Only Scan).
    semi-join: Uses a semi join, which lets each row through as soon as it finds a match.
    no-subplan: Doesn't run a subquery for every row (SubPlan).
    no-dedupe: Doesn't group the rows to remove duplicates.
    max-rows: Reads at most {max} rows from `{table}`.

  blocked:
    top: >-
      `TOP` doesn't exist in PostgreSQL. Use `ORDER BY … OFFSET 0 ROWS FETCH NEXT n ROWS ONLY`, which
      runs in SQL Server too.
    variable: >-
      `@` variables (`DECLARE @x`) don't exist here, outside a procedure. Write the values directly
      in the query.
    try-catch: >-
      `TRY…CATCH`, `RAISERROR`, and `THROW` don't exist in PostgreSQL. To have an error undo the
      changes, use a transaction: here, an error inside `BEGIN TRANSACTION` aborts it and `COMMIT`
      undoes it.
    procedure: >-
      Stored procedures (`CREATE PROCEDURE`, `EXEC`) don't run here. Write the statements directly.
    control-flow: >-
      `IF` and `WHILE` don't exist in PostgreSQL outside a function. Use `CASE`, a `WHERE`, or a
      single statement that covers the cases.
    output: >-
      `OUTPUT INSERTED` and `OUTPUT DELETED` don't exist in PostgreSQL; there you use `RETURNING`.
    print: "`PRINT` doesn't exist in PostgreSQL. Use a `SELECT` to see a value."
    update-join: >-
      PostgreSQL doesn't accept `UPDATE alias SET … FROM table AS alias JOIN …`. Keep the table in
      the `UPDATE` and the others in the `FROM` (`UPDATE Products SET … FROM Categories AS c WHERE
      c.Id = Products.CategoryId`), which runs in SQL Server too, or use a subquery in the `WHERE`.
    delete-join: >-
      PostgreSQL doesn't accept `DELETE alias FROM … JOIN …`. Use
      `DELETE FROM table WHERE EXISTS (…)` or `NOT EXISTS (…)`, which run in both engines.
    cte-target: >-
      PostgreSQL doesn't delete or update through a CTE. Use the CTE inside the `WHERE`:
      `DELETE FROM Customers WHERE Id IN (SELECT Id FROM d WHERE n > 1)`.
    convert-style: >-
      `CONVERT` with a style (the third argument) doesn't exist here. Use `CAST(x AS date)` or
      compare with a date range.

  notes:
    go: The `GO`s were removed; here all the code runs as a single batch.
    brackets: "`[Name]` was written as `\"name\"`, in double quotes and in lowercase."
    date-part: >-
      The date part of `DATEADD`, `DATEDIFF`, `DATEPART`, and `DATETRUNC` was put in quotes:
      `DATEADD('day', …)`.
    types: >-
      The SQL Server types were swapped for PostgreSQL's: `datetime2` is `timestamp`, `nvarchar` is
      `varchar`, and `bit` is `smallint`.
    nonclustered: "`NONCLUSTERED` was removed; in PostgreSQL every index is separate from the table."
    clustered: "`CLUSTERED` was removed; PostgreSQL doesn't keep the table sorted by an index."
    tran: "`TRAN` was written as `TRANSACTION`."
    identity: "`IDENTITY` was written as `GENERATED BY DEFAULT AS IDENTITY`."
    hints: Table hints like `WITH (NOLOCK)` were removed; PostgreSQL doesn't have them.
    string-agg: >-
      `STRING_AGG(…) WITHIN GROUP (ORDER BY …)` was written with the `ORDER BY` inside
      `STRING_AGG`.
    by-target: "`WHEN NOT MATCHED BY TARGET` was written as `WHEN NOT MATCHED`, which is the same."
    set-option: >-
      `SET NOCOUNT`, `SET XACT_ABORT`, and similar options were removed. PostgreSQL doesn't have
      them, and an error inside a transaction always aborts it.
    temp-table: >-
      Temporary tables (`#Name`) were created as regular tables: each run uses a new database.
    set-alias: >-
      The alias was removed from the columns the `SET` assigns (`p.Price = …` is `Price = …`).
    convert: "`CONVERT(type, x)` was written as `CAST(x AS type)`."
    apply: >-
      `CROSS APPLY` was written as `CROSS JOIN LATERAL`, and `OUTER APPLY` as `LEFT JOIN LATERAL …
      ON TRUE`.

  playground:
    editor: Your code
    editor_label: SQL code
    database: The sample database
    database_text: >-
      Every time you run, the database starts over with these tables and their rows. Changes aren't
      kept from one run to the next.
    run: Run
    keys: Ctrl+Enter runs. To leave the editor with the keyboard, press Esc and then Tab.
    explain: Show the plan of the last query
    generate: Fill Customers and Orders with 6,000 customers and 50,000 orders, to see plans like with real data
    reset: Back to the example
    reset_confirm: Replace your code with the example? What you wrote will be lost.
    statement: Statement {n}, line {line}
    affected: "{n} rows affected."
    affected_one: 1 row affected.
    done: Done, with no rows to show.
    empty: Write a query and run it.
    statements: "{n} statements in {time}."
    statements_one: "1 statement in {time}."
