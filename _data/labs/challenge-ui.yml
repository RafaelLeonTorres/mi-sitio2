    submit: Submit
    reset: Back to the starting code
    reset_confirm: Replace your code with the starting code? What you wrote will be lost.
    keys: Ctrl+Enter runs and Ctrl+Shift+Enter submits. To leave the editor with the keyboard, press Esc and then Tab.
    saved: Your code is saved in this browser.
    results: Results
    results_empty: Run your code to see the results here.
    engine_title: The engine
    engine: >-
      Your code runs in your browser, on PostgreSQL (PGlite), not on SQL Server. The most common
      T-SQL functions work by name (`YEAR`, `MONTH`, `ISNULL`, `IIF`, `LEN`, `CHARINDEX`, `DATEADD`,
      `DATEDIFF`, `DATEPART`, `GETDATE`…), and a minimal translation covers `[Names]`, the types,
      `CONVERT`, and `CROSS APPLY`. Whatever doesn't run here gets a message that says how to
      write it.
    differences_title: What's different from SQL Server
    differences:
      - >-
        Unquoted names are stored in lowercase: `OrderCount` comes out as `ordercount`. When
        checking, columns count by position, not by name.
      - >-
        `TOP`, `@` variables, `IF`, `WHILE`, `TRY…CATCH`, and stored procedures don't run. To limit
        rows, `OFFSET 0 ROWS FETCH NEXT n ROWS ONLY` works in both.
      - >-
        Strings are case- and accent-sensitive: `'ana' = 'Ana'` is false, as with a `_CS_AS`
        collation in SQL Server.
      - >-
        When sorting, PostgreSQL puts `NULL`s last with `ASC` and first with `DESC`; SQL Server does
        the opposite.
      - >-
        As in SSMS, each statement is committed on its own unless it's inside `BEGIN TRANSACTION`.
        An error inside a transaction aborts all of it, as with `SET XACT_ABORT ON`.
      - >-
        The plans are PostgreSQL's (`EXPLAIN ANALYZE`) and their names are different: Seq Scan
        instead of Table Scan, Index Scan instead of Index Seek.
