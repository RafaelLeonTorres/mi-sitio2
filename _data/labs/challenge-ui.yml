    active: Interview in progress
    clock: Time left
    progress: "{solved} of {total} solved"
    challenges: The challenges
    open: Open
    finish: End the interview
    finish_confirm: End the interview now? The challenges you haven't solved stay unsolved.
    banner: Interview mode
