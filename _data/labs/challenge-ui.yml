  rules:
    index: Reads `{table}` with an index and a search condition, without scanning the table.
    index-only: Answers from the index, without visiting the `{table}` table (Index Only Scan).
    semi-join: Uses a semi join, which lets each row through as soon as it finds a match.
    no-subplan: Doesn't run a subquery for every row (SubPlan).
    no-dedupe: Doesn't group the rows to remove duplicates.
    max-rows: Reads at most {max} rows from `{table}`.

  blocked:
    top: >-
      This use of `TOP` isn't translated: `TOP … PERCENT`, `TOP` with an expression or a variable,
      `TOP` in `DELETE`, `UPDATE`, or `INSERT`, or in a query with `UNION`, `INTERSECT`, or
      `EXCEPT`. Use `ORDER BY … OFFSET 0 ROWS FETCH NEXT n ROWS ONLY`, which runs in SQL Server too,
      or put the `SELECT TOP` in a subquery: `DELETE FROM t WHERE Id IN (SELECT TOP 5 Id FROM t
      ORDER BY Id)`.
    variable: >-
      `@` variables (`DECLARE @x`) don't exist here, outside a procedure. Write the values directly
      in the query.
    try-catch: >-
      `TRY…CATCH`, `RAISERROR`, and `THROW` don't exist in PostgreSQL. To have an error undo the
      changes, use a transaction: here, an error inside `BEGIN TRANSACTION` aborts it and `COMMIT`
      undoes it.
    procedure: >-
      Stored procedures (`CREATE PROCEDURE`, `EXEC`) don't run here. Write the statements directly.
    control-flow: >-
      `IF` and `WHILE` don't exist in PostgreSQL outside a function. Use `CASE`, a `WHERE`, or a
      single statement that covers the cases.
    output: >-
      `OUTPUT … INTO` a table or a table variable isn't translated. Use `OUTPUT` without `INTO`:
      it returns the rows like a `SELECT` (here it's written `RETURNING`).
    print: "`PRINT` doesn't exist in PostgreSQL. Use a `SELECT` to see a value."
    update-join: >-
      This `UPDATE` with a `JOIN` isn't translated: `INNER JOIN` and `CROSS JOIN` are, but not
      `LEFT`, `RIGHT`, or `FULL JOIN`. Use a subquery in the `SET` (`UPDATE Products SET Price =
      (SELECT … WHERE …)`), or keep the table in the `UPDATE` and the others in the `FROM`
      (`UPDATE Products SET … FROM Categories AS c WHERE c.Id = Products.CategoryId`), which runs in
      SQL Server too.
    delete-join: >-
      This `DELETE` with a `JOIN` isn't translated. Use `DELETE FROM table WHERE EXISTS (…)` or
      `NOT EXISTS (…)`, which run in both engines.
    cte-target: >-
      PostgreSQL doesn't delete or update through a CTE. Use the CTE inside the `WHERE`:
      `DELETE FROM Customers WHERE Id IN (SELECT Id FROM d WHERE n > 1)`.
    convert-style: >-
      This `CONVERT` with a style isn't translated. Styles 23, 101 to 105, 108, 110 to 112, 120, and
      121 are translated to format a date (`CONVERT(varchar(10), date, 103)`), and the same ones,
      except 108, to read a text as `date`, `datetime`, or `datetime2`. For anything else use
      `CAST(x AS type)` or compare with a date range.

  notes:
    go: The `GO`s were removed; here all the code runs as a single batch.
    brackets: "`[Name]` was written as `\"name\"`, in double quotes and in lowercase."
    date-part: >-
      The date part of `DATEADD`, `DATEDIFF`, `DATEPART`, and `DATETRUNC` was put in quotes:
      `DATEADD('day', …)`.
    types: >-
      The SQL Server types were swapped for PostgreSQL's: `datetime2` is `timestamp`, `nvarchar` is
      `varchar`, and `bit` is `smallint`.
    nonclustered: "`NONCLUSTERED` was removed; in PostgreSQL every index is separate from the table."
    clustered: "`CLUSTERED` was removed; PostgreSQL doesn't keep the table sorted by an index."
    tran: "`TRAN` was written as `TRANSACTION`."
    identity: "`IDENTITY` was written as `GENERATED BY DEFAULT AS IDENTITY`."
    hints: Table hints like `WITH (NOLOCK)` were removed; PostgreSQL doesn't have them.
    string-agg: >-
      `STRING_AGG(…) WITHIN GROUP (ORDER BY …)` was written with the `ORDER BY` inside
      `STRING_AGG`.
    by-target: "`WHEN NOT MATCHED BY TARGET` was written as `WHEN NOT MATCHED`, which is the same."
    set-option: >-
      `SET NOCOUNT`, `SET XACT_ABORT`, and similar options were removed. PostgreSQL doesn't have
      them, and an error inside a transaction always aborts it.
    temp-table: >-
      Temporary tables (`#Name`) were created as regular tables: each run uses a new database.
    set-alias: >-
      The alias was removed from the columns the `SET` assigns (`p.Price = …` is `Price = …`).
    convert: "`CONVERT(type, x)` was written as `CAST(x AS type)`."
    convert-style: >-
      `CONVERT(type, x, style)` was written with a function that uses that style's format:
      `CONVERT(varchar(10), date, 103)` gives `05/03/2024`, and `CONVERT(date, text, 103)` reads a
      text with day, month, and year.
    try-cast: >-
      `TRY_CAST(x AS type)` and `TRY_CONVERT(type, x)` were written with a `CAST` that only runs if
      the text is a value of the type: otherwise they give `NULL`.
    top: >-
      `TOP (n)` was written as `FETCH FIRST n ROWS ONLY` at the end of the query, and
      `TOP (n) WITH TIES` as `FETCH FIRST n ROWS WITH TIES`.
    merge: "`MERGE table` was written as `MERGE INTO table`: PostgreSQL requires the `INTO`."
    output: >-
      `OUTPUT inserted.x` and `OUTPUT deleted.x` were written as `RETURNING new.x` and `RETURNING
      old.x`, at the end of the statement; `$action` as `merge_action()`.
    update-join: >-
      `UPDATE alias SET … FROM … JOIN …` was written with the table being updated in the `UPDATE`
      and the others in the `FROM`; the `ON` conditions moved to the `WHERE`.
    delete-join: >-
      `DELETE alias FROM … JOIN …` was written as `DELETE FROM table WHERE ctid IN (SELECT
      alias.ctid FROM …)`: `ctid` is PostgreSQL's row identifier, and the same rows are deleted.
    recursive: >-
      `RECURSIVE` was added to `WITH`: PostgreSQL requires it when a CTE refers to itself, and SQL
      Server doesn't.
    option: >-
      `OPTION (…)` was removed: PostgreSQL doesn't have those hints, or the 100-level recursion
      limit of `MAXRECURSION`.
    apply: >-
      `CROSS APPLY` was written as `CROSS JOIN LATERAL`, and `OUTER APPLY` as `LEFT JOIN LATERAL …
      ON TRUE`.

