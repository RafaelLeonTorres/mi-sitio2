# Textos de los retos de código en español (es) e inglés (en): el catálogo, la página de un reto,
# los resultados, los playgrounds, el modo entrevista y los mensajes de los motores de SQL y de C#
# (la sección `csharp`). `shared` trae el orden del catálogo, por lenguaje y categoría, y el código
# inicial del playground de SQL. Cada reto está en _data/labs/challenges/<id>.yml y su página la
# genera scripts/challenge-pages.mjs.
# Las dos partes deben tener las mismas claves; scripts/content-parity.test.ts lo revisa.
# En los textos, {n}, {total} y parecidos se cambian por su valor en TypeScript.

