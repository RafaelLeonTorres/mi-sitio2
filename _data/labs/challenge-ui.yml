  csharp:
    challenge:
      editor_label: Your solution's C# code
      prelude: What the challenge provides
      prelude_text: >-
        These types are already declared and compiled along with your code: use them without
        copying them.
      rules: What's checked in the code
      call: Call
      returns: Returns
      throws_title: Throws
      throws: "`{type}`"
      unordered: The order of the result's elements doesn't matter.
      harness: How it's checked
      harness_text: >-
        In each case, this code calls yours; what it returns is what's compared with the expected
        result.
      engine: |-
        Your code runs in your browser: Roslyn, the C# compiler, compiles it inside .NET on
        WebAssembly, and each case calls your method with its arguments. Nothing is sent to a
        server.

        What your method returns is converted to JSON and compared with the expected result:
        numbers by value (with a tiny tolerance for `double`), objects by their property names, and
        lists in order, unless the challenge says otherwise.
      differences_title: What's different from a console project
      differences:
        - >-
          The `using` directives for `System`, `System.Collections.Generic`, `System.IO`,
          `System.Linq`, `System.Text`, `System.Threading`, and `System.Threading.Tasks` are already
          there. Other namespaces need their `using`.
        - >-
          The collections (concurrent ones too), LINQ, text, regular expressions, `BigInteger`, and
          the channels in `System.Threading.Channels` are available. There's no network, no files on
          disk, and no NuGet packages.
        - >-
          Everything runs on a single thread. `await`, `Task.Delay`, and `Task.WhenAll` work, but
          blocking the thread to wait (`.Result`, `.Wait()`) throws `PlatformNotSupportedException`,
          and the `Thread` class isn't there. There's no input either: `Console.ReadLine()` throws the
          same exception.
        - >-
          There's no culture data, as in .NET with `InvariantGlobalization`: numbers are written with
          the invariant culture (`1234.5`), and sorting text with the default comparer sorts it
          ordinally, so `"B"` comes before `"a"`.
        - >-
          Compiler and exception messages are in English, as in a .NET installation without
          language packs.
        - >-
          If your code throws an exception, you're told which method it happened in, but not which
          line: in the browser, the compiler doesn't produce debug symbols.
