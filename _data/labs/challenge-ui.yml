    reset: Volver al ejemplo
    reset_confirm: ¿Cambiar tu código por el ejemplo? Lo que escribiste se pierde.
    statement: Sentencia {n}, línea {line}
    affected: "{n} filas afectadas."
    affected_one: 1 fila afectada.
    done: Lista, sin filas que mostrar.
    empty: Escribe una consulta y ejecútala.
    statements: "{n} sentencias en {time}."
    statements_one: "1 sentencia en {time}."

  csharp:
    challenge:
      editor_label: Código C# de tu solución
      prelude: Lo que da el reto
      prelude_text: >-
        Estos tipos ya están declarados y se compilan junto con tu código: úsalos sin copiarlos.
      rules: Lo que se revisa del código
      call: Llamada
      returns: Devuelve
      throws_title: Lanza
      throws: "`{type}`"
      unordered: El orden de los elementos del resultado no importa.
      harness: Cómo se revisa
      harness_text: >-
        En cada caso, este código llama al tuyo; lo que devuelve es lo que se compara con el
        resultado esperado.
      engine: |-
        Tu código corre en tu navegador: Roslyn, el compilador de C#, lo compila dentro de .NET
        sobre WebAssembly, y cada caso llama a tu método con sus argumentos. Nada se envía a un
        servidor.

        Lo que devuelve tu método se convierte a JSON y se compara con el resultado esperado: los
        números por su valor (con una tolerancia mínima para `double`), los objetos por el nombre
        de sus propiedades y las listas en orden, salvo que el reto diga lo contrario.
      differences_title: Lo que cambia respecto a un proyecto de consola
      differences:
        - >-
          Ya están los `using` de `System`, `System.Collections.Generic`, `System.IO`, `System.Linq`,
          `System.Text`, `System.Threading` y `System.Threading.Tasks`. Los demás espacios de nombres
          se escriben con su `using`.
        - >-
          Están las colecciones (también las concurrentes), LINQ, el texto, las expresiones
          regulares, `BigInteger` y los canales de `System.Threading.Channels`. No hay red, ni
          archivos del disco, ni paquetes de NuGet.
        - >-
          Todo corre en un solo hilo. `await`, `Task.Delay` y `Task.WhenAll` funcionan, pero esperar
          bloqueando el hilo (`.Result`, `.Wait()`) lanza `PlatformNotSupportedException`, y la clase
          `Thread` no está. Tampoco hay entrada: `Console.ReadLine()` lanza la misma excepción.
        - >-
          No hay datos de culturas, como en .NET con `InvariantGlobalization`: los números se
          escriben con la cultura invariable (`1234.5`) y ordenar texto con el comparador por defecto
          es ordenarlo de forma ordinal, así que `"B"` va antes que `"a"`.
        - >-
          Los mensajes del compilador y de las excepciones salen en inglés, como en una instalación
          de .NET sin paquetes de idioma.
        - >-
          Si tu código lanza una excepción, se dice en qué método ocurrió, pero no en qué línea: en
          el navegador, el compilador no genera los símbolos de depuración.
    results:
      loading: Preparando .NET y el compilador de C# en tu navegador…
      loading_note: La primera vez se descargan unos 9 MB; después quedan en la caché del navegador.
      engine_error: "No se pudo correr .NET en el navegador: {message}"
      compile_failed: Tu código no compila.
      compiled: Compiló en {time}.
      diagnostic: Línea {line}, columna {column}
      diagnostic_prelude: En el código que da el reto
      diagnostic_harness: En el código que revisa
      entry:
        missing-type: >-
          No se encontró el tipo `{type}`, que es al que llama el reto. Deja su nombre como en el
          código inicial.
        missing-method: >-
          `{type}` no tiene un método `{method}`, que es al que llama el reto. Deja su nombre como en
          el código inicial.
        wrong-arity: >-
          Ningún `{method}` de `{type}` recibe la cantidad de argumentos con que lo llama el reto
          ({count}). Deja los parámetros como en el código inicial.
        generic-method: >-
          `{method}` no puede ser genérico: el reto lo llama con los tipos del código inicial.
      problem:
        by-ref: "El parámetro `{parameter}` no puede ser `ref`, `out` ni `in`: el reto le pasa un valor."
        missing-argument: "El caso no trae un valor para el parámetro `{parameter}`."
        bad-argument: >-
          El valor del caso no cabe en el parámetro `{parameter}`, de tipo `{type}`. Deja el tipo
          como en el código inicial.
        cannot-serialize: >-
