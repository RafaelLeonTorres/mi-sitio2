# Textos de los retos de código en español (es) e inglés (en): el catálogo, la página de un reto,
# los resultados, el playground y los mensajes del motor de SQL. `shared` trae el orden del
# catálogo y el código inicial del playground. Cada reto está en _data/labs/challenges/<id>.yml y
# su página la genera scripts/challenge-pages.mjs.
# Las dos partes deben tener las mismas claves; scripts/content-parity.test.ts lo revisa.
# En los textos, {n}, {total} y parecidos se cambian por su valor en TypeScript.

shared:
  catalog:
    - category: queries
      challenges:
        - employees-without-department
        - customers-without-orders
        - orders-per-customer
        - employees-earning-more-than-manager
        - second-highest-salary
        - departments-above-average
        - prices-by-date
        - first-order-per-customer
        - monthly-running-total
        - top-three-salaries
        - returning-customers
        - consecutive-days
    - category: optimization
      challenges:
        - sargable-year
        - sargable-isnull
        - union-all
        - create-index
        - sargable-arithmetic
        - conditional-aggregation
        - correlated-subquery
        - exists-instead-of-count
        - covering-index
        - keyset-pagination
    - category: changes
      challenges:
        - raise-prices
        - delete-orphan-lines
        - recalculate-totals
        - archive-old-orders
        - delete-duplicates
        - price-history
        - merge-products
        - transfer-transaction
  playground:
    starter: |
      SELECT c.Name, COUNT(o.Id) AS OrderCount, SUM(o.Total) AS Spent
      FROM Customers AS c
      LEFT JOIN Orders AS o ON o.CustomerId = c.Id
      GROUP BY c.Id, c.Name
      ORDER BY OrderCount DESC, c.Name;

