    expected_query: Lo mismo que devuelve la consulta, antes y después de tu índice.
    generated: "Además, la base se llena con:"
    generated_only: "La base se llena con:"
    no_rows: Sin filas
    cases_note: >-
      Ejecutar corre los ejemplos. Enviar corre {total} casos: los ejemplos y {more} más, que se
      muestran al enviar.
    cases_note_one: Ejecutar y Enviar corren el mismo caso, el ejemplo.
    hints: Pistas
    hint: Pista {n}
    next_hint: Ver la pista {n} de {total}
    solution: Solución
    show_solution: Ver la solución
    hide_solution: Ocultar la solución
    explanation: Por qué funciona
    editor: Tu solución
    editor_label: Código SQL de tu solución
    nojs: Para correr tu solución en el navegador hace falta JavaScript. Este es el código inicial.
    loading_editor: Cargando el editor…
    run: Ejecutar
    submit: Enviar
    reset: Volver al código inicial
    reset_confirm: ¿Cambiar tu código por el código inicial? Lo que escribiste se pierde.
    keys: Ctrl+Enter ejecuta y Ctrl+Shift+Enter envía. Para salir del editor con el teclado, Esc y luego Tab.
    saved: Tu código se guarda en este navegador.
    results: Resultados
    results_empty: Ejecuta tu código para ver aquí los resultados.
    engine_title: El motor
    engine: >-
      Tu código corre en tu navegador, en PostgreSQL (PGlite), no en SQL Server. Las funciones de
      T-SQL más comunes funcionan con su nombre (`YEAR`, `MONTH`, `ISNULL`, `IIF`, `LEN`,
      `CHARINDEX`, `DATEADD`, `DATEDIFF`, `DATEPART`, `GETDATE`…), y una traducción mínima cubre
      `[Nombres]`, los tipos, `CONVERT` y `CROSS APPLY`. Lo que no corre aquí recibe un mensaje
      que dice cómo escribirlo.
    differences_title: Lo que cambia respecto a SQL Server
    differences:
      - >-
        Los nombres sin comillas se guardan en minúsculas: `OrderCount` sale como `ordercount`. Al
        revisar, las columnas cuentan por su posición, no por su nombre.
      - >-
        `TOP`, las variables con `@`, `IF`, `WHILE`, `TRY…CATCH` y los procedimientos almacenados no
        corren. Para limitar filas, `OFFSET 0 ROWS FETCH NEXT n ROWS ONLY` funciona en los dos.
      - >-
        Las cadenas distinguen mayúsculas y acentos: `'ana' = 'Ana'` es falso, como con una
        intercalación `_CS_AS` de SQL Server.
      - >-
        Al ordenar, PostgreSQL pone los `NULL` al final con `ASC` y al principio con `DESC`; SQL
        Server, al revés.
      - >-
        Como en SSMS, cada sentencia se confirma sola si no está dentro de `BEGIN TRANSACTION`. Un
        error dentro de una transacción la aborta completa, como con `SET XACT_ABORT ON`.
      - >-
        Los planes son de PostgreSQL (`EXPLAIN ANALYZE`) y sus nombres son otros: Seq Scan en lugar
        de Table Scan, Index Scan en lugar de Index Seek.
    solved_title: Resuelto
    solved_text: Todos los casos pasan. Lee por qué funciona en la solución, o sigue con otro reto.
    next: "Siguiente: {title}"
    all: Todos los retos

  results:
    loading: Preparando PostgreSQL en tu navegador…
    loading_note: La primera vez se descargan unos 3 MB; después quedan en la caché del navegador.
    running: Corriendo el caso {n} de {total}…
    summary: "{passed} de {total} casos aprobados."
    sample_ok: Los ejemplos pasan. Envía tu solución para correr todos los casos.
    sample_failed: Todavía no pasan todos los ejemplos.
    failed: Hay casos que no pasan todavía.
    case: Caso {n}
    sample: ejemplo
    passed: Aprobado
    not_passed: No aprobado
    timeout: >-
      Se detuvo después de {seconds} segundos sin terminar. Revisa que la consulta termine; el motor
      se reinició.
    engine_error: "No se pudo correr PostgreSQL en el navegador: {message}"
    error: Error
    error_line: Error en la línea {line}
    error_detail: Detalle
    error_hint: Sugerencia
    error_kept_going: Como en SSMS, después del error se corrieron las sentencias que siguen.
    expected: Esperado
    actual: Obtenido
    actual_table: Cómo quedaron las tablas
    rows: "{n} filas"
    row: 1 fila
    more_rows: Y {n} filas más.
    input: Datos del caso
    mismatch:
      no-result: Tu código no devolvió el resultado de ninguna consulta.
      columns: Se esperaban {expected} columnas y llegaron {actual}.
      row-count: Se esperaban {expected} filas y llegaron {actual}.
      values: La fila {row} de lo esperado no aparece en lo obtenido.
      order: Las filas son las correctas, pero no en el orden que pide el enunciado. La primera fuera de lugar es la {row}.
    refusal:
      empty: Escribe tu código antes de correrlo.
      single-query: Este reto revisa el plan de una sola consulta. Deja solo el SELECT.
      blocked: "Esto no corre en PostgreSQL:"
    line: Línea {line}
    plan: Plan de PostgreSQL
    rules: Lo que se revisa del plan
    rule_ok: Cumple
    rule_failed: No cumple
    notes: Lo que se tradujo para PostgreSQL

  rules:
    index: Lee `{table}` con un índice y una condición de búsqueda, sin recorrer la tabla.
    index-only: Responde desde el índice, sin visitar la tabla `{table}` (Index Only Scan).
    semi-join: Usa un semi join, que deja pasar cada fila en cuanto encuentra una coincidencia.
    no-subplan: No corre una subconsulta por cada fila (SubPlan).
    no-dedupe: No agrupa las filas para quitar repetidos.
    max-rows: Lee a lo más {max} filas de `{table}`.

  blocked:
    top: >-
      `TOP` no existe en PostgreSQL. Usa `ORDER BY … OFFSET 0 ROWS FETCH NEXT n ROWS ONLY`, que
      también corre en SQL Server.
    variable: >-
      Las variables con `@` (`DECLARE @x`) no existen aquí, fuera de un procedimiento. Escribe los
      valores directamente en la consulta.
    try-catch: >-
      `TRY…CATCH`, `RAISERROR` y `THROW` no existen en PostgreSQL. Para que un error deshaga los
      cambios, usa una transacción: aquí, un error dentro de `BEGIN TRANSACTION` la aborta y el
      `COMMIT` la deshace.
    procedure: >-
      Los procedimientos almacenados (`CREATE PROCEDURE`, `EXEC`) no corren aquí. Escribe las
      sentencias directamente.
    control-flow: >-
      `IF` y `WHILE` no existen en PostgreSQL fuera de una función. Usa `CASE`, un `WHERE` o una
      sola sentencia que cubra los casos.
    output: >-
      `OUTPUT INSERTED` y `OUTPUT DELETED` no existen en PostgreSQL; allá se usa `RETURNING`.
    print: "`PRINT` no existe en PostgreSQL. Usa un `SELECT` para ver un valor."
    update-join: >-
      PostgreSQL no acepta `UPDATE alias SET … FROM tabla AS alias JOIN …`. Deja la tabla en el
      `UPDATE` y las demás en el `FROM` (`UPDATE Products SET … FROM Categories AS c WHERE
      c.Id = Products.CategoryId`), que también corre en SQL Server, o usa una subconsulta en el
      `WHERE`.
    delete-join: >-
      PostgreSQL no acepta `DELETE alias FROM … JOIN …`. Usa `DELETE FROM tabla WHERE EXISTS (…)`
      o `NOT EXISTS (…)`, que corren en los dos motores.
    cte-target: >-
      PostgreSQL no borra ni actualiza a través de una CTE. Usa la CTE dentro del `WHERE`:
      `DELETE FROM Customers WHERE Id IN (SELECT Id FROM d WHERE n > 1)`.
    convert-style: >-
      `CONVERT` con estilo (el tercer argumento) no existe aquí. Usa `CAST(x AS date)` o compara con
      un rango de fechas.

  notes:
    go: Se quitaron los `GO`; aquí todo el código corre en un solo lote.
    brackets: "`[Nombre]` se escribió `\"nombre\"`, entre comillas dobles y en minúsculas."
    date-part: >-
      La parte de fecha de `DATEADD`, `DATEDIFF`, `DATEPART` y `DATETRUNC` se pasó entre comillas:
      `DATEADD('day', …)`.
    types: >-
      Los tipos de SQL Server se cambiaron por los de PostgreSQL: `datetime2` es `timestamp`,
      `nvarchar` es `varchar` y `bit` es `smallint`.
    nonclustered: Se quitó `NONCLUSTERED`; en PostgreSQL todo índice está separado de la tabla.
    clustered: Se quitó `CLUSTERED`; PostgreSQL no guarda la tabla ordenada por un índice.
    tran: "`TRAN` se escribió `TRANSACTION`."
    identity: "`IDENTITY` se escribió `GENERATED BY DEFAULT AS IDENTITY`."
    hints: Se quitaron las pistas de tabla, como `WITH (NOLOCK)`; PostgreSQL no las tiene.
    string-agg: >-
      `STRING_AGG(…) WITHIN GROUP (ORDER BY …)` se escribió con el `ORDER BY` dentro de
      `STRING_AGG`.
    by-target: "`WHEN NOT MATCHED BY TARGET` se escribió `WHEN NOT MATCHED`, que es lo mismo."
    set-option: >-
      Se quitaron `SET NOCOUNT`, `SET XACT_ABORT` y opciones parecidas. PostgreSQL no las tiene, y
      un error dentro de una transacción siempre la aborta.
    temp-table: >-
      Las tablas temporales (`#Nombre`) se crearon como tablas normales: cada ejecución usa una base
      nueva.
    set-alias: Se quitó el alias de las columnas que asigna el `SET` (`p.Price = …` es `Price = …`).
    convert: "`CONVERT(tipo, x)` se escribió `CAST(x AS tipo)`."
    apply: >-
      `CROSS APPLY` se escribió `CROSS JOIN LATERAL`, y `OUTER APPLY`, `LEFT JOIN LATERAL … ON
      TRUE`.

  playground:
    editor: Tu código
    editor_label: Código SQL
    database: La base de ejemplo
    database_text: >-
      Cada vez que ejecutas, la base empieza de nuevo con estas tablas y sus filas. Los cambios no
      se guardan de una ejecución a otra.
    run: Ejecutar
    keys: Ctrl+Enter ejecuta. Para salir del editor con el teclado, Esc y luego Tab.
    explain: Mostrar el plan de la última consulta
    generate: Llenar Customers y Orders con 6,000 clientes y 50,000 pedidos, para ver planes como con datos reales
    reset: Volver al ejemplo
    reset_confirm: ¿Cambiar tu código por el ejemplo? Lo que escribiste se pierde.
    statement: Sentencia {n}, línea {line}
    affected: "{n} filas afectadas."
    affected_one: 1 fila afectada.
    done: Lista, sin filas que mostrar.
    empty: Escribe una consulta y ejecútala.
    statements: "{n} sentencias en {time}."
    statements_one: "1 sentencia en {time}."

