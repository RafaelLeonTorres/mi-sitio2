      Five random challenges from one language and category, with 30 minutes for all of them, as in
      a technical interview. While the clock runs, hints and solutions are hidden. At the end you see
      which ones you solved and how much time you spent on each.
    nojs: >-
      Interview mode needs JavaScript to keep time. Without it, you can solve the challenges one by
      one from the catalog.
