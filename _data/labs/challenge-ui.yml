  playground:
    starter: |
      SELECT c.Name, COUNT(o.Id) AS OrderCount, SUM(o.Total) AS Spent
      FROM Customers AS c
      LEFT JOIN Orders AS o ON o.CustomerId = c.Id
      GROUP BY c.Id, c.Name
      ORDER BY OrderCount DESC, c.Name;

