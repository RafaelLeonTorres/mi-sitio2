    playground:
      editor: Your code
      editor_label: C# code
      about: How it works
      about_text: |-
        Write a program like the one from `dotnet new console`: top-level statements, with no class
        or `Main`. After the statements you can declare functions, classes, and records, and `await`
        works wherever you need it.

        What you write with `Console.Write` and `Console.WriteLine` shows up below. If the program
        throws an exception, you see which one and in which method. Each run gets {seconds} seconds.
      run: Run
      keys: Ctrl+Enter runs. To leave the editor with the keyboard, press Esc and then Tab.
      reset: Back to the example
      reset_confirm: Replace your code with the example? What you wrote will be lost.
      empty: Write a program and run it.
      finished: Finished in {time}.
      failed: Stopped by an exception after {time}.
      output: Console
      no_output: The program didn't write anything to the console.
      starter: |
        // A program like the one from dotnet new console, with the using directives for System,
        // LINQ, and the collections already included.
        var orders = new[]
        {
            (Customer: "Ana", Total: 120.50m),
            (Customer: "Luis", Total: 80m),
            (Customer: "Ana", Total: 45.25m),
            (Customer: "Luis", Total: 32.10m),
        };

        foreach (var group in orders.GroupBy(order => order.Customer).OrderBy(group => group.Key))
        {
            Console.WriteLine($"{group.Key}: {group.Count()} orders, {group.Sum(order => order.Total):0.00}");
        }

        // await works too.
        await Task.Delay(100);
        Console.WriteLine("Done.");

