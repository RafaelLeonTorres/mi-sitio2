    contains: A la salida le falta un texto esperado.
    matches: La salida no tiene el formato esperado.
  rules:
    uses-syntax: "Tu código debe usar {name}."
    avoids-syntax: "Tu código no debe usar {name}."
    declares-variable: "Tu código debe declarar la variable {name}."
    calls-method: "Tu código debe llamar a {name}."
    uses-type: "Tu código debe usar {type}."
    avoids-type: "Tu código no debe usar {type}."
  rules_min:
    uses-syntax: "Tu código debe usar {name} al menos {min} veces."
    calls-method: "Tu código debe llamar a {name} al menos {min} veces."
  # Cómo se llama en los mensajes lo que pide una regla de sintaxis (uses-syntax y avoids-syntax):
  # la clave es el nombre en Roslyn. Cada nombre que use una lección necesita su etiqueta.
  syntax:
    ConstKeyword: la palabra const
    SingleLineCommentTrivia: un comentario con //
    MultiLineCommentTrivia: un comentario con /* */
    MultiplyExpression: una multiplicación
    DivideExpression: una división
    ModuloExpression: el operador %
    ParenthesizedExpression: paréntesis
    AddAssignmentExpression: el operador +=
    SubtractAssignmentExpression: el operador -=
    "PostIncrementExpression|PreIncrementExpression": el operador ++
    EqualsExpression: una comparación con ==
    "LogicalAndExpression|LogicalOrExpression": los operadores && o ||
    InterpolatedStringExpression: una cadena interpolada con $
    CastExpression: una conversión explícita, como (int)
    IfStatement: un if
    ElseClause: un else
    SwitchStatement: un switch
    SwitchExpression: una expresión switch
    ConditionalExpression: "el operador ?:"
    CoalesceExpression: el operador ??
    WhileStatement: un while
    "WhileStatement|DoStatement": un while o un do while
    "WhileStatement|DoStatement|ForStatement": un ciclo (while, do while o for)
    ForStatement: un for
    ForEachStatement: un foreach
    BreakStatement: un break
    ContinueStatement: un continue
    ElementAccessExpression: "un índice con []"
    "ForStatement|ForEachStatement": un for o un foreach
    IndexExpression: el operador ^
    RangeExpression: un rango con ..
    LocalFunctionStatement: un método propio
    ReturnStatement: un return
    ArrowExpressionClause: el cuerpo con =>
    NameColon: un argumento con nombre
    RefKeyword: la palabra ref
    MethodDeclaration: una declaración de método
    ClassDeclaration: una clase
    PropertyDeclaration: una propiedad
    FieldDeclaration: un campo
    InitKeyword: la palabra init
    ObjectInitializerExpression: un inicializador de objeto
    ConstructorDeclaration: un constructor
    ThisConstructorInitializer: una llamada this(...) a otro constructor
    StaticKeyword: la palabra static
    PrivateKeyword: la palabra private
    StructDeclaration: un struct
    RecordDeclaration: un record
    EnumDeclaration: un enum
    BaseConstructorInitializer: una llamada base(...) al constructor de la base
    ProtectedKeyword: la palabra protected
    VirtualKeyword: la palabra virtual
    OverrideKeyword: la palabra override
    AbstractKeyword: la palabra abstract
    BaseExpression: una llamada base.Método()
    NullableType: un tipo que acepta nulos, como int?
    ConditionalAccessExpression: el operador ?.
    CoalesceAssignmentExpression: el operador ??=
    TryStatement: un try
    CatchClause: un catch
    FinallyClause: un finally
    ThrowStatement: un throw
    ThrowExpression: una expresión throw
    UsingKeyword: la palabra using
    TypeParameterList: un parámetro de tipo, como <T>
    TypeParameterConstraintClause: una restricción con where
    "SimpleLambdaExpression|ParenthesizedLambdaExpression": una lambda con =>
    AwaitExpression: un await
    AsyncKeyword: la palabra async
    DeclarationPattern: un patrón de tipo con nombre, como is Book book
    PropertyPatternClause: "un patrón de propiedades, como { Total: > 100 }"
    WithExpression: una expresión with
    PrimaryConstructorBaseType: "una llamada a la base en el encabezado, como : Course(title, price)"
    CollectionExpression: "una expresión de colección con []"
    SpreadElement: un elemento con .. dentro de los corchetes
    FieldExpression: la palabra field
    WithElement: un with(...) como primer elemento de la colección
    UnionDeclaration: una unión con la palabra union
    OutKeyword: la palabra out
    ListPattern: "un patrón de lista, como [var first, .., var last]"
    "ThrowStatement|ThrowExpression": un throw
  done_of: "{done}/{total}"
  continue: Continuar donde lo dejaste
  reset_progress: Borrar mi avance
  reset_progress_confirm: ¿Borrar todo tu avance del curso en este navegador?
