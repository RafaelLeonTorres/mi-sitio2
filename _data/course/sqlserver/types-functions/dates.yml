shared:
  minutes: 12
  steps:
    - id: types
      kind: read
    - id: year
      kind: exercise
      level: executable
      mode: query
      tables: [Customers]
      starter: |
        SELECT Name FROM Customers;
      solution: |
        SELECT Name FROM Customers WHERE YEAR(CreatedAt) = 2025;
      check: rows
      cases:
        - sample: true
        - tables:
            Customers:
              columns: [Id, Name, CreatedAt]
              rows: [[1, Ana, "2024-12-31"], [2, Beto, "2025-01-01"], [3, Cris, "2025-12-31"], [4, Dani, "2026-01-01"]]
    - id: add-days
      kind: exercise
      level: executable
      mode: query
      tables: [Orders]
      starter: |
        SELECT Id, OrderDate AS DueDate FROM Orders;
      solution: |
        SELECT Id, DATEADD(day, 3, CAST(OrderDate AS date)) AS DueDate FROM Orders;
      check: rows
      cases:
        - sample: true
        - tables:
            Orders:
              columns: [Id, OrderDate]
              rows: [[1, "2026-12-30 23:00:00"], [2, "2026-02-27 08:00:00"]]
    - id: datediff
      kind: choice
      answer: 1
    - id: dateformat
      kind: captured
      script: |
        SET DATEFORMAT dmy;
        SELECT CAST('2026-10-05' AS datetime) AS AsDatetime,
               CAST('2026-10-05' AS date) AS AsDate,
               CAST('20261005' AS datetime) AS NoSeparators;
      predict:
        answer: 1
      captured:
        server: "16.0.1000.6"
        date: "2026-11-26"
        batches:
          - results:
              - columns: [AsDatetime, AsDate, NoSeparators]
                rows:
                  - ["2026-05-10 00:00:00.000", "2026-10-05", "2026-10-05 00:00:00.000"]
            messages: []
    - id: your-turn
      kind: exercise
      level: executable
      mode: query
      tables: [Orders]
      starter: |
        -- Show each shipped order and how many days it took to ship.
      solution: |
        SELECT Id, DATEDIFF(day, OrderDate, ShippedAt) AS Days FROM Orders WHERE ShippedAt IS NOT NULL;
      check: rows
      cases:
        - sample: true
        - tables:
            Orders:
              columns: [Id, OrderDate, ShippedAt]
              rows:
                [[1, "2026-10-01 23:59:00", "2026-10-02 00:01:00"], [2, "2026-10-01 00:00:00", "2026-10-01 23:00:00"], [3, "2026-10-01 10:00:00", "2026-10-11 09:00:00"], [4, "2026-10-01 10:00:00", null]]
es:
  slug: fechas
  title: Fechas
  summary: Sacar partes de una fecha, sumar días, contar diferencias y escribir fechas sin sorpresas.
  steps:
    types:
      title: Fechas y horas
      text: |
        `date` guarda un día y `datetime2`, un día con su hora. Las fechas se escriben entre comillas, así `'2026-10-05'`.

        Para sacar partes están `YEAR`, `MONTH`, `DAY` y `DATEPART`; `DATENAME` da el nombre del mes o del día, en el idioma de la conexión (en inglés con el idioma predeterminado). `DATEADD` suma una cantidad de días, meses o años, `DATEDIFF` cuenta cuántos hay entre dos fechas y `EOMONTH` da el último día del mes.

        ```sql
        SELECT Name, CreatedAt, YEAR(CreatedAt) AS JoinYear, DATENAME(month, CreatedAt) AS JoinMonth
        FROM Customers WHERE Id <= 3 ORDER BY Id;
        ```

        ```text
              Name      | CreatedAt  | JoinYear | JoinMonth
        ----------------+------------+----------+-----------
         Ana Torres     | 2024-02-10 |     2024 | February
         Luis Hernández | 2024-03-22 |     2024 | March
         María López    | 2024-05-05 |     2024 | May
        (3 filas)
        ```
    year:
      title: Por año
      text: |
        Las funciones de fecha también sirven en el `WHERE`.
      instructions: |
        Muestra el nombre de los clientes que se registraron en 2025 (`CreatedAt`).
      hints:
        - Compara el año de `CreatedAt` con `2025`.
        - La función es `YEAR(CreatedAt)`.
        - La consulta completa es `SELECT Name FROM Customers WHERE YEAR(CreatedAt) = 2025;`.
      explanation: |
        Funciona, pero al aplicar una función a la columna SQL Server no puede usar bien un índice sobre ella. En tablas grandes conviene un rango, `CreatedAt >= '2025-01-01' AND CreatedAt < '2026-01-01'`.
      failure: Solo los clientes registrados en 2025.
    add-days:
      title: Sumar días
      text: |
        `DATEADD(parte, cantidad, fecha)` suma, o resta con una cantidad negativa. `CAST(fecha AS date)` le quita la hora.
      instructions: |
        Muestra el número de cada pedido y, en `DueDate`, su fecha límite de envío: tres días después del pedido, solo la fecha.
      hints:
        - Primero quítale la hora a `OrderDate` con `CAST(OrderDate AS date)`.
        - Suma con `DATEADD(day, 3, ...)`.
        - La consulta completa es `SELECT Id, DATEADD(day, 3, CAST(OrderDate AS date)) AS DueDate FROM Orders;`.
      explanation: |
        `DATEADD` respeta el calendario: pasa de mes y de año sola.
      failure: El número y la fecha, sin hora, tres días después de cada pedido.
    datediff:
      title: DATEDIFF cuenta cambios
      text: |
        `DATEDIFF` no mide el tiempo transcurrido de forma exacta.
      question: "¿Qué devuelve `DATEDIFF(year, '2025-12-31', '2026-01-01')`?"
      options:
        - "`0`, porque solo pasó un día."
        - "`1`, porque se cruzó un cambio de año."
        - "`365`"
        - Un error, porque las fechas están en años distintos.
      explanation: |
        `DATEDIFF` cuenta cuántos **límites** de la parte pedida se cruzan entre las dos fechas. De un 31 de diciembre al 1 de enero cambia el año una vez, aunque haya pasado un solo día.
    dateformat:
      title: Fechas que cambian de sentido
      text: |
        Si el idioma de tu inicio de sesión es español, SQL Server usa el formato de fecha día-mes-año, como con `SET DATEFORMAT dmy`. Mira lo que pasa con un texto escrito como año-mes-día.
      predict:
        question: Con `dmy`, ¿qué fecha es `AsDatetime`?
        options:
          - El 5 de octubre de 2026.
          - El 10 de mayo de 2026.
          - Un error de conversión.
          - "`NULL`"
        explanation: |
          Con `datetime`, el formato `dmy` hace que `'2026-10-05'` se lea como año-día-mes: 10 de mayo, y sin ningún aviso. `date` y `datetime2` leen siempre año-mes-día. Escribir `'20261005'`, sin separadores, es seguro con cualquier configuración.
    your-turn:
      title: "Tu turno: días de envío"
      starter: |
        -- Muestra cada pedido enviado y cuántos días tardó en enviarse.
      text: |
        La columna `ShippedAt` está en `NULL` en los pedidos que no se han enviado.
      instructions: |
        De los pedidos enviados, muestra el número (`Id`) y, en `Days`, los días entre el pedido y el envío.
      hints:
        - Filtra con `ShippedAt IS NOT NULL`.
        - Los días son `DATEDIFF(day, OrderDate, ShippedAt)`.
        - La consulta completa es `SELECT Id, DATEDIFF(day, OrderDate, ShippedAt) AS Days FROM Orders WHERE ShippedAt IS NOT NULL;`.
      explanation: |
        Recuerda que cuenta cambios de día: un envío a las 00:01 de un pedido de las 23:59 da 1.
      failure: Los pedidos enviados, con sus días de envío.
en:
  slug: dates
  title: Dates
  summary: Take parts of a date, add days, count differences and write dates without surprises.
  steps:
    types:
      title: Dates and times
      text: |
        `date` stores a day and `datetime2` a day with its time. Dates are written in quotes, like `'2026-10-05'`.

        To take parts there are `YEAR`, `MONTH`, `DAY` and `DATEPART`; `DATENAME` gives the name of the month or day, in the connection's language (English with the default language). `DATEADD` adds a number of days, months or years, `DATEDIFF` counts how many there are between two dates and `EOMONTH` gives the last day of the month.

        ```sql
        SELECT Name, CreatedAt, YEAR(CreatedAt) AS JoinYear, DATENAME(month, CreatedAt) AS JoinMonth
        FROM Customers WHERE Id <= 3 ORDER BY Id;
        ```

        ```text
              Name      | CreatedAt  | JoinYear | JoinMonth
        ----------------+------------+----------+-----------
         Ana Torres     | 2024-02-10 |     2024 | February
         Luis Hernández | 2024-03-22 |     2024 | March
         María López    | 2024-05-05 |     2024 | May
        (3 rows)
        ```
    year:
      title: By year
      text: |
        Date functions also work in `WHERE`.
      instructions: |
        Show the name of the customers who registered in 2025 (`CreatedAt`).
      hints:
        - Compare the year of `CreatedAt` with `2025`.
        - The function is `YEAR(CreatedAt)`.
        - The whole query is `SELECT Name FROM Customers WHERE YEAR(CreatedAt) = 2025;`.
      explanation: |
        It works, but applying a function to the column stops SQL Server from using an index on it well. On big tables a range is better, `CreatedAt >= '2025-01-01' AND CreatedAt < '2026-01-01'`.
      failure: Only the customers who registered in 2025.
    add-days:
      title: Adding days
      text: |
        `DATEADD(part, amount, date)` adds, or subtracts with a negative amount. `CAST(date AS date)` removes the time.
      instructions: |
        Show the number of each order and, in `DueDate`, its shipping deadline: three days after the order, date only.
      hints:
        - First remove the time from `OrderDate` with `CAST(OrderDate AS date)`.
        - Add with `DATEADD(day, 3, ...)`.
        - The whole query is `SELECT Id, DATEADD(day, 3, CAST(OrderDate AS date)) AS DueDate FROM Orders;`.
      explanation: |
        `DATEADD` respects the calendar: it moves into the next month and year by itself.
      failure: The number and the date, without time, three days after each order.
    datediff:
      title: DATEDIFF counts changes
      text: |
        `DATEDIFF` doesn't measure elapsed time exactly.
      question: "What does `DATEDIFF(year, '2025-12-31', '2026-01-01')` return?"
      options:
        - "`0`, because only one day went by."
        - "`1`, because a change of year was crossed."
        - "`365`"
        - An error, because the dates are in different years.
      explanation: |
        `DATEDIFF` counts how many **boundaries** of the requested part are crossed between the two dates. From December 31 to January 1 the year changes once, even though only one day went by.
    dateformat:
      title: Dates that change meaning
      text: |
        If your login's language is Spanish, SQL Server uses the day-month-year date format, as with `SET DATEFORMAT dmy`. Look at what happens with a text written as year-month-day.
      predict:
        question: With `dmy`, what date is `AsDatetime`?
        options:
          - October 5, 2026.
          - May 10, 2026.
          - A conversion error.
          - "`NULL`"
        explanation: |
          With `datetime`, the `dmy` format makes `'2026-10-05'` read as year-day-month: May 10, with no warning at all. `date` and `datetime2` always read year-month-day. Writing `'20261005'`, without separators, is safe with any setting.
    your-turn:
      title: "Your turn: days to ship"
      starter: |
        -- Show each shipped order and how many days it took to ship.
      text: |
        The `ShippedAt` column is `NULL` in the orders that haven't shipped.
      instructions: |
        For the shipped orders, show the number (`Id`) and, in `Days`, the days between the order and the shipment.
      hints:
        - Filter with `ShippedAt IS NOT NULL`.
        - The days are `DATEDIFF(day, OrderDate, ShippedAt)`.
        - The whole query is `SELECT Id, DATEDIFF(day, OrderDate, ShippedAt) AS Days FROM Orders WHERE ShippedAt IS NOT NULL;`.
      explanation: |
        Remember it counts day changes: a shipment at 00:01 for an order at 23:59 gives 1.
      failure: The shipped orders, with their days to ship.
