shared:
  minutes: 12
  steps:
    - id: join
      kind: read
    - id: customer-names
      kind: exercise
      level: executable
      mode: query
      tables: [Orders, Customers]
      starter: |
        SELECT Id, CustomerId FROM Orders;
      solution: |
        SELECT o.Id, c.Name FROM Orders AS o JOIN Customers AS c ON c.Id = o.CustomerId;
      check: rows
      cases:
        - sample: true
        - tables:
            Orders:
              columns: [Id, CustomerId]
              rows: [[1, 11], [2, 12], [3, 11]]
            Customers:
              columns: [Id, Name]
              rows: [[11, Zoe], [12, Iván], [13, Sin pedidos]]
    - id: ambiguous
      kind: choice
      answer: 1
    - id: three-tables
      kind: exercise
      level: executable
      mode: query
      tables: [Orders, OrderLines, Products]
      starter: |
        SELECT l.OrderId, p.Name, l.Quantity
        FROM OrderLines AS l
        JOIN Products AS p ON p.Id = l.ProductId;
      solution: |
        SELECT l.OrderId, p.Name, l.Quantity
        FROM OrderLines AS l
        JOIN Products AS p ON p.Id = l.ProductId
        JOIN Orders AS o ON o.Id = l.OrderId
        WHERE o.Status = 'shipped';
      check: rows
      cases:
        - sample: true
        - tables:
            Orders:
              columns: [Id, Status]
              rows: [[1, shipped], [2, pending]]
            OrderLines:
              columns: [OrderId, LineNumber, ProductId, Quantity]
              rows: [[1, 1, 1, 2], [2, 1, 2, 1]]
            Products:
              columns: [Id, Sku, Name]
              rows: [[1, A-1, Taza], [2, A-2, Vaso]]
    - id: many
      kind: choice
      answer: 1
    - id: your-turn
      kind: exercise
      level: executable
      mode: query
      tables: [OrderLines, Products, Categories]
      starter: |
        -- Show how much was sold in each category: its name and the total.
      solution: |
        SELECT c.Name, SUM(l.Quantity * l.UnitPrice) AS Total
        FROM OrderLines AS l
        JOIN Products AS p ON p.Id = l.ProductId
        JOIN Categories AS c ON c.Id = p.CategoryId
        GROUP BY c.Name;
      check: rows
      cases:
        - sample: true
        - tables:
            OrderLines:
              columns: [OrderId, LineNumber, ProductId, Quantity, UnitPrice]
              rows: [[1, 1, 1, 3, 10], [1, 2, 2, 1, 7], [2, 1, 1, 1, 10]]
            Products:
              columns: [Id, Sku, Name, CategoryId]
              rows: [[1, A-1, Uno, 1], [2, B-1, Dos, 2]]
            Categories:
              columns: [Id, Name]
              rows: [[1, Tazas], [2, Filtros], [3, Vacía]]
es:
  slug: inner-join
  title: INNER JOIN
  summary: Juntar filas de dos o más tablas que se corresponden por sus llaves.
  steps:
    join:
      title: Unir por la llave
      text: |
        `JOIN` junta cada fila de una tabla con las filas de otra que cumplen la condición de `ON`, normalmente la llave foránea con la primaria. Solo aparecen las filas que **encuentran pareja**; `INNER` es lo normal y se puede omitir.

        ```sql
        SELECT p.Name, c.Name AS Category
        FROM Products AS p
        JOIN Categories AS c ON c.Id = p.CategoryId
        WHERE p.Price > 300
        ORDER BY p.Id;
        ```

        ```text
                 Name          |  Category
        -----------------------+------------
         Café de Veracruz 1 kg | Café
         Prensa francesa       | Accesorios
         Molino manual         | Accesorios
        (3 filas)
        ```

        Los **alias de tabla** (`p`, `c`) dicen de dónde sale cada columna.
    customer-names:
      title: El nombre del cliente
      text: |
        En `Orders` solo está el número del cliente; su nombre vive en `Customers`.
      instructions: |
        Muestra el número de cada pedido (`Id`) y el nombre del cliente que lo hizo.
      hints:
        - Une `Orders` con `Customers`.
        - La condición es `c.Id = o.CustomerId`.
        - La consulta completa es `SELECT o.Id, c.Name FROM Orders AS o JOIN Customers AS c ON c.Id = o.CustomerId;`.
      explanation: |
        Cada pedido encuentra a su cliente por la llave. Un cliente sin pedidos no aparece.
      failure: Cada pedido con el nombre de su cliente.
    ambiguous:
      title: Columnas con el mismo nombre
      text: |
        `Products` y `Categories` tienen una columna `Name`:

        ```sql
        SELECT Name FROM Products AS p JOIN Categories AS c ON c.Id = p.CategoryId;
        ```
      question: ¿Qué pasa?
      options:
        - Muestra el nombre de los productos.
        - Da un error, porque `Name` podría ser de cualquiera de las dos tablas.
        - Muestra las dos columnas `Name`.
        - Muestra el nombre de las categorías.
      explanation: |
        SQL Server no adivina: da el error 209, «nombre de columna ambiguo». Escribe `p.Name` o `c.Name`.
    three-tables:
      title: Tres tablas
      text: |
        Puedes encadenar uniones. Cada `JOIN` suma una tabla a lo ya unido.
      instructions: |
        Esta consulta muestra los renglones con el nombre de su producto. Haz que solo muestre los de pedidos enviados (`shipped`).
      hints:
        - El estado está en `Orders`, así que hay que unir esa tabla.
        - "Agrega `JOIN Orders AS o ON o.Id = l.OrderId`."
        - Después filtra con `WHERE o.Status = 'shipped'`.
      explanation: |
        La tercera tabla entra solo para filtrar: sus columnas no tienen que aparecer en el `SELECT`.
      failure: Los renglones de pedidos enviados, con el nombre del producto.
    many:
      title: Una fila por pareja
      text: |
        El cliente 1 tiene dos pedidos.
      question: Si unes `Customers` con `Orders`, ¿cuántas veces aparece su nombre?
      options:
        - Una vez, porque es un solo cliente.
        - Dos veces, una por cada pedido.
        - Ninguna, porque tiene más de un pedido.
        - Depende del orden de las tablas.
      explanation: |
        Una unión da una fila por cada **pareja** que cumple la condición. Si solo quieres saber quién tiene pedidos, `EXISTS` (última lección del módulo) no repite.
    your-turn:
      title: "Tu turno: ventas por categoría"
      starter: |
        -- Muestra cuánto se vendió de cada categoría: su nombre y el total.
      text: |
        Combina tres tablas con un `GROUP BY`.
      instructions: |
        Muestra el nombre de cada categoría y, en `Total`, la suma de `Quantity * UnitPrice` de sus renglones.
      hints:
        - Une `OrderLines` con `Products` y después con `Categories`.
        - Agrupa por el nombre de la categoría.
        - La consulta completa es `SELECT c.Name, SUM(l.Quantity * l.UnitPrice) AS Total FROM OrderLines AS l JOIN Products AS p ON p.Id = l.ProductId JOIN Categories AS c ON c.Id = p.CategoryId GROUP BY c.Name;`.
      explanation: |
        Los renglones llegan a la categoría pasando por el producto. Una categoría sin ventas no aparece, porque la unión es interna.
      failure: Cada categoría con ventas y su total.
en:
  slug: inner-join
  title: INNER JOIN
  summary: Join rows of two or more tables that match through their keys.
  steps:
    join:
      title: Joining by the key
      text: |
        `JOIN` pairs each row of one table with the rows of another that meet the `ON` condition, usually the foreign key with the primary key. Only rows that **find a match** show up; `INNER` is the default and can be omitted.

        ```sql
        SELECT p.Name, c.Name AS Category
        FROM Products AS p
        JOIN Categories AS c ON c.Id = p.CategoryId
        WHERE p.Price > 300
        ORDER BY p.Id;
        ```

        ```text
                 Name          |  Category
        -----------------------+------------
         Café de Veracruz 1 kg | Café
         Prensa francesa       | Accesorios
         Molino manual         | Accesorios
        (3 rows)
        ```

        **Table aliases** (`p`, `c`) say where each column comes from.
    customer-names:
      title: The customer's name
      text: |
        `Orders` only has the customer number; the name lives in `Customers`.
      instructions: |
        Show each order number (`Id`) and the name of the customer who placed it.
      hints:
        - Join `Orders` with `Customers`.
        - The condition is `c.Id = o.CustomerId`.
        - The whole query is `SELECT o.Id, c.Name FROM Orders AS o JOIN Customers AS c ON c.Id = o.CustomerId;`.
      explanation: |
        Each order finds its customer through the key. A customer without orders doesn't show up.
      failure: Each order with its customer's name.
    ambiguous:
      title: Columns with the same name
      text: |
        `Products` and `Categories` both have a `Name` column:

        ```sql
        SELECT Name FROM Products AS p JOIN Categories AS c ON c.Id = p.CategoryId;
        ```
      question: What happens?
      options:
        - It shows the product names.
        - It fails, because `Name` could belong to either table.
        - It shows both `Name` columns.
        - It shows the category names.
      explanation: |
        SQL Server doesn't guess: it raises error 209, "ambiguous column name". Write `p.Name` or `c.Name`.
    three-tables:
      title: Three tables
      text: |
        You can chain joins. Each `JOIN` adds a table to what is already joined.
      instructions: |
        This query shows the lines with their product name. Make it show only those of `shipped` orders.
      hints:
        - The status is in `Orders`, so that table has to be joined.
        - "Add `JOIN Orders AS o ON o.Id = l.OrderId`."
        - Then filter with `WHERE o.Status = 'shipped'`.
      explanation: |
        The third table comes in only to filter: its columns don't have to appear in the `SELECT`.
      failure: The lines of shipped orders, with the product name.
    many:
      title: One row per pair
      text: |
        Customer 1 has two orders.
      question: If you join `Customers` with `Orders`, how many times does their name appear?
      options:
        - Once, because it is a single customer.
        - Twice, once per order.
        - Not at all, because they have more than one order.
        - It depends on the order of the tables.
      explanation: |
        A join gives one row per **pair** that meets the condition. If you only want to know who has orders, `EXISTS` (last lesson of the module) doesn't repeat.
    your-turn:
      title: "Your turn: sales by category"
      starter: |
        -- Show how much was sold in each category: its name and the total.
      text: |
        Combine three tables with a `GROUP BY`.
      instructions: |
        Show each category's name and, in `Total`, the sum of `Quantity * UnitPrice` of its lines.
      hints:
        - Join `OrderLines` with `Products` and then with `Categories`.
        - Group by the category name.
        - The whole query is `SELECT c.Name, SUM(l.Quantity * l.UnitPrice) AS Total FROM OrderLines AS l JOIN Products AS p ON p.Id = l.ProductId JOIN Categories AS c ON c.Id = p.CategoryId GROUP BY c.Name;`.
      explanation: |
        The lines reach the category through the product. A category with no sales doesn't show up, because the join is inner.
      failure: Each category with sales and its total.
