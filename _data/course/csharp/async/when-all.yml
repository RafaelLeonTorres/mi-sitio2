shared:
  minutes: 14
  steps:
    - id: intro
      kind: read
    - id: concurrent
      kind: exercise
      starter: |
        await CheckAsync("Stock", 300);
        await CheckAsync("Price", 100);
        await CheckAsync("Shipping", 200);
        Console.WriteLine("All checks done");

        static async Task CheckAsync(string name, int milliseconds)
        {
            await Task.Delay(milliseconds);
            Console.WriteLine($"{name} ok");
        }
      solution: |
        Task stock = CheckAsync("Stock", 300);
        Task price = CheckAsync("Price", 100);
        Task shipping = CheckAsync("Shipping", 200);
        await Task.WhenAll(stock, price, shipping);
        Console.WriteLine("All checks done");

        static async Task CheckAsync(string name, int milliseconds)
        {
            await Task.Delay(milliseconds);
            Console.WriteLine($"{name} ok");
        }
      runs:
        - stdout: "Price ok\nShipping ok\nStock ok\nAll checks done\n"
      rules:
        - { kind: calls-method, name: Task.WhenAll }
    - id: results
      kind: exercise
      starter: |
        string[] products = Console.ReadLine().Split(' ');

        var tasks = products.Select(product => FetchPriceAsync(product));
        await Task.WhenAll(tasks);

        int total = 0;
        foreach (Task<int> task in tasks)
        {
            total += await task;
        }
        Console.WriteLine($"Total: {total}");

        static async Task<int> FetchPriceAsync(string product)
        {
            Console.WriteLine($"Fetching {product}");
            await Task.Delay(50);
            return product switch
            {
                "mouse" => 25,
                "keyboard" => 45,
                "monitor" => 210,
                _ => 0,
            };
        }
      solution: |
        string[] products = Console.ReadLine().Split(' ');

        var tasks = products.Select(product => FetchPriceAsync(product)).ToList();
        await Task.WhenAll(tasks);

        int total = 0;
        foreach (Task<int> task in tasks)
        {
            total += await task;
        }
        Console.WriteLine($"Total: {total}");

        static async Task<int> FetchPriceAsync(string product)
        {
            Console.WriteLine($"Fetching {product}");
            await Task.Delay(50);
            return product switch
            {
                "mouse" => 25,
                "keyboard" => 45,
                "monitor" => 210,
                _ => 0,
            };
        }
      runs:
        - stdin: "mouse keyboard\n"
          stdout: "Fetching mouse\nFetching keyboard\nTotal: 70\n"
        - stdin: "monitor mouse keyboard\n"
          stdout: "Fetching monitor\nFetching mouse\nFetching keyboard\nTotal: 280\n"
