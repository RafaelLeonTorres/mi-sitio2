      solution: |
        int[] delays = Console.ReadLine().Split(' ').Select(text => int.Parse(text)).ToArray();

        Task<string> a = MirrorAsync("A", delays[0]);
        Task<string> b = MirrorAsync("B", delays[1]);
        Task<string> c = MirrorAsync("C", delays[2]);

        Task<string> fastest = await Task.WhenAny(a, b, c);
