    - id: intro
      kind: read
    - id: timeout
      kind: exercise
      starter: |
        int timeout = int.Parse(Console.ReadLine());

        await DownloadAsync(CancellationToken.None);
        Console.WriteLine("Finished");

        static async Task DownloadAsync(CancellationToken token)
        {
            for (int part = 1; part <= 3; part++)
            {
                await Task.Delay(200, token);
                Console.WriteLine($"Part {part} downloaded");
            }
        }
      solution: |
        int timeout = int.Parse(Console.ReadLine());

        using CancellationTokenSource cts = new CancellationTokenSource();
        cts.CancelAfter(timeout);

        try
        {
            await DownloadAsync(cts.Token);
            Console.WriteLine("Finished");
        }
        catch (OperationCanceledException)
        {
            Console.WriteLine("Canceled");
        }

        static async Task DownloadAsync(CancellationToken token)
        {
            for (int part = 1; part <= 3; part++)
            {
                await Task.Delay(200, token);
                Console.WriteLine($"Part {part} downloaded");
            }
        }
      runs:
        - stdin: "1000\n"
          stdout: "Part 1 downloaded\nPart 2 downloaded\nPart 3 downloaded\nFinished\n"
        - stdin: "300\n"
          stdout: "Part 1 downloaded\nCanceled\n"
        - stdin: "100\n"
          stdout: "Canceled\n"
