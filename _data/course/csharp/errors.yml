# Errores explicados para quien aprende. Primero los del compilador: la clave es el código de Roslyn y
# la terminal muestra la línea, el mensaje original y esta explicación en el idioma de la página.
# Después las excepciones de ejecución, con el nombre corto del tipo como clave.
CS1002:
  es: Falta un punto y coma (`;`). Cada instrucción termina con uno; revisa el final de la línea indicada o de la anterior.
  en: A semicolon (`;`) is missing. Every statement ends with one; check the end of the indicated line or the one before it.
CS1003:
  es: Falta un símbolo que C# esperaba, como una coma o un paréntesis. Revisa la línea indicada.
  en: A symbol C# expected is missing, like a comma or a parenthesis. Check the indicated line.
CS1026:
  es: Falta un paréntesis de cierre `)`. Cuenta los paréntesis de la línea.
  en: A closing parenthesis `)` is missing. Count the parentheses on the line.
CS1010:
  es: El texto entre comillas no se cerró en la misma línea. Revisa que cada comilla de apertura tenga su comilla de cierre.
  en: The quoted text wasn't closed on the same line. Check that every opening quote has its closing quote.
CS1525:
  es: Hay algo que C# no esperaba en esa posición. Revisa que no falte un valor o un operador antes de ese punto.
  en: Something C# didn't expect is in that position. Check that no value or operator is missing before that point.
CS0103:
  es: El nombre no existe en este lugar. Puede estar mal escrito (C# distingue mayúsculas y minúsculas), no haberse declarado antes o haberse declarado dentro de otro bloque `{ }`, donde termina su alcance.
  en: The name doesn't exist here. It may be misspelled (C# is case-sensitive), not declared earlier, or declared inside another `{ }` block, where its scope ends.
CS0246:
  es: C# no conoce ese tipo o espacio de nombres. Revisa que esté bien escrito y que exista; si es un tipo tuyo, declara su clase, struct, record o enum.
  en: C# doesn't know that type or namespace. Check that it's spelled right and that it exists; if it's a type of your own, declare its class, struct, record or enum.
CS0029:
  es: No se puede guardar ese valor en esa variable porque los tipos no coinciden (por ejemplo, texto en un `int`). Si el valor es un `Task<int>`, falta esperarlo con `await` para sacar el `int`.
  en: That value can't be stored in that variable because the types don't match (for example, text in an `int`). If the value is a `Task<int>`, you're missing an `await` to get the `int` out.
CS0165:
  es: Se usa una variable que todavía no tiene un valor. Asígnale uno antes de usarla.
  en: A variable is used before it has a value. Assign one before using it.
CS5001:
  es: El programa no tiene instrucciones que ejecutar. Escribe al menos una instrucción, como `Console.WriteLine(...)`.
  en: The program has no statements to run. Write at least one statement, like `Console.WriteLine(...)`.
CS8803:
  es: Las instrucciones y los métodos sueltos deben ir antes de cualquier tipo (clase, struct, record o enum). Muévelos al principio del archivo y deja los tipos al final.
  en: Loose statements and methods must come before any type (class, struct, record or enum). Move them to the top of the file and leave the types at the end.
CS0021:
  es: "Ese tipo no se puede consultar con un índice `[ ]`. Un `HashSet` no tiene posiciones: para saber si guarda un valor usa `Contains`."
  en: "That type can't be accessed with an index `[ ]`. A `HashSet` has no positions: to know whether it holds a value use `Contains`."
CS0163:
  es: "El programa no puede seguir de un `case` al siguiente. Termina cada `case` con `break;`."
  en: "The program can't continue from one `case` into the next. End each `case` with `break;`."
CS1513:
  es: "Falta una llave de cierre `}`. Revisa que cada `{` tenga su `}` y que los bloques estén bien cerrados."
  en: "A closing brace `}` is missing. Check that every `{` has its `}` and that the blocks are properly closed."
CS1579:
  es: "`foreach` solo recorre colecciones y textos. Un número, como `5`, no se puede recorrer: para repetir algo cierta cantidad de veces usa `for`."
  en: "`foreach` only goes through collections and text. A number, like `5`, can't be traversed: to repeat something a number of times use `for`."
CS1656:
  es: "La variable de un `foreach` solo se puede leer, no cambiar. Guarda el valor nuevo en otra variable."
  en: "A `foreach` variable can only be read, not changed. Store the new value in another variable."
CS0019:
  es: "Ese operador no se puede usar con esos dos tipos, por ejemplo sumar un número y un `bool`, o restar texto. Revisa el tipo de cada lado."
  en: "That operator can't be used with those two types, for example adding a number and a `bool`, or subtracting text. Check the type on each side."
CS0020:
  es: "Dividiste un entero entre un cero escrito directamente. Dividir entre cero no tiene resultado, y el compilador lo detecta antes de correr."
  en: "You divided an integer by a zero written directly. Dividing by zero has no result, and the compiler catches it before running."
CS1009:
  es: Después de la diagonal invertida `\` va una letra que C# conoce, como `n` o `t`. Para escribir una diagonal invertida de verdad, duplícala (`\\`).
  en: After the backslash `\` goes a letter C# knows, like `n` or `t`. To write an actual backslash, double it (`\\`).
CS1012:
  es: "Entre comillas simples cabe un solo carácter. Para varios caracteres usa un `string`, con comillas dobles."
  en: "Single quotes hold just one character. For several characters use a `string`, with double quotes."
CS1061:
  es: "Ese tipo no tiene un miembro con ese nombre. Puede ser un error de escritura o de mayúsculas, como `Lenght` en lugar de `Length`, o un miembro que todavía no escribiste en la clase. Además, el resultado de LINQ no tiene `Length` ni `Count` como propiedades: usa el método `Count()`. Y dentro de un método genérico, un `T` sin restricción solo tiene lo que tienen todos los tipos: si necesitas otro miembro, pídelo con `where`. Si el mensaje habla de `GetAwaiter`, estás esperando con `await` algo que no es una tarea: solo se espera un `Task` o un `Task<T>`. Y el parámetro de un constructor primario no es una propiedad: para verlo desde fuera, declara una propiedad que lo reciba."
  en: "That type has no member with that name. It may be a typo or a capitalization mistake, like `Lenght` instead of `Length`, or a member you haven't written in the class yet. Also, a LINQ result has no `Length` or `Count` property: use the `Count()` method. And inside a generic method, an unconstrained `T` only has what every type has: if you need another member, ask for it with `where`. If the message mentions `GetAwaiter`, you're awaiting with `await` something that isn't a task: only a `Task` or a `Task<T>` can be awaited. And a primary constructor parameter isn't a property: to see it from the outside, declare a property that takes it."
CS1503:
  es: "Le pasas al método un valor de un tipo que no espera, por ejemplo texto donde pide un número. Revisa qué tipo pide cada parámetro."
  en: "You're passing the method a value of a type it doesn't expect, for example text where it asks for a number. Check the type each parameter asks for."
CS0128:
  es: "Ya declaraste una variable o un método con ese nombre en este lugar. Usa otro nombre, o quita el tipo para cambiar el valor de la variable que ya existe. Los métodos sueltos no se pueden sobrecargar: para repetir un nombre, van dentro de una clase."
  en: "You already declared a variable or a method with that name here. Use another name, or drop the type to change the value of the existing variable. Standalone methods can't be overloaded: to repeat a name, they go inside a class."
CS0131:
  es: "No se puede asignar un valor ahí: el lado izquierdo de `=` debe ser una variable. Una constante (`const`) no cambia después de declararse."
  en: "A value can't be assigned there: the left side of `=` must be a variable. A constant (`const`) doesn't change after it's declared."
CS0133:
  es: "El valor de una constante debe conocerse al compilar: un literal o una operación entre constantes. Lo que se calcula al correr, como `int.Parse(...)`, no sirve; usa una variable."
  en: "A constant's value must be known at compile time: a literal or an operation between constants. Something calculated while running, like `int.Parse(...)`, doesn't work; use a variable."
CS0145:
  es: "Una constante necesita un valor desde que se declara. Escribe `= valor` antes del punto y coma."
  en: "A constant needs a value from the moment it's declared. Write `= value` before the semicolon."
CS0266:
  es: "Ese valor no se puede guardar en esa variable sin una conversión explícita. Puede perder algo, como un número con decimales en un `int`, o puede faltar, como un `int?` (que puede ser `null`) en un `int`. Cambia el tipo de la variable, o convierte el valor con un cast, `.Value` o `??`."
  en: "That value can't be stored in that variable without an explicit conversion. It may lose something, like a number with decimals in an `int`, or it may be missing, like an `int?` (which can be `null`) in an `int`. Change the variable's type, or convert the value with a cast, `.Value` or `??`."
CS0664:
  es: "Un número con decimales es un `double` por defecto y no se convierte solo a `decimal`. Agrega una `m` al final del valor, por ejemplo `19.99m`."
  en: "A number with decimals is a `double` by default and doesn't convert to `decimal` by itself. Add an `m` at the end of the value, for example `19.99m`."
CS0841:
  es: "Usaste una variable antes de declararla. Declárala en una línea anterior a donde la usas."
  en: "A variable was used before it was declared. Declare it on a line before where you use it."
CS1035:
  es: "Un comentario `/*` no se cerró: falta el `*/`. Ciérralo donde debe terminar el comentario."
  en: "A `/*` comment wasn't closed: the `*/` is missing. Close it where the comment should end."
CS0201:
  es: "Esa línea no hace nada por sí sola. Para llamar a un método hay que escribir sus paréntesis: `Saludar();`."
  en: "That line doesn't do anything on its own. To call a method you have to write its parentheses: `Greet();`."
CS0161:
  es: "Un método que devuelve un valor tiene que hacerlo por todos sus caminos. Falta un `return` (mostrar con `Console.WriteLine` no es devolver), o el método debería ser `void`."
  en: "A method that returns a value has to do it on every path. A `return` is missing (showing with `Console.WriteLine` isn't returning), or the method should be `void`."
CS7036:
  es: "Falta un argumento: el método, o el constructor, pide más valores de los que le pasas en esta llamada. Revisa su lista de parámetros. Si la llamada es `CompareTo` sobre un `T` dentro de un método genérico, lo que falta es la restricción `where T : IComparable<T>`. Si una clase hereda de otra con constructor primario, pásale los argumentos en el encabezado, como `: Course(title, price)`."
  en: "An argument is missing: the method, or the constructor, asks for more values than this call passes. Check its list of parameters. If the call is `CompareTo` on a `T` inside a generic method, what's missing is the constraint `where T : IComparable<T>`. If a class inherits from another one with a primary constructor, pass it the arguments in the header, like `: Course(title, price)`."
CS1501:
  es: "Le pasas al método más argumentos de los que acepta. Revisa su lista de parámetros, o si existe una versión que reciba esa cantidad."
  en: "You're passing the method more arguments than it accepts. Check its list of parameters, or whether a version that takes that many exists."
CS1737:
  es: "Los parámetros opcionales, los que tienen un valor por defecto, deben ir después de los obligatorios."
  en: "Optional parameters, the ones with a default value, must come after the required ones."
CS0177:
  es: "Un parámetro `out` debe recibir un valor antes de que el método termine, por todos sus caminos, también los que salen antes con `return`."
  en: "An `out` parameter must be given a value before the method ends, on every path, including those that leave early with `return`."
CS1620:
  es: "El método recibe ese argumento por referencia: escribe también `ref` u `out` en la llamada, igual que en la declaración."
  en: "The method takes that argument by reference: write `ref` or `out` in the call too, just like in the declaration."
CS8421:
  es: "Un método `static` no puede usar variables que están afuera de él. Pásale ese valor como parámetro."
  en: "A `static` method can't use variables from outside it. Pass that value in as a parameter."
CS1729:
  es: "Esa clase no tiene un constructor que reciba esa cantidad de argumentos. Escribe el constructor, o llama a uno de los que ya existen."
  en: "That class has no constructor that takes that many arguments. Write the constructor, or call one of the existing ones."
CS0200:
  es: "Esa propiedad es de solo lectura: no se le puede asignar valor desde aquí. Dale un `set`, o un `init` si solo debe asignarse al crear el objeto."
  en: "That property is read-only: it can't be assigned from here. Give it a `set`, or an `init` if it should only be assigned when the object is created."
CS8852:
  es: "Una propiedad `init` solo se puede asignar al crear el objeto, en un inicializador o en el constructor. Después de crearlo, es de solo lectura."
  en: "An `init` property can only be assigned when the object is created, in an initializer or in the constructor. Once it's created, it's read-only."
CS0117:
  es: "Esa clase no tiene un miembro con ese nombre. Revisa cómo está escrito, o decláralo dentro de la clase."
  en: "That class has no member with that name. Check how it's spelled, or declare it inside the class."
CS0120:
  es: "Se usa un miembro de objeto desde un método `static`, que no tiene objeto. Quita `static` y llama al método con un objeto, o pasa el dato como parámetro."
  en: "An object member is used from a `static` method, which has no object. Remove `static` and call the method on an object, or pass the data in as a parameter."
CS0122:
  es: "Ese miembro no es visible desde aquí: es privado, o es `protected` y se usa desde fuera de su clase y de sus derivadas. Agrégale `public`, o mejor, expón lo que haga falta con una propiedad o un método público; si lo necesita una clase derivada, usa `protected`."
  en: "That member isn't visible from here: it's private, or it's `protected` and used from outside its class and its derived ones. Add `public`, or better, expose what's needed with a public property or method; if a derived class needs it, use `protected`."
CS0272:
  es: "El `set` de esa propiedad es privado: solo la propia clase puede cambiarla. Desde fuera, usa un método de la clase."
  en: "That property's `set` is private: only the class itself can change it. From outside, use a method of the class."
CS0506:
  es: "Solo se puede reemplazar con `override` un método de la base marcado como `virtual` (o `abstract`). Márcalo en la clase base."
  en: "Only a base method marked `virtual` (or `abstract`) can be replaced with `override`. Mark it in the base class."
CS0115:
  es: "Ese `override` no reemplaza nada: la base no tiene un método con ese nombre y esa firma. Revisa que coincidan exactamente."
  en: "That `override` replaces nothing: the base has no method with that name and signature. Check that they match exactly."
CS0507:
  es: "Un `override` debe tener el mismo acceso que el método que reemplaza: si el de la base es `public`, el tuyo también."
  en: "An `override` must have the same access as the method it replaces: if the base one is `public`, yours must be too."
CS0534:
  es: "La clase hereda un miembro `abstract` y no lo implementa. Escríbelo con `override`, o declara la clase como `abstract`."
  en: "The class inherits an `abstract` member and doesn't implement it. Write it with `override`, or declare the class as `abstract`."
CS0535:
  es: "La clase dice que implementa una interfaz, pero le falta uno de sus miembros. Escríbelo con el mismo nombre y la misma firma, y con `public`."
  en: "The class says it implements an interface, but one of its members is missing. Write it with the same name and signature, and with `public`."
CS0144:
  es: "No se puede crear con `new` un objeto de una clase abstracta (ni de una interfaz). Crea uno de sus tipos derivados."
  en: "You can't create an object of an abstract class (or an interface) with `new`. Create one of its derived types."
CS1524:
  es: "Un `try` necesita al menos un `catch` o un `finally` después de su bloque. Agrega el que falta."
  en: "A `try` needs at least one `catch` or `finally` after its block. Add the one that's missing."
CS0160:
  es: "Un `catch` anterior ya atrapa este tipo de excepción, o uno más general, así que este nunca se ejecutaría. Pon los `catch` de lo más específico a lo más general."
  en: "A previous `catch` already catches this type of exception, or a more general one, so this one would never run. Put the `catch` blocks from most specific to most general."
CS1674:
  es: "Un `using` solo sirve con tipos que implementan `IDisposable`. Agrega `: IDisposable` a la clase y escribe su método `Dispose()`."
  en: "A `using` only works with types that implement `IDisposable`. Add `: IDisposable` to the class and write its `Dispose()` method."
CS0428:
  es: "Escribiste el nombre de un método sin paréntesis, como `Count` en lugar de `Count()`. Los métodos se llaman con paréntesis, aunque no reciban nada."
  en: "You wrote a method's name without parentheses, like `Count` instead of `Count()`. Methods are called with parentheses, even when they take nothing."
CS1662:
  es: "La función corta (`=>`) devuelve un tipo que el método no espera. Por ejemplo, `Where` necesita una condición que dé `true` o `false`, y le diste un número. Revisa qué devuelve la lambda."
  en: "The short function (`=>`) returns a type the method doesn't expect. For example, `Where` needs a condition that gives `true` or `false`, and you gave it a number. Check what the lambda returns."
CS0308:
  es: "Usas un tipo con `<...>`, como `Pair<int, int>`, pero ese tipo no es genérico. Declara los parámetros de tipo en la clase, después de su nombre: `class Pair<TFirst, TSecond>`."
  en: "You use a type with `<...>`, like `Pair<int, int>`, but that type isn't generic. Declare the type parameters on the class, after its name: `class Pair<TFirst, TSecond>`."
CS0311:
  es: "El tipo que usas no cumple la restricción `where` del método o de la clase genérica. Haz que el tipo implemente la interfaz que pide la restricción, o usa otro tipo."
  en: "The type you use doesn't meet the `where` constraint of the generic method or class. Make the type implement the interface the constraint asks for, or use another type."
CS0123:
  es: "El método que le das al delegado no tiene los parámetros que ese delegado pide. Con `Func<int, int>`, el método recibe un `int`; revisa cuántos parámetros tiene y de qué tipo son."
  en: "The method you give the delegate doesn't have the parameters that delegate asks for. With `Func<int, int>`, the method takes an `int`; check how many parameters it has and what type they are."
CS0407:
  es: "El método que le das al delegado devuelve un tipo distinto del que pide. En `Func<...>`, el último tipo es el que se devuelve; un `Action` es para métodos que no devuelven nada."
  en: "The method you give the delegate returns a different type than it asks for. In `Func<...>`, the last type is the one returned; an `Action` is for methods that return nothing."
CS1593:
  es: "La lambda tiene un número de parámetros distinto del que pide el delegado. `Func<int, int>` recibe uno solo, así que la lambda es `number => ...` y no `(a, b) => ...`."
  en: "The lambda has a different number of parameters than the delegate asks for. `Func<int, int>` takes just one, so the lambda is `number => ...` and not `(a, b) => ...`."
CS1643:
  es: "La lambda tiene llaves, pero algún camino termina sin `return`. Si devuelve un valor, todos los caminos deben devolver uno: agrega el `return` que falta al final."
  en: "The lambda has braces, but some path ends without a `return`. If it returns a value, every path must return one: add the missing `return` at the end."
CS0070:
  es: "Un evento solo se puede disparar dentro de la clase que lo declara. Desde fuera solo puedes suscribirte con `+=` o darte de baja con `-=`: llama a un método de esa clase que lo dispare."
  en: "An event can only be raised inside the class that declares it. From outside you can only subscribe with `+=` or unsubscribe with `-=`: call a method of that class that raises it."
CS4032:
  es: "Usas `await` dentro de un método que no está marcado como `async`. Agrega `async` antes del tipo de retorno y cambia ese tipo a `Task` (o a `Task<T>` si el método devuelve un valor)."
  en: "You use `await` inside a method that isn't marked `async`. Add `async` before the return type and change that type to `Task` (or to `Task<T>` if the method returns a value)."
CS4034:
  es: "Usas `await` dentro de una lambda que no es `async`. Escribe `async` antes de los parámetros de la lambda, como en `async () => ...`."
  en: "You use `await` inside a lambda that isn't `async`. Write `async` before the lambda's parameters, as in `async () => ...`."
CS1983:
  es: "Un método `async` devuelve `Task` o `Task<T>` (y, en casos especiales, `void`), no un tipo común. Si entrega un valor, el tipo es `Task<T>`: `async Task<int>`, no `async int`."
  en: "An `async` method returns `Task` or `Task<T>` (and, in special cases, `void`), not an ordinary type. If it delivers a value, the type is `Task<T>`: `async Task<int>`, not `async int`."
CS1997:
  es: "Un método `async` que devuelve `Task` no devuelve ningún valor. Quita lo que va después de `return`, o cambia el tipo a `Task<T>` para que devuelva un `T`."
  en: "An `async` method that returns `Task` doesn't return a value. Remove what comes after `return`, or change the type to `Task<T>` so it returns a `T`."
CS8510:
  es: "Este brazo nunca se alcanzaría: uno anterior de la expresión `switch` ya coincide con todo lo que él cubriría. Los brazos se prueban en orden, así que pon primero los más específicos y al final los más generales (`_` va siempre al último)."
  en: "This arm could never be reached: an earlier arm of the `switch` expression already matches everything it would cover. The arms are tested in order, so put the most specific ones first and the most general ones last (`_` always goes at the end)."
CS8862:
  es: "Una clase con constructor primario solo admite otros constructores si llaman al primario con `this(...)`, para que sus parámetros siempre reciban un valor. Por ejemplo, `public Product() : this(0) { }`."
  en: "A class with a primary constructor only allows other constructors if they call the primary one with `this(...)`, so its parameters always receive a value. For example, `public Product() : this(0) { }`."
CS9176:
  es: "El compilador no sabe qué colección crear: los corchetes toman su tipo del destino (la variable a la izquierda del `=` o el parámetro de un método), y con `var` no hay destino. Escribe el tipo, como `int[] sizes = [38, 40];` o `List<int> sizes = [38, 40];`."
  en: "The compiler doesn't know which collection to create: the brackets take their type from the target (the variable to the left of the `=` or a method's parameter), and with `var` there's no target. Write the type, like `int[] sizes = [38, 40];` or `List<int> sizes = [38, 40];`."

# Excepciones de ejecución. La clave es el nombre corto del tipo, como lo muestra la terminal.
PlatformNotSupportedException:
  es: "El navegador no permite esa operación (por ejemplo `Console.ReadKey` o `Console.Clear`). Usa `Console.ReadLine`, que lee de la entrada simulada. Tampoco deja esperar una tarea bloqueando con `Wait()` o `.Result`: usa `await`."
  en: "The browser doesn't allow that operation (for example `Console.ReadKey` or `Console.Clear`). Use `Console.ReadLine`, which reads from the simulated input. It doesn't let you wait for a task by blocking with `Wait()` or `.Result` either: use `await`."
NullReferenceException:
  es: "Se usó algo que vale `null`, o sea, que no apunta a ningún objeto. Revisa qué variable puede estar vacía en esa línea. Un evento al que nadie se suscribió también vale `null`: dispáralo con `?.Invoke(...)`."
  en: "Something that is `null` (it points to no object) was used. Check which variable can be empty on that line. An event nobody has subscribed to is also `null`: raise it with `?.Invoke(...)`."
IndexOutOfRangeException:
  es: Se pidió una posición que no existe en el arreglo. Los índices empiezan en 0 y el último es la longitud menos 1.
  en: A position that doesn't exist in the array was requested. Indexes start at 0 and the last one is the length minus 1.
ArgumentOutOfRangeException:
  es: Un valor está fuera del rango permitido, por ejemplo un índice de una lista o una posición de un texto que no existe.
  en: A value is outside the allowed range, for example a list index or a position in a string that doesn't exist.
DivideByZeroException:
  es: Se dividió un entero entre cero. Comprueba que el divisor no sea 0 antes de dividir.
  en: An integer was divided by zero. Check that the divisor isn't 0 before dividing.
FormatException:
  es: El texto no tiene el formato esperado, por ejemplo letras donde iba un número. Revisa el texto o usa `TryParse`.
  en: The text doesn't have the expected format, for example letters where a number belonged. Check the text or use `TryParse`.
InvalidCastException:
  es: Se intentó convertir un valor a un tipo que no es. Revisa el tipo real del valor.
  en: A value was converted to a type it isn't. Check the value's actual type.
KeyNotFoundException:
  es: La clave no está en el diccionario. Comprueba con `ContainsKey` o usa `TryGetValue` antes de leerla.
  en: The key isn't in the dictionary. Check with `ContainsKey` or use `TryGetValue` before reading it.
OverflowException:
  es: El resultado no cabe en ese tipo de número. Usa un tipo más grande, como `long`.
  en: The result doesn't fit in that number type. Use a bigger type, like `long`.
InvalidOperationException:
  es: La operación no es válida en el estado actual, por ejemplo pedir `First()` de una colección vacía, leer `Value` de un `int?` sin valor o cambiar una lista mientras la recorres. Lee el mensaje para ver cuál.
  en: The operation isn't valid in the current state, for example asking `First()` of an empty collection, reading `Value` of an `int?` with no value or changing a list while you go through it. Read the message to see which one.
ArgumentNullException:
  es: Se le pasó `null` a algo que no lo acepta. Revisa qué argumento puede venir vacío, o comprueba antes de llamar.
  en: "`null` was passed to something that doesn't accept it. Check which argument can be empty, or check before calling."
ArgumentException:
  es: Un argumento tiene un valor que el método no acepta, por ejemplo una clave repetida al armar un diccionario con `ToDictionary`. Lee el mensaje, que dice cuál y por qué.
  en: An argument has a value the method doesn't accept, for example a repeated key when building a dictionary with `ToDictionary`. Read the message, which says which one and why.
TaskCanceledException:
  es: "Se canceló una tarea: su token de cancelación se canceló mientras esperaba, por ejemplo en `Task.Delay(ms, token)`. Cancelar no es un fallo: atrapa `OperationCanceledException`, de la que hereda este tipo, alrededor del `await`."
  en: "A task was canceled: its cancellation token was canceled while it was waiting, for example in `Task.Delay(ms, token)`. Canceling isn't a failure: catch `OperationCanceledException`, the type this one inherits from, around the `await`."
OperationCanceledException:
  es: "Se canceló una operación: su token de cancelación se canceló y el código lo comprobó, por ejemplo con `token.ThrowIfCancellationRequested()`. Cancelar no es un fallo: atrapa `OperationCanceledException` donde esperas el resultado."
  en: "An operation was canceled: its cancellation token was canceled and the code checked it, for example with `token.ThrowIfCancellationRequested()`. Canceling isn't a failure: catch `OperationCanceledException` where you await the result."
SwitchExpressionException:
  es: "Ningún brazo de la expresión `switch` coincidió con el valor. Cubre todos los casos: agrega un último brazo `_ => ...` o el patrón que falta, como `[]` para una lista vacía."
  en: "No arm of the `switch` expression matched the value. Cover every case: add a last arm `_ => ...` or the pattern that's missing, like `[]` for an empty list."
