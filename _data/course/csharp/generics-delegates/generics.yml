        int count = int.Parse(Console.ReadLine());
        List<string> names = new List<string> { "Mouse", "Keyboard", "Monitor" }.Take(count).ToList();
        List<int> prices = new List<int> { 25, 45, 210 }.Take(count).ToList();

        Console.WriteLine(FirstName(names));
        Console.WriteLine(FirstPrice(prices));

        static string FirstName(List<string> items)
        {
            return items.Count > 0 ? items[0] : "none";
        }

        static int FirstPrice(List<int> items)
        {
            return items.Count > 0 ? items[0] : 0;
        }
      solution: |
        int count = int.Parse(Console.ReadLine());
        List<string> names = new List<string> { "Mouse", "Keyboard", "Monitor" }.Take(count).ToList();
        List<int> prices = new List<int> { 25, 45, 210 }.Take(count).ToList();

        Console.WriteLine(FirstOr(names, "none"));
        Console.WriteLine(FirstOr(prices, 0));

        static T FirstOr<T>(List<T> items, T fallback)
        {
            return items.Count > 0 ? items[0] : fallback;
        }
