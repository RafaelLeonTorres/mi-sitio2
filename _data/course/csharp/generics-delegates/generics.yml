      solution: |
        List<Product> products = new List<Product>
        {
            new Product("Mouse", 25),
            new Product("Monitor", 210),
            new Product("Keyboard", 45),
        };
        List<Course> courses = new List<Course>
        {
            new Course("C# basics", 120),
            new Course("LINQ", 80),
        };

        Console.WriteLine(TotalPrice(products));
        Console.WriteLine(TotalPrice(courses));

        static int TotalPrice<T>(List<T> items) where T : IPriced
