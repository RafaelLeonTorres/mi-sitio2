    - id: first-or-default
      kind: exercise
      starter: |
        int limit = int.Parse(Console.ReadLine());
        List<Product> products = new List<Product>
        {
            new Product("Keyboard", "Accessories", 45),
            new Product("Mouse", "Accessories", 20),
            new Product("Monitor", "Displays", 210),
            new Product("Laptop", "Computers", 950),
            new Product("Webcam", "Accessories", 60),
            new Product("Tablet", "Computers", 320),
        };

        Product found = products.First(product => product.Price > limit);
        Console.WriteLine(found.Name);

        record Product(string Name, string Category, int Price);
      solution: |
        int limit = int.Parse(Console.ReadLine());
        List<Product> products = new List<Product>
        {
            new Product("Keyboard", "Accessories", 45),
            new Product("Mouse", "Accessories", 20),
            new Product("Monitor", "Displays", 210),
            new Product("Laptop", "Computers", 950),
            new Product("Webcam", "Accessories", 60),
            new Product("Tablet", "Computers", 320),
        };

        Product? found = products.FirstOrDefault(product => product.Price > limit);
        Console.WriteLine(found?.Name ?? "None");

        record Product(string Name, string Category, int Price);
      runs:
        - stdin: "100\n"
          stdout: "Monitor\n"
        - stdin: "900\n"
          stdout: "Laptop\n"
        - stdin: "5000\n"
          stdout: "None\n"
      rules:
        - { kind: calls-method, name: FirstOrDefault }
    - id: any-all
