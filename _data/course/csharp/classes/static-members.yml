      solution: |
        int count = int.Parse(Console.ReadLine());
        for (int i = 0; i < count; i++)
        {
            string name = Console.ReadLine();
            Player player = new Player(name);
        }
        Console.WriteLine(Player.Count);

        class Player
        {
            public static int Count;

            public string Name { get; }

            public Player(string name)
            {
                Name = name;
                Count++;
            }
        }
      runs:
        - stdin: "2\nAna\nLuis\n"
          stdout: "2\n"
        - stdin: "0\n"
          stdout: "0\n"
        - stdin: "4\na\nb\nc\nd\n"
          stdout: "4\n"
      rules:
        - { kind: uses-syntax, name: StaticKeyword }
    - id: utility
      kind: exercise
      starter: |
        double celsius = double.Parse(Console.ReadLine());
        Console.WriteLine(Temperature.ToFahrenheit(celsius));
      solution: |
        double celsius = double.Parse(Console.ReadLine());
        Console.WriteLine(Temperature.ToFahrenheit(celsius));

        static class Temperature
        {
            public static double ToFahrenheit(double celsius)
            {
                return celsius * 9 / 5 + 32;
            }
        }
      runs:
        - stdin: "100\n"
          stdout: "212\n"
        - stdin: "0\n"
          stdout: "32\n"
        - stdin: "-40\n"
          stdout: "-40\n"
      rules:
        - { kind: uses-syntax, name: StaticKeyword, min: 2 }
    - id: static-error
      kind: exercise
      starter: |
        string name = Console.ReadLine();
        Greeter greeter = new Greeter();
        greeter.Name = name;
        Greeter.Hello();

        class Greeter
        {
            public string Name;

            public static void Hello()
            {
                Console.WriteLine($"Hello, {Name}!");
            }
        }
      solution: |
        string name = Console.ReadLine();
        Greeter greeter = new Greeter();
        greeter.Name = name;
        greeter.Hello();

        class Greeter
        {
            public string Name;

            public void Hello()
            {
                Console.WriteLine($"Hello, {Name}!");
            }
        }
      runs:
        - stdin: "Ana\n"
          stdout: "Hello, Ana!\n"
        - stdin: "Luis\n"
          stdout: "Hello, Luis!\n"
