            }
        }
        ```

        ```input
        add Buy milk
        urgent Pay rent
        list
        done 2
        remove 1
        undo
        list
        quit
        ```

        ```text
        Added: Buy milk
        Added: Pay rent
        1. [ ] Buy milk
        2. [ ] Pay rent (urgent)
        Done: Pay rent
        Removed: Buy milk
        Restored: Buy milk
        1. [x] Pay rent (urgent)
