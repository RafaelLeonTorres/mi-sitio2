        }

        class TaskItem
        {
            public string Title { get; }
            public bool Done { get; set; }

            public TaskItem(string title)
            {
                Title = title;
            }

            public override string ToString()
            {
                return Done ? $"[x] {Title}" : $"[ ] {Title}";
            }
        }

        class UrgentTask : TaskItem
        {
