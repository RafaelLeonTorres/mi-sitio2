        ```

        A loop and a `switch` (module 3), a list and a stack (module 4), a method with an `out` parameter (module 5), a class with properties, a constructor and `ToString` (module 6), and a derived class with `override` (module 7). It's about 110 lines and reads top to bottom.

        To keep going, change the program: a `clear` command that removes the done tasks, a priority with an `enum` or a `rename` command. Every change is free practice.
