        ILogger[] loggers = { new ConsoleLogger(), new PrefixLogger("[app]") };
        foreach (ILogger logger in loggers)
        {
            logger.Log(message);
        }

        interface ILogger
        {
            void Log(string message);
        }

        class ConsoleLogger : ILogger
