        - stdin: "abc def\n"
          stdout: "abc def\n"
    - id: total
      kind: exercise
      starter: |
        int invoice = int.Parse(Console.ReadLine());
        int salary = int.Parse(Console.ReadLine());
        IPayable[] items = { new Invoice(invoice), new Employee("Ana", salary) };
        Console.WriteLine(Total(items));

        interface IPayable
        {
            string Name { get; }
            int Amount();
        }

        class Invoice : IPayable
        {
            private int total;

            public Invoice(int total)
            {
                this.total = total;
            }

            public string Name => "Invoice";

            public int Amount()
            {
                return total;
            }
        }

        class Employee : IPayable
        {
            private int salary;

            public Employee(string name, int salary)
            {
                Name = name;
                this.salary = salary;
            }

            public string Name { get; }

            public int Amount()
            {
                return salary;
            }
        }
      solution: |
        int invoice = int.Parse(Console.ReadLine());
        int salary = int.Parse(Console.ReadLine());
        IPayable[] items = { new Invoice(invoice), new Employee("Ana", salary) };
        Console.WriteLine(Total(items));

        static int Total(IPayable[] items)
        {
            int sum = 0;
            foreach (IPayable item in items)
            {
                sum += item.Amount();
            }
            return sum;
        }

        interface IPayable
        {
            string Name { get; }
            int Amount();
        }

        class Invoice : IPayable
        {
            private int total;

            public Invoice(int total)
            {
                this.total = total;
            }

            public string Name => "Invoice";

            public int Amount()
            {
                return total;
            }
        }

        class Employee : IPayable
        {
            private int salary;

            public Employee(string name, int salary)
            {
                Name = name;
                this.salary = salary;
            }

            public string Name { get; }

            public int Amount()
            {
                return salary;
            }
        }
      runs:
        - stdin: "100\n3000\n"
          stdout: "3100\n"
        - stdin: "50\n0\n"
          stdout: "50\n"
        - stdin: "0\n0\n"
          stdout: "0\n"
