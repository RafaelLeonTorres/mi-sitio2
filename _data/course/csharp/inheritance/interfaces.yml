    - id: two-interfaces
      kind: exercise
      starter: |
        string text = Console.ReadLine();
        Note note = new Note();
        IWritable writer = note;
        writer.Write(text);
        IReadable reader = note;
        Console.WriteLine(reader.Read());

        interface IReadable
        {
            string Read();
        }

        interface IWritable
        {
            void Write(string text);
        }
      solution: |
        string text = Console.ReadLine();
        Note note = new Note();
        IWritable writer = note;
        writer.Write(text);
        IReadable reader = note;
        Console.WriteLine(reader.Read());

        interface IReadable
        {
            string Read();
        }

        interface IWritable
        {
            void Write(string text);
        }

        class Note : IReadable, IWritable
        {
            private string text = "";

            public void Write(string text)
            {
                this.text = text;
            }

            public string Read()
            {
                return text;
            }
        }
      runs:
        - stdin: "hello\n"
