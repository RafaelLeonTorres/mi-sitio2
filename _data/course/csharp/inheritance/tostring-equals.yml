      solution: |
        string name = Console.ReadLine();
        int price = int.Parse(Console.ReadLine());
        Product product = new Product(name, price);
        Console.WriteLine(product);

        class Product
        {
            public string Name { get; }
            public int Price { get; }

            public Product(string name, int price)
            {
                Name = name;
                Price = price;
            }

            public override string ToString()
            {
                return $"{Name} costs {Price}";
            }
        }
      runs:
        - stdin: "Pen\n3\n"
          stdout: "Pen costs 3\n"
        - stdin: "Book\n25\n"
          stdout: "Book costs 25\n"
      rules:
        - { kind: uses-syntax, name: OverrideKeyword }
    - id: equals
      kind: exercise
      starter: |
        int amount = int.Parse(Console.ReadLine());
        string currency = Console.ReadLine();
        Money first = new Money(amount, "USD");
        Money second = new Money(amount, currency);
        Console.WriteLine(first.Equals(second));

        class Money
        {
            public int Amount { get; }
            public string Currency { get; }

            public Money(int amount, string currency)
            {
                Amount = amount;
                Currency = currency;
            }
        }
      solution: |
        int amount = int.Parse(Console.ReadLine());
        string currency = Console.ReadLine();
        Money first = new Money(amount, "USD");
        Money second = new Money(amount, currency);
        Console.WriteLine(first.Equals(second));

        class Money
        {
            public int Amount { get; }
            public string Currency { get; }

            public Money(int amount, string currency)
            {
                Amount = amount;
                Currency = currency;
            }

            public override bool Equals(object? obj)
            {
                return obj is Money other && Amount == other.Amount && Currency == other.Currency;
            }

            public override int GetHashCode()
            {
                return HashCode.Combine(Amount, Currency);
            }
        }
      runs:
        - stdin: "5\nUSD\n"
          stdout: "True\n"
        - stdin: "5\nEUR\n"
          stdout: "False\n"
        - stdin: "9\nUSD\n"
          stdout: "True\n"
      rules:
        - { kind: uses-syntax, name: OverrideKeyword, min: 2 }
