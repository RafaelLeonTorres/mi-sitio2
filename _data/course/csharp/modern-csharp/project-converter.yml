            }
            line = Console.ReadLine();
        }

        Unit Find(string name) => units.FirstOrDefault(unit => unit.Name == name) ?? throw new UnitException($"Unknown unit: {name}");

        string Describe(double amount, Unit source, Unit target)
        {
            if (source.Kind != target.Kind)
            {
                throw new UnitException($"Cannot convert {source.Kind} to {target.Kind}");
            }
            double result = target.FromBase(source.ToBase(amount));
            return $"{amount} {source.Name} = {result:F2} {target.Name}";
        }

        static Unit Linear(string name, string kind, double factor) =>
            new(name, kind, value => value * factor, value => value / factor);

        static async Task<Dictionary<string, double>> GetRatesAsync()
        {
            await Task.Delay(50);
            return new Dictionary<string, double> { ["USD"] = 1, ["EUR"] = 0.92, ["GBP"] = 0.79 };
        }

        record Unit(string Name, string Kind, Func<double, double> ToBase, Func<double, double> FromBase);

        class UnitException(string message) : Exception(message);
      runs:
        - stdin: "100 USD to EUR\n100 EUR to USD\nquit\n"
          stdout: "100 USD = 92.00 EUR\n100 EUR = 108.70 USD\n"
        - stdin: "10 GBP to EUR\nquit\n"
          stdout: "10 GBP = 11.65 EUR\n"
        - stdin: "10 USD to km\nquit\n"
          stdout: "Cannot convert currency to length\n"
        - stdin: "10 km to mi\n100 C to F\n"
          stdout: "10 km = 6.21 mi\n100 C = 212.00 F\n"
      rules:
        - { kind: uses-syntax, name: SpreadElement }
