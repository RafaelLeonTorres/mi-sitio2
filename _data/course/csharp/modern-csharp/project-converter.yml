        Unit[] units =
        [
            new("m", "length", 1),
            new("km", "length", 1000),
            new("mi", "length", 1609.344),
            new("kg", "mass", 1),
            new("lb", "mass", 0.45359237),
        ];

        string line = Console.ReadLine();
        while (line != null && line != "quit")
        {
            try
            {
                string message = line.Split(' ') switch
                {
                    [var amountText, var sourceName, "to", var targetName] when double.TryParse(amountText, out double amount)
                        => Describe(amount, Find(sourceName), Find(targetName)),
                    _ => "Try: 10 km to mi",
                };
                Console.WriteLine(message);
            }
            catch (UnitException error)
            {
                Console.WriteLine(error.Message);
            }
            line = Console.ReadLine();
        }

        Unit Find(string name) => units.FirstOrDefault(unit => unit.Name == name) ?? throw new UnitException($"Unknown unit: {name}");

        string Describe(double amount, Unit source, Unit target)
        {
            if (source.Kind != target.Kind)
            {
                throw new UnitException($"Cannot convert {source.Kind} to {target.Kind}");
            }
            double result = amount * source.Factor / target.Factor;
            return $"{amount} {source.Name} = {result:F2} {target.Name}";
        }

        record Unit(string Name, string Kind, double Factor);

        class UnitException(string message) : Exception(message);
      runs:
        - stdin: "5 xyz to m\n10 km to mi\nquit\n"
          stdout: "Unknown unit: xyz\n10 km = 6.21 mi\n"
        - stdin: "5 km to kg\nquit\n"
          stdout: "Cannot convert length to mass\n"
        - stdin: "1 lb to qq\n5 kg to lb\n"
          stdout: "Unknown unit: qq\n5 kg = 11.02 lb\n"
        - stdin: "hello\n10 km to mi\n"
          stdout: "Try: 10 km to mi\n10 km = 6.21 mi\n"
      rules:
        - { kind: uses-syntax, name: PrimaryConstructorBaseType }
        - { kind: uses-syntax, name: TryStatement }
        - { kind: uses-syntax, name: "ThrowStatement|ThrowExpression", min: 2 }
    - id: functions
      kind: exercise
      starter: |
        Unit[] units =
        [
            new("m", "length", 1),
            new("km", "length", 1000),
            new("mi", "length", 1609.344),
            new("kg", "mass", 1),
            new("lb", "mass", 0.45359237),
        ];

        string line = Console.ReadLine();
        while (line != null && line != "quit")
        {
            try
            {
                string message = line.Split(' ') switch
                {
                    [var amountText, var sourceName, "to", var targetName] when double.TryParse(amountText, out double amount)
                        => Describe(amount, Find(sourceName), Find(targetName)),
                    _ => "Try: 10 km to mi",
                };
                Console.WriteLine(message);
            }
            catch (UnitException error)
            {
                Console.WriteLine(error.Message);
            }
            line = Console.ReadLine();
        }

        Unit Find(string name) => units.FirstOrDefault(unit => unit.Name == name) ?? throw new UnitException($"Unknown unit: {name}");

        string Describe(double amount, Unit source, Unit target)
        {
            if (source.Kind != target.Kind)
            {
                throw new UnitException($"Cannot convert {source.Kind} to {target.Kind}");
            }
            double result = target.FromBase(source.ToBase(amount));
            return $"{amount} {source.Name} = {result:F2} {target.Name}";
        }

        static Unit Linear(string name, string kind, double factor) =>
            new(name, kind, value => value * factor, value => value / factor);

        record Unit(string Name, string Kind, Func<double, double> ToBase, Func<double, double> FromBase);

        class UnitException(string message) : Exception(message);
      solution: |
        Unit[] units =
        [
            Linear("m", "length", 1),
            Linear("km", "length", 1000),
            Linear("mi", "length", 1609.344),
            Linear("kg", "mass", 1),
            Linear("lb", "mass", 0.45359237),
            new("C", "temperature", c => c, c => c),
            new("F", "temperature", f => (f - 32) * 5 / 9, c => c * 9 / 5 + 32),
        ];

        string line = Console.ReadLine();
        while (line != null && line != "quit")
        {
            try
            {
                string message = line.Split(' ') switch
                {
                    [var amountText, var sourceName, "to", var targetName] when double.TryParse(amountText, out double amount)
                        => Describe(amount, Find(sourceName), Find(targetName)),
                    _ => "Try: 10 km to mi",
                };
                Console.WriteLine(message);
            }
            catch (UnitException error)
            {
                Console.WriteLine(error.Message);
            }
            line = Console.ReadLine();
        }

        Unit Find(string name) => units.FirstOrDefault(unit => unit.Name == name) ?? throw new UnitException($"Unknown unit: {name}");

        string Describe(double amount, Unit source, Unit target)
        {
            if (source.Kind != target.Kind)
            {
                throw new UnitException($"Cannot convert {source.Kind} to {target.Kind}");
            }
            double result = target.FromBase(source.ToBase(amount));
            return $"{amount} {source.Name} = {result:F2} {target.Name}";
        }

        static Unit Linear(string name, string kind, double factor) =>
            new(name, kind, value => value * factor, value => value / factor);

        record Unit(string Name, string Kind, Func<double, double> ToBase, Func<double, double> FromBase);

        class UnitException(string message) : Exception(message);
      runs:
        - stdin: "100 C to F\n32 F to C\nquit\n"
          stdout: "100 C = 212.00 F\n32 F = 0.00 C\n"
        - stdin: "10 km to mi\n5 kg to lb\n"
          stdout: "10 km = 6.21 mi\n5 kg = 11.02 lb\n"
        - stdin: "-40 C to F\nquit\n"
          stdout: "-40 C = -40.00 F\n"
        - stdin: "5 C to km\nquit\n"
          stdout: "Cannot convert temperature to length\n"
      rules:
        - { kind: uses-syntax, name: "SimpleLambdaExpression|ParenthesizedLambdaExpression", min: 4 }
    - id: rates
      kind: exercise
      starter: |
        Unit[] units =
        [
            Linear("m", "length", 1),
            Linear("km", "length", 1000),
            Linear("mi", "length", 1609.344),
            Linear("kg", "mass", 1),
            Linear("lb", "mass", 0.45359237),
            new("C", "temperature", c => c, c => c),
            new("F", "temperature", f => (f - 32) * 5 / 9, c => c * 9 / 5 + 32),
        ];

        string line = Console.ReadLine();
        while (line != null && line != "quit")
        {
            try
            {
                string message = line.Split(' ') switch
                {
                    [var amountText, var sourceName, "to", var targetName] when double.TryParse(amountText, out double amount)
                        => Describe(amount, Find(sourceName), Find(targetName)),
                    _ => "Try: 10 km to mi",
                };
                Console.WriteLine(message);
            }
            catch (UnitException error)
            {
                Console.WriteLine(error.Message);
            }
            line = Console.ReadLine();
        }

        Unit Find(string name) => units.FirstOrDefault(unit => unit.Name == name) ?? throw new UnitException($"Unknown unit: {name}");

        string Describe(double amount, Unit source, Unit target)
        {
            if (source.Kind != target.Kind)
            {
                throw new UnitException($"Cannot convert {source.Kind} to {target.Kind}");
            }
            double result = target.FromBase(source.ToBase(amount));
            return $"{amount} {source.Name} = {result:F2} {target.Name}";
        }

        static Unit Linear(string name, string kind, double factor) =>
            new(name, kind, value => value * factor, value => value / factor);

        static async Task<Dictionary<string, double>> GetRatesAsync()
        {
            await Task.Delay(50);
            return new Dictionary<string, double> { ["USD"] = 1, ["EUR"] = 0.92, ["GBP"] = 0.79 };
        }

        record Unit(string Name, string Kind, Func<double, double> ToBase, Func<double, double> FromBase);

        class UnitException(string message) : Exception(message);
      solution: |
        Dictionary<string, double> rates = await GetRatesAsync();

        Unit[] units =
        [
            Linear("m", "length", 1),
            Linear("km", "length", 1000),
            Linear("mi", "length", 1609.344),
            Linear("kg", "mass", 1),
            Linear("lb", "mass", 0.45359237),
            new("C", "temperature", c => c, c => c),
            new("F", "temperature", f => (f - 32) * 5 / 9, c => c * 9 / 5 + 32),
            .. rates.Select(rate => Linear(rate.Key, "currency", 1 / rate.Value)),
        ];

        string line = Console.ReadLine();
        while (line != null && line != "quit")
        {
            try
            {
                string message = line.Split(' ') switch
                {
                    [var amountText, var sourceName, "to", var targetName] when double.TryParse(amountText, out double amount)
                        => Describe(amount, Find(sourceName), Find(targetName)),
