# Textos de la interfaz de los cursos de SQL (SQL Server y PostgreSQL) que no comparten los demás
# motores. La página los inyecta junto a los comunes (ui.yml). Por ahora son los de lo que ya se dibuja
# en el HTML que se lee sin JavaScript: el nivel de cada paso, el cuadro "Ojo: diferencias", el paso
# capturado y el cierre de un módulo sin retos. Los del adaptador SQL (el editor, los resultados, los
# errores de la base) se suman cuando llegue.
# Los marcadores {product}, {server}, {date}, {n}, {number}, {level}, {state} y {line} los completa
# Liquid (_includes/course/captured.html).
es:
