  # los distingue.
  levels:
    executable: Ejecutable en tu navegador
    captured: "Salida capturada de {product}"
    concept: Concepto con PostgreSQL
  # El rótulo de lo que devuelve un ejemplo del texto (un ```text después de un ```sql).
  output: Resultado
  # El cuadro plegado de un paso ejecutable: lo que SQL Server hace distinto de lo que corre aquí.
  differences_title: "Ojo: diferencias"
  # El paso capturado: el código, la pregunta de predicción y lo que grabó un servidor real.
  script_title: Código
  predict_title: Antes de ver la salida
  show_output: Ver salida
  result_n: "Resultado {n}"
  no_column_name: (sin nombre de columna)
  no_rows: (sin filas)
  messages_title: Mensajes
  no_messages: (sin mensajes)
  error_line: "Mensaje {number}, nivel {level}, estado {state}, línea {line}"
