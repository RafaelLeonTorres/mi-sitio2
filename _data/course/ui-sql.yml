# Textos de la interfaz de los cursos de SQL (SQL Server y PostgreSQL) que no comparten los demás
# motores. La página los inyecta junto a los comunes (ui.yml). Son los del panel de un ejercicio (el
# editor, el archivo, las tablas), los de lo que se dibuja en el HTML que se lee sin JavaScript (el
# nivel de cada paso, el cuadro "Ojo: diferencias" y el paso capturado) y el cierre de un módulo sin
# retos. Lo que dicen los resultados (cargando, corriendo, errores de la base, notas de la
# traducción) es el de los retos: _data/labs/challenge-ui.yml.
# Los marcadores {product}, {server}, {date}, {n}, {number}, {level}, {state} y {line} los completa
# Liquid (_includes/course/captured.html).
es:
  # El panel de un ejercicio: el editor, el archivo, el estado en reposo y las tablas. Lo que dicen
  # los resultados (cargando, corriendo, errores) es de los retos: challenge-ui.yml.
  editor_label: Editor de SQL
  file: consulta.sql
  idle: Pulsa Ejecutar para ver el resultado.
  empty: Escribe una consulta primero.
  tables: Tablas de este ejercicio
  no_result: La consulta corrió y no devolvió ninguna tabla.
  # Qué clase de paso es. Los pasos de código dicen en qué motor corren; el color no es lo único que
  # los distingue.
  levels:
    executable: Ejecutable en tu navegador
    captured: "Salida capturada de {product}"
    concept: Concepto con PostgreSQL
  # El rótulo de lo que devuelve un ejemplo del texto (un ```text después de un ```sql).
  output: Resultado
  # El cuadro plegado de un paso ejecutable: lo que SQL Server hace distinto de lo que corre aquí.
  differences_title: "Ojo: diferencias"
  # El paso capturado: el código, la pregunta de predicción y lo que grabó un servidor real.
  script_title: Código
  predict_title: Antes de ver la salida
  show_output: Ver salida
  result_n: "Resultado {n}"
  no_column_name: (sin nombre de columna)
  no_rows: (sin filas)
  messages_title: Mensajes
  no_messages: (sin mensajes)
  error_line: "Mensaje {number}, nivel {level}, estado {state}, línea {line}"
  error_meaning: "Qué significa el error {number}"
  captured_footer: "{product} ({server}), capturado el {date}."
  # El cierre de un módulo sin retos remite al playground, y el último enlace lleva a todos los retos
  # (_includes/course/practice.html).
  practice_none: "Los retos del laboratorio de este módulo llegan con el curso. Mientras tanto, prueba lo que aprendiste en el"
  practice_playground: playground de SQL
  practice_all: Ver todos los retos de SQL
