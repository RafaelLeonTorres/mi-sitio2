        planned: []

# SQL Server (T-SQL): los 14 módulos del plan (PLAN-CURSO-SQLSERVER.md, sección 7). Ya existen los
# módulos 1 a 5 y la lección piloto del módulo 11; las demás salen como "Próximamente". En un módulo
# con lecciones nuevas, `planned` lista las que faltan.
sqlserver:
  modules:
    - id: first-steps
      lessons: [ssms-vscode, first-query, aliases-expressions, top-order-by, distinct]
      practice:
        challenges: []
        posts: []
      es:
        slug: primeros-pasos
        title: Primeros pasos con T-SQL
        summary: Qué es una consulta, cómo se lee la base de ejemplo y tus primeras instrucciones con SELECT.
        planned: []
      en:
        slug: first-steps
        title: First steps with T-SQL
        summary: What a query is, how to read the sample database, and your first SELECT statements.
        planned: []
    - id: filtering
      lessons: [where, and-or-not, between-in-like, null-isnull-coalesce, order-by-offset-fetch]
      practice:
        challenges: []
        posts: []
      es:
        slug: filtrar-y-ordenar
        title: Filtrar y ordenar
        summary: Quedarte con las filas que importan y ponerlas en orden, incluidos los valores que faltan.
        planned: []
      en:
        slug: filtering-and-sorting
        title: Filtering and sorting
        summary: Keep the rows that matter and put them in order, including missing values.
        planned: []
    - id: types-functions
      lessons: [numbers, text, dates, case-iif, conversions, collation]
      practice:
        challenges: []
        posts: []
      es:
        slug: tipos-y-funciones
        title: Tipos y funciones
        summary: Números, texto y fechas, condicionales, conversiones y cómo compara SQL Server el texto.
        planned: []
      en:
        slug: types-and-functions
        title: Types and functions
        summary: Numbers, text and dates, conditionals, conversions, and how SQL Server compares text.
        planned: []
    - id: grouping
      lessons: [aggregates, group-by, having, string-agg, rollup]
      practice:
        challenges: [conditional-aggregation]
        posts: []
      es:
        slug: agrupar-y-resumir
        title: Agrupar y resumir
        summary: Contar, sumar y promediar por grupos, y filtrar los grupos.
        planned: []
      en:
        slug: grouping-and-summarizing
        title: Grouping and summarizing
        summary: Count, add up, and average by group, and filter the groups.
        planned: []
    - id: joins
      lessons: [keys, inner-join, outer-joins, self-cross, apply, exists]
      practice:
        challenges: [employees-without-department, orders-per-customer, employees-earning-more-than-manager, customers-without-orders, prices-by-date]
        posts: []
      es:
        slug: unir-tablas
        title: Unir tablas
        summary: Combinar tablas con sus llaves, con uniones internas y externas, autouniones, APPLY y EXISTS.
        planned: []
      en:
        slug: joining-tables
        title: Joining tables
        summary: Combine tables through their keys, with inner and outer joins, self-joins, APPLY, and EXISTS.
        planned: []
    - id: subqueries-ctes
      lessons: []
      practice:
        challenges: []
        posts: []
      es:
        slug: subconsultas-y-cte
        title: Subconsultas y CTE
        summary: Consultas dentro de consultas, expresiones de tabla comunes y operaciones entre conjuntos.
        planned:
          - Subconsultas escalares
          - IN y EXISTS
          - Correlacionadas y tablas derivadas
          - WITH
          - CTE recursivas
          - UNION, INTERSECT y EXCEPT
      en:
        slug: subqueries-and-ctes
        title: Subqueries and CTEs
        summary: Queries inside queries, common table expressions, and set operations.
        planned:
          - Scalar subqueries
          - IN and EXISTS
          - Correlated subqueries and derived tables
          - WITH
          - Recursive CTEs
          - UNION, INTERSECT, and EXCEPT
    - id: window-functions
      lessons: []
      practice:
        challenges: []
        posts: []
      es:
        slug: funciones-de-ventana
        title: Funciones de ventana
        summary: "Calcular sobre un conjunto de filas sin colapsarlas: rangos, acumulados y comparaciones con la fila anterior."
        planned:
          - OVER y PARTITION BY
          - ROW_NUMBER, RANK y DENSE_RANK
          - LAG y LEAD
          - Acumulados y marcos
          - Top-N por grupo
      en:
        slug: window-functions
        title: Window functions
        summary: Calculate over a set of rows without collapsing them. Rankings, running totals, and comparisons with the previous row.
        planned:
          - OVER and PARTITION BY
          - ROW_NUMBER, RANK, and DENSE_RANK
