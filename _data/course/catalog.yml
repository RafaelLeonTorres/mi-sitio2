        title: C# moderno
        summary: Patrones, registros y lo nuevo del lenguaje.
        planned: []
      en:
        slug: modern-csharp
        title: Modern C#
        summary: Patterns, records and what's new in the language.
        planned: []

# SQL Server (T-SQL): los 14 módulos del plan (PLAN-CURSO-SQLSERVER.md, sección 7). Ya existen los
# módulos 1 a 4 y la lección piloto del módulo 11; las demás salen como "Próximamente". En un módulo
# con lecciones nuevas, `planned` lista las que faltan.
sqlserver:
  modules:
    - id: first-steps
      lessons: [ssms-vscode, first-query, aliases-expressions, top-order-by, distinct]
      practice:
        challenges: []
        posts: []
