          - tempdb y SQL Server Agent
      en:
        slug: security-and-operations
        title: Security and operations
        summary: Permissions, backups, and the tools for watching over a server (reading only).
        planned:
          - Logins and permissions
          - Backups
          - Query Store and management views
          - tempdb and SQL Server Agent

