          - Cobertura (INCLUDE) y filtrados
          - Planes de ejecución
          - Estadísticas
          - Columnstore
      en:
        slug: indexes-and-plans
        title: Indexes and plans
        summary: How SQL Server finds rows, which indexes help, and how to read an execution plan.
        planned:
          - What an index is
          - Clustered and nonclustered
          - Covering (INCLUDE) and filtered indexes
          - Execution plans
          - Statistics
          - Columnstore
    - id: programmable-tsql
      lessons: [try-catch]
      practice:
        challenges: []
        posts: []
      es:
        slug: tsql-programable
        title: T-SQL programable
        summary: "Variables, control de flujo, errores y transacciones: lo que va más allá de una sola consulta."
        planned:
          - Variables
          - IF y WHILE
          - Transacciones y XACT_ABORT
          - Cursores
          - SQL dinámico
      en:
        slug: programmable-tsql
        title: Programmable T-SQL
        summary: "Variables, flow control, errors, and transactions: what goes beyond a single query."
        planned:
          - Variables
          - IF and WHILE
          - Transactions and XACT_ABORT
          - Cursors
          - Dynamic SQL
    - id: programmable-objects
      lessons: []
      practice:
        challenges: []
        posts: []
      es:
        slug: objetos-programables
        title: Objetos programables
        summary: Vistas, funciones, procedimientos almacenados, triggers y secuencias.
        planned:
          - Vistas
          - Funciones
          - Procedimientos almacenados
          - Triggers
          - Secuencias
      en:
        slug: programmable-objects
        title: Programmable objects
        summary: Views, functions, stored procedures, triggers, and sequences.
        planned:
          - Views
          - Functions
          - Stored procedures
          - Triggers
          - Sequences
    - id: concurrency
      lessons: []
      practice:
        challenges: []
        posts: []
      es:
        slug: concurrencia
        title: Concurrencia
        summary: Qué pasa cuando dos sesiones tocan los mismos datos, con un simulador de dos sesiones.
        planned:
          - ACID y bloqueos
          - Aislamiento
          - Interbloqueos
          - NOLOCK y sus riesgos
          - Versionado de filas
      en:
        slug: concurrency
        title: Concurrency
        summary: What happens when two sessions touch the same data, with a two-session simulator.
        planned:
          - ACID and locks
          - Isolation levels
          - Deadlocks
          - NOLOCK and its risks
          - Row versioning
    - id: security-operations
      lessons: []
      practice:
        challenges: []
        posts: []
      es:
        slug: seguridad-y-operacion
        title: Seguridad y operación
        summary: Permisos, copias de seguridad y las herramientas para vigilar un servidor (de lectura).
        planned:
          - Inicios de sesión y permisos
