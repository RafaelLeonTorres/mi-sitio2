# El temario del curso de C#: módulos en orden, las lecciones que ya existen (`lessons`, con su
# archivo en _data/course/csharp/<módulo>/<id>.yml) y las que vienen (`planned`, solo títulos).
# `practice` es el cierre de cada módulo: los ids de los retos de C# del laboratorio que practican lo
# mismo (en _data/labs/challenges/, de lo fácil a lo difícil, y cada reto en un solo módulo) y los `ref`
# de las publicaciones del blog sobre el tema. Un módulo sin retos remite al playground de C#.
csharp:
  modules:
