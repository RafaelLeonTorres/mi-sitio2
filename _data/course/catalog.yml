# El temario del curso de C#: módulos en orden, las lecciones que ya existen (`lessons`, con su
# archivo en _data/course/csharp/<módulo>/<id>.yml) y las que vienen (`planned`, solo títulos).
csharp:
  modules:
    - id: first-steps
      lessons: [hello-world, comments-and-style, variables, data-types, constants, reading-input]
      es:
        slug: primeros-pasos
        title: Primeros pasos
        summary: Tu primer programa, variables, tipos de datos y entrada de datos.
        planned: []
      en:
        slug: first-steps
        title: First steps
        summary: Your first program, variables, data types and reading input.
        planned: []
    - id: operators-text
      lessons: [arithmetic, compound-assignment, comparison-logic, strings, interpolation-format, type-conversion]
      es:
        slug: operadores-y-texto
        title: Operadores y texto
        summary: Aritmética, comparaciones, cadenas, formato y conversiones.
        planned: []
      en:
        slug: operators-and-text
        title: Operators and text
        summary: Arithmetic, comparisons, strings, formatting and conversions.
        planned: []
    - id: control-flow
      lessons: [if-else, switch, ternary-null, while-do, for, foreach, break-continue, project-guess]
      es:
        slug: control-de-flujo
        title: Control de flujo
        summary: Decisiones y ciclos para que el programa elija y repita.
        planned: []
      en:
        slug: control-flow
        title: Control flow
        summary: Decisions and loops so the program can choose and repeat.
        planned: []
    - id: collections
      lessons: [arrays, lists, dictionaries, sets-queues, indexes-ranges]
      es:
        slug: colecciones
        title: Colecciones
        summary: Arreglos, listas, diccionarios y conjuntos.
        planned: []
      en:
        slug: collections
        title: Collections
        summary: Arrays, lists, dictionaries and sets.
        planned: []
    - id: methods
      lessons: [declare-call, parameters-return, optional-named-params, ref-out-in, overloading, recursion, local-functions-scope]
      es:
        slug: metodos
        title: Métodos
        summary: Agrupa código en métodos y reutilízalo.
        planned: []
      en:
        slug: methods
        title: Methods
        summary: Group code into methods and reuse it.
        planned: []
    - id: classes
      lessons: [classes-objects, fields-properties, constructors, static-members, encapsulation, records-structs, enums]
      es:
        slug: clases-y-objetos
        title: Clases y objetos
        summary: Modela cosas del mundo real con clases.
        planned: []
      en:
        slug: classes-and-objects
        title: Classes and objects
        summary: Model real-world things with classes.
        planned: []
    - id: inheritance
      lessons: [inheritance, virtual-override, abstract-classes, interfaces, composition, tostring-equals]
      es:
        slug: herencia-y-polimorfismo
        title: Herencia y polimorfismo
        summary: Reutiliza y especializa comportamiento.
        planned: []
      en:
        slug: inheritance-and-polymorphism
        title: Inheritance and polymorphism
        summary: Reuse and specialize behavior.
        planned: []
    - id: nulls-errors
      lessons: [nullable-values, nullable-references, try-catch-finally, throwing, custom-exceptions, using-disposable]
      es:
        slug: nulos-y-errores
        title: Nulos y errores
        summary: Valores que faltan y errores que se manejan.
        planned: []
      en:
        slug: nulls-and-errors
        title: Nulls and errors
        summary: Missing values and errors you handle.
        planned: []
    - id: linq
      lessons: [where-select, sorting, first-any-count, group-by, join-to-dictionary, deferred-execution]
      es:
        slug: linq
        title: LINQ
        summary: Consulta colecciones con una sintaxis expresiva.
        planned: []
      en:
        slug: linq
        title: LINQ
        summary: Query collections with an expressive syntax.
        planned: []
    - id: generics-delegates
      lessons: [generics, delegates, lambdas, events]
      es:
        slug: genericos-y-delegados
        title: Genéricos y delegados
        summary: Código que sirve para varios tipos y funciones como valores.
        planned: []
      en:
        slug: generics-and-delegates
        title: Generics and delegates
        summary: Code that works with several types, and functions as values.
        planned: []
    - id: async
      lessons: []
      es:
        slug: asincronia
        title: Asincronía
        summary: Tareas, async y await.
        planned: [Task y async await, Task.WhenAll, Cancelación]
      en:
        slug: asynchronous-code
        title: Asynchronous code
        summary: Tasks, async and await.
        planned: [Task and async await, Task.WhenAll, Cancellation]
    - id: modern-csharp
      lessons: []
      es:
        slug: csharp-moderno
        title: C# moderno
        summary: Patrones, registros y lo nuevo del lenguaje.
        planned: [Coincidencia de patrones, Registros y with, Constructores primarios, Expresiones de colección, Novedades de C# 14 y 15]
      en:
        slug: modern-csharp
        title: Modern C#
        summary: Patterns, records and what's new in the language.
        planned: [Pattern matching, Records and with, Primary constructors, Collection expressions, What's new in C# 14 and 15]
