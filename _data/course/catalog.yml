          - IDENTITY y secuencias
          - Columnas calculadas
          - ALTER TABLE
          - Tablas temporales y variables de tabla
      en:
        slug: designing-tables
        title: Designing tables
        summary: Data types, keys, constraints, computed columns, and schema changes.
        planned:
          - CREATE TABLE and data types
          - Keys and constraints
          - IDENTITY and sequences
          - Computed columns
          - ALTER TABLE
          - Temporary tables and table variables
    - id: indexes-plans
      lessons: []
      practice:
        challenges: []
        posts: []
      es:
        slug: indices-y-planes
