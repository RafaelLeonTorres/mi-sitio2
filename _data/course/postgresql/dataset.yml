# La base de ejemplo del curso de PostgreSQL: la misma tienda de café de los retos y del curso de SQL
# Server, escrita en PostgreSQL (nombres en snake_case, sin comillas). Con la forma de
# challenge-datasets.yml: por tabla, su CREATE TABLE, los valores que toman las columnas obligatorias
# que un caso no da (`defaults`) y las filas de ejemplo, las que se ven en el cuadro de tablas y con
# las que corre el caso de ejemplo de cada ejercicio.
# Los datos van sin acentos: PGlite ordena con la intercalación C, que pone las letras con acento
# después de la z (la lección de ORDER BY lo enseña con datos propios).
# En `es` y `en` va, por tabla, qué guarda.

shared:
  tables:
    - id: customers
      ddl: |
        CREATE TABLE customers (
          id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
          name text NOT NULL,
          email text NOT NULL,
          city text NOT NULL,
          created_at date NOT NULL,
          phone text
        );
      defaults: { name: Cliente, email: cliente@example.com, city: CDMX, created_at: "2024-01-01" }
      sample:
        columns: [id, name, email, city, created_at, phone]
        rows:
          - [1, Ana Torres, ana.torres@example.com, CDMX, "2024-02-10", "55 5550 0101"]
          - [2, Luis Hernandez, luis.hdz@example.com, Monterrey, "2024-03-22", null]
          - [3, Maria Lopez, maria.lopez@example.com, Guadalajara, "2024-05-05", "33 5550 0103"]
          - [4, Jorge Ramirez, jorge.ramirez@example.com, CDMX, "2024-07-18", null]
          - [5, Sofia Castro, sofia.castro@example.com, Puebla, "2025-01-09", "222 555 0105"]
          - [6, Diego Morales, diego.morales@example.com, Merida, "2025-04-30", "999 555 0106"]
    - id: categories
      ddl: |
        CREATE TABLE categories (
          id integer PRIMARY KEY,
          name text NOT NULL
        );
      sample:
        columns: [id, name]
        rows:
          - [1, Cafe]
          - [2, Te]
          - [3, Accesorios]
    - id: products
      ddl: |
        CREATE TABLE products (
          id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
          sku text NOT NULL UNIQUE,
          name text NOT NULL,
          category_id integer NOT NULL,
          price numeric(10, 2) NOT NULL
        );
      defaults: { name: Producto, category_id: 1, price: 100 }
      sample:
        columns: [id, sku, name, category_id, price]
        rows:
          - [1, CAF-001, Cafe de Chiapas 500 g, 1, 189.00]
          - [2, CAF-002, Cafe de Veracruz 1 kg, 1, 329.00]
          - [3, TE-001, Te verde 100 g, 2, 95.00]
          - [4, TE-002, Te de manzanilla 50 g, 2, 59.00]
          - [5, ACC-001, Prensa francesa, 3, 449.00]
          - [6, ACC-002, Molino manual, 3, 599.00]
    - id: orders
      ddl: |
        CREATE TABLE orders (
          id integer PRIMARY KEY,
          customer_id integer NOT NULL,
          ordered_at timestamp NOT NULL,
          status text NOT NULL,
          total numeric(10, 2) NOT NULL,
          shipped_at timestamp
        );
      defaults: { customer_id: 1, ordered_at: "2026-10-01 10:00:00", status: shipped, total: 100 }
      sample:
        columns: [id, customer_id, ordered_at, status, total, shipped_at]
        rows:
          - [101, 1, "2026-09-03 10:15:00", shipped, 518.00, "2026-09-04 09:00:00"]
          - [102, 2, "2026-09-10 18:40:00", shipped, 189.00, "2026-09-11 12:00:00"]
          - [103, 1, "2026-10-01 09:05:00", shipped, 95.00, "2026-10-02 10:30:00"]
          - [104, 3, "2026-10-07 13:20:00", pending, 449.00, null]
          - [105, 4, "2026-10-15 20:00:00", shipped, 658.00, "2026-10-16 11:00:00"]
          - [106, 2, "2026-10-21 08:45:00", cancelled, 59.00, null]
    - id: order_items
      ddl: |
        CREATE TABLE order_items (
          order_id integer NOT NULL,
          line_number integer NOT NULL,
          product_id integer NOT NULL,
          quantity integer NOT NULL,
          unit_price numeric(10, 2) NOT NULL,
          PRIMARY KEY (order_id, line_number)
        );
      defaults: { product_id: 1, quantity: 1, unit_price: 100 }
      sample:
        columns: [order_id, line_number, product_id, quantity, unit_price]
        rows:
          - [101, 1, 1, 1, 189.00]
          - [101, 2, 2, 1, 329.00]
          - [102, 1, 1, 1, 189.00]
          - [103, 1, 3, 1, 95.00]
          - [104, 1, 5, 1, 449.00]
          - [105, 1, 2, 2, 329.00]
          - [106, 1, 4, 1, 59.00]
    - id: shipments
      ddl: |
        CREATE TABLE shipments (
          order_id integer PRIMARY KEY,
          carrier text NOT NULL
        );
      defaults: { carrier: DHL }
      sample:
        columns: [order_id, carrier]
        rows:
          - [101, DHL]
          - [102, Estafeta]
          - [103, DHL]
          - [105, FedEx]
    - id: departments
      ddl: |
        CREATE TABLE departments (
          id integer PRIMARY KEY,
          name text NOT NULL
        );
      sample:
        columns: [id, name]
        rows:
          - [1, Ventas]
          - [2, Sistemas]
          - [3, Finanzas]
          - [4, Logistica]
    - id: employees
      ddl: |
        CREATE TABLE employees (
          id integer PRIMARY KEY,
          name text NOT NULL,
          department_id integer,
          manager_id integer,
          salary numeric(10, 2) NOT NULL,
          hired_on date NOT NULL
        );
      defaults: { salary: 50000, hired_on: "2022-01-01" }
      sample:
        columns: [id, name, department_id, manager_id, salary, hired_on]
        rows:
          - [1, Carmen Ruiz, 2, null, 98000.00, "2018-03-01"]
          - [2, Pablo Ortega, 2, 1, 72000.00, "2020-06-15"]
          - [3, Lucia Vega, 2, 1, 76000.00, "2021-01-10"]
          - [4, Raul Medina, 1, null, 85000.00, "2019-09-01"]
          - [5, Elena Rios, 1, 4, 54000.00, "2022-04-04"]
          - [6, Tomas Silva, 3, null, 91000.00, "2017-11-20"]
          - [7, Andrea Nunez, null, 4, 48000.00, "2023-02-13"]
    - id: accounts
      ddl: |
        CREATE TABLE accounts (
          id integer PRIMARY KEY,
          holder text NOT NULL,
          balance numeric(12, 2) NOT NULL CHECK (balance >= 0)
        );
      defaults: { holder: Titular, balance: 0 }
      sample:
        columns: [id, holder, balance]
        rows:
          - [1, Ana Torres, 1500.00]
          - [2, Luis Hernandez, 300.00]
          - [3, Maria Lopez, 0.00]
    - id: staging_products
      ddl: |
        CREATE TABLE staging_products (
          sku text PRIMARY KEY,
          name text NOT NULL,
          category_id integer NOT NULL,
          price numeric(10, 2) NOT NULL
        );
      defaults: { name: Producto, category_id: 1, price: 100 }
      sample:
        columns: [sku, name, category_id, price]
        rows:
          - [CAF-001, Cafe de Chiapas 500 g, 1, 199.00]
          - [TE-003, Te negro 100 g, 2, 85.00]
    - id: events
      ddl: |
        CREATE TABLE events (
          id integer PRIMARY KEY,
          kind text NOT NULL,
          payload jsonb NOT NULL
        );
      defaults: { kind: view }
      sample:
        columns: [id, kind, payload]
        rows:
          - [1, order, '{"order_id": 101, "channel": "web", "tags": ["new"]}']
          - [2, order, '{"order_id": 102, "channel": "app", "tags": []}']
          - [3, view, '{"sku": "CAF-001", "channel": "web"}']
          - [4, view, '{"sku": "TE-001", "channel": "app", "tags": ["promo"]}']
    - id: articles
      ddl: |
        CREATE TABLE articles (
          id integer PRIMARY KEY,
          title text NOT NULL,
          body text NOT NULL,
          tags text[] NOT NULL DEFAULT '{}'
        );
      defaults: { title: Nota, body: Texto }
      sample:
        columns: [id, title, body, tags]
        rows:
          - [1, Cafe de altura, El cafe de Chiapas se cultiva en las montanas, "{cafe,origen}"]
          - [2, Como preparar te, El te verde se prepara con agua que no hierva, "{te,preparacion}"]
          - [3, Molinos manuales, Un molino manual muele el cafe sin electricidad, "{cafe,equipo}"]
    - id: bookings
      ddl: |
        CREATE TABLE bookings (
          id integer PRIMARY KEY,
          room text NOT NULL,
          during daterange NOT NULL
        );
      sample:
        columns: [id, room, during]
        rows:
          - [1, Sala A, "[2026-11-02,2026-11-05)"]
          - [2, Sala A, "[2026-11-09,2026-11-10)"]
          - [3, Sala B, "[2026-11-04,2026-11-12)"]
  generators:
    # Miles de filas para los planes: deterministas, sin random().
    - id: many_customers
      sql: |
        INSERT INTO customers (id, name, email, city, created_at)
        SELECT i, 'Cliente ' || i, 'cliente' || i || '@example.com',
          (ARRAY['CDMX', 'Monterrey', 'Guadalajara', 'Puebla', 'Merida'])[1 + i % 5],
          date '2019-01-01' + i % 1500
        FROM generate_series(1, 20000) AS i;
    - id: many_orders
      sql: |
        INSERT INTO orders (id, customer_id, ordered_at, status, total)
        SELECT i, 1 + i % 5000, timestamp '2022-01-01' + i * interval '37 minutes',
          CASE WHEN i % 997 = 0 THEN 'cancelled' WHEN i > 49000 THEN 'pending' ELSE 'shipped' END,
          10 + i % 900
        FROM generate_series(1000, 51000) AS i;
    - id: many_events
      sql: |
        INSERT INTO events (id, kind, payload)
        SELECT i, 'view',
          jsonb_build_object('sku', 'SKU-' || i % 5000, 'channel', CASE WHEN i % 2 = 0 THEN 'web' ELSE 'app' END)
        FROM generate_series(1000, 31000) AS i;

es:
  tables:
    customers: Los clientes de la tienda.
    categories: Las categorías de los productos.
    products: Los productos, con su código y su precio.
    orders: Los pedidos de los clientes.
    order_items: Los renglones de cada pedido.
    shipments: La paquetería que lleva cada pedido enviado.
    departments: Los departamentos de la empresa.
    employees: Los empleados, con su departamento y su jefe.
    accounts: Cuentas con saldo, para las transacciones.
    staging_products: Productos por cargar en el catálogo.
    events: Eventos con sus datos en JSON.
    articles: Artículos con sus etiquetas.
    bookings: Reservaciones de salas por fechas.
  generators:
    - id: many_customers
      text: 20,000 clientes de cinco ciudades.
    - id: many_orders
      text: 50,001 pedidos desde 2022, de 5,000 clientes; casi todos enviados.
    - id: many_events
      text: 30,001 eventos con su producto y su canal.

en:
  tables:
    customers: The shop's customers.
    categories: The product categories.
    products: The products, with their code and price.
    orders: The customers' orders.
    order_items: The lines of each order.
    shipments: The carrier of each shipped order.
    departments: The company's departments.
    employees: The employees, with their department and manager.
    accounts: Accounts with a balance, for transactions.
    staging_products: Products to load into the catalog.
    events: Events with their data in JSON.
    articles: Articles with their tags.
    bookings: Room bookings by date.
  generators:
    - id: many_customers
      text: 20,000 customers from five cities.
    - id: many_orders
      text: 50,001 orders since 2022, from 5,000 customers; almost all shipped.
    - id: many_events
      text: 30,001 events with their product and channel.
