shared:
  minutes: 10
  steps:
    - id: numbers
      kind: read
    - id: tickets
      kind: exercise
      level: executable
      mode: change
      tables: []
      starter: |
        CREATE TABLE tickets (
          id integer PRIMARY KEY,
          title text NOT NULL
        );
      solution: |
        CREATE TABLE tickets (
          id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          title text NOT NULL
        );
      check: table
      verify: >-
        SELECT column_name, is_identity, identity_generation
        FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'tickets'
        ORDER BY ordinal_position
      cases:
        - sample: true
        - tables: {}
    - id: folio
      kind: exercise
      level: executable
      mode: change
      tables: []
      starter: |
        CREATE SEQUENCE folio;
      solution: |
        CREATE SEQUENCE folio START WITH 1000 INCREMENT BY 10;
      check: table
      verify: >-
        SELECT sequencename, start_value, increment_by
        FROM pg_sequences
        WHERE schemaname = 'public' AND sequencename = 'folio'
      cases:
        - sample: true
        - tables: {}
    - id: gaps
      kind: choice
      answer: 2
es:
  slug: identidad-y-secuencias
  title: Identidad y secuencias
  summary: Generar números únicos con columnas de identidad y secuencias.
  steps:
    numbers:
      title: Números que genera la base
      text: |
        Una **secuencia** entrega números en orden con `nextval`. Una columna `GENERATED ... AS IDENTITY` usa una secuencia propia: con `ALWAYS` no se acepta un valor tuyo (salvo que lo pidas), con `BY DEFAULT` sí. `serial` es la forma antigua.

        ```sql
        CREATE SEQUENCE ticket_numbers START WITH 100;
        SELECT nextval('ticket_numbers') AS first, nextval('ticket_numbers') AS second;
        ```

        ```text
         first | second
        -------+--------
           100 |    101
        (1 fila)
        ```
    tickets:
      title: Una identidad
      text: |
        Las llaves numéricas conviene que las genere la base.
      instructions: |
        Haz que `tickets.id` sea una identidad que **siempre** genera la base, y siga siendo la llave primaria.
      hints:
        - Agrega la cláusula antes de `PRIMARY KEY`.
        - Es `GENERATED ALWAYS AS IDENTITY`.
        - La columna queda `id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY`.
      explanation: |
        Con `ALWAYS`, un `INSERT` que dé el `id` falla, lo que evita chocar con la secuencia.
      failure: "`id` debe ser una identidad `ALWAYS`."
    folio:
      title: Una secuencia propia
      text: |
        Una secuencia se puede usar en varias tablas o para folios.
      instructions: |
        Haz que la secuencia `folio` empiece en 1000 y avance de 10 en 10.
      hints:
        - Las opciones van después del nombre.
        - Son `START WITH` e `INCREMENT BY`.
        - La instrucción es `CREATE SEQUENCE folio START WITH 1000 INCREMENT BY 10;`.
      explanation: |
        `nextval('folio')` entregará 1000, 1010, 1020 y así sucesivamente.
      failure: La secuencia debe empezar en 1000 y avanzar de 10 en 10.
    gaps:
      title: Huecos en los números
      text: |
        Un `INSERT` toma un número de la secuencia y su transacción termina en `ROLLBACK`.
      question: ¿Qué número recibe la siguiente fila?
      options:
        - El mismo, porque se deshizo.
        - Se produce un error.
        - El siguiente; el número usado se pierde.
        - El 1 otra vez.
      explanation: |
        Las secuencias no se deshacen, así pueden usarse a la vez por muchas sesiones. Por eso los `id` pueden tener huecos.
en:
  slug: identity-and-sequences
  title: Identity and sequences
  summary: Generate unique numbers with identity columns and sequences.
  steps:
    numbers:
      title: Numbers the database generates
      text: |
        A **sequence** hands out numbers in order with `nextval`. A `GENERATED ... AS IDENTITY` column uses its own sequence. With `ALWAYS` your own value isn't accepted (unless you ask for it); with `BY DEFAULT` it is. `serial` is the old form.

        ```sql
        CREATE SEQUENCE ticket_numbers START WITH 100;
        SELECT nextval('ticket_numbers') AS first, nextval('ticket_numbers') AS second;
        ```

        ```text
         first | second
        -------+--------
           100 |    101
        (1 row)
        ```
    tickets:
      title: An identity
      text: |
        It's better to let the database generate numeric keys.
      instructions: |
        Make `tickets.id` an identity **always** generated by the database, still the primary key.
      hints:
        - Add the clause before `PRIMARY KEY`.
        - It's `GENERATED ALWAYS AS IDENTITY`.
        - The column becomes `id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY`.
      explanation: |
        With `ALWAYS`, an `INSERT` that provides the `id` fails, which avoids clashing with the sequence.
      failure: "`id` must be an `ALWAYS` identity."
    folio:
      title: Your own sequence
      text: |
        A sequence can be used in several tables or for folio numbers.
      instructions: |
        Make the `folio` sequence start at 1000 and advance by 10.
      hints:
        - The options go after the name.
        - They're `START WITH` and `INCREMENT BY`.
        - The statement is `CREATE SEQUENCE folio START WITH 1000 INCREMENT BY 10;`.
      explanation: |
        `nextval('folio')` will give 1000, 1010, 1020, and so on.
      failure: The sequence must start at 1000 and advance by 10.
    gaps:
      title: Gaps in the numbers
      text: |
        An `INSERT` takes a number from the sequence and its transaction ends in `ROLLBACK`.
      question: Which number does the next row get?
      options:
        - The same one, because it was undone.
        - An error happens.
        - The next one; the used number is lost.
        - 1 again.
      explanation: |
        Sequences aren't rolled back, so many sessions can use them at once. That's why `id`s can have gaps.
