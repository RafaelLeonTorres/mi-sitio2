- company: Qualis Technologies
  product: EMA Salud
  url: https://www.emasalud.mx/
  current: true
  stack: [".NET 9", "C#", "Nancy", "ASP.NET Core", "EF Core 9", "SQL Server", "PostgreSQL", "Angular 19", "TypeScript", "Kendo UI", "xUnit", "Moq", "Jest", "Docker", "Azure DevOps", "Jira", "Claude Code"]
  es:
    role: Desarrollador de Software
    period: Marzo 2026 – actualidad
    summary: EMA Salud es un ecosistema para clínicas, hospitales y farmacias que usan instituciones públicas de salud en México. Trabajo principalmente en los módulos de farmacia y expediente clínico (hospitalización, urgencias y consulta externa).
    highlights:
      - Desarrollé funcionalidades de punta a punta en .NET 9 (Nancy, ASP.NET Core y EF Core 9) y Angular 19, como la carga masiva de pedidos desde Excel con validación por fila, la clasificación AWARE de antibióticos, la ventana extendida para modificar dispensaciones controlada por parámetros y el llenado de datos del paciente a partir de su CURP.
      - Optimicé reportes y consultas críticas (N+1, AsNoTracking, consultas en dos fases, índices y procesamiento por lotes) y validé contra una línea base que los resultados no cambiaran.
      - Diseñé scripts T-SQL idempotentes y transaccionales para migrar y normalizar datos entre versiones, probados con simulaciones de 10 millones de registros.
      - Diagnostiqué incidencias productivas con consultas de solo lectura, las repliqué en local con scripts de ambientación y rollback, y expliqué la causa en lenguaje claro a negocio y QA.
      - Revisé pull requests del equipo con un checklist propio (complejidad, valores mágicos, N+1 y seguridad) y escribí pruebas con xUnit, Moq y Jest.
      - Integré IA al flujo de trabajo con skills de Claude Code por módulo y servidores MCP para analizar código, revisar PRs y documentar planes, runbooks y mapas de arquitectura.
  en:
    role: Software Developer
    period: March 2026 – present
    summary: EMA Salud is a platform for clinics, hospitals, and pharmacies used by public healthcare institutions in Mexico. I work mainly on the pharmacy and electronic health record modules (inpatient, emergency, and outpatient care).
    highlights:
      - Built end-to-end features with .NET 9 (Nancy, ASP.NET Core, and EF Core 9) and Angular 19, including bulk order uploads from Excel with row-level validation, AWARE antibiotic classification, a parameter-controlled extended window for editing dispensations, and filling in patient data from the CURP (Mexico's national ID code).
      - Optimized critical reports and queries (N+1, AsNoTracking, two-phase queries, indexes, and batching), validating against a baseline that the results stayed identical.
      - Designed idempotent, transactional T-SQL scripts to migrate and normalize data between versions, tested with simulations of 10 million records.
      - Diagnosed production incidents with read-only queries, reproduced them locally with setup and rollback scripts, and explained the root cause in plain language to business and QA.
      - Reviewed the team's pull requests with my own checklist (complexity, magic numbers, N+1, and security) and wrote tests with xUnit, Moq, and Jest.
      - Brought AI into the workflow with per-module Claude Code skills and MCP servers to analyze code, review pull requests, and document plans, runbooks, and architecture maps.

