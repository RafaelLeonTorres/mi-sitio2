<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    try {
      var tema = localStorage.getItem('tema');
      if (tema === 'light' || tema === 'dark') document.documentElement.setAttribute('data-theme', tema);
    } catch (e) {}
  })();
</script>
{% seo %}
{%- if alt %}
<link rel="alternate" hreflang="{{ page.lang }}" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="{{ alt.lang }}" href="{{ alt.url | absolute_url }}">
{%- endif %}
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,800;1,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{%- if page.layout == "lab" %}
<link rel="stylesheet" href="{{ '/assets/css/labs.css' | relative_url }}">
{%- endif %}
{%- if page.layout == "course" %}
<link rel="stylesheet" href="{{ '/assets/css/course.css' | relative_url }}">
{%- endif %}
{% feed_meta %}
