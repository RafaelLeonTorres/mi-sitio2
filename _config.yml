# Sitio personal de Rafael León Torres
# Jekyll publicado con GitHub Pages: https://rafaelleontorres.github.io/mi-sitio2/

title: Rafael León
description: Ingeniero de Software Senior especializado en .NET, Angular y SQL Server.
author:
  name: Rafael León Torres
url: https://rafaelleontorres.github.io
baseurl: /mi-sitio2
lang: es
locale: es_MX
timezone: America/Mexico_City

social:
  name: Rafael León Torres
  links:
    - https://github.com/RafaelLeonTorres
    - https://www.linkedin.com/in/rafael-leon-torres-75410999/

twitter:
  card: summary_large_image

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      image: /assets/img/og-es.png
  - scope:
      path: "en"
    values:
      image: /assets/img/og-en.png
  - scope:
      path: "_posts/en"
    values:
      image: /assets/img/og-en.png

exclude:
  - README.md
  - PLAN.md
  - PLAN-CURSO.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - node_modules
  # Código del laboratorio y sus herramientas: el sitio publica solo lo compilado en assets/js/labs
  # y el motor de C# que npm run csharp deja en assets/labs/csharp.
  - labs
  - dotnet
  - scripts
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.node.json
  - vitest.config.ts
  # Fuentes LaTeX del CV y las cartas: el sitio solo publica los PDF de la raíz.
  - latex
  # Archivos que entrega Claude para moverlos a su lugar (tampoco se suben a git).
  - Claude outputs
