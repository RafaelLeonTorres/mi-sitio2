# Reemplaza a validar-jekyll.yml. Revisa y prueba el laboratorio (TypeScript), prueba los retos de
# C# con .NET, publica el motor de C# que corre en el navegador, compila el laboratorio, construye el
# sitio con el mismo motor que usa GitHub Pages y, solo en main, lo publica.
# En los pull requests no publica nada y además compila los CV y las cartas.
#
# Requiere Settings → Pages → Build and deployment → Source: GitHub Actions.
# Para volver atrás: Source → Deploy from a branch (main, / (root)).
name: Sitio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos y formato
        run: npm run check

      - name: Pruebas
        run: npm test

      - name: Probar los retos de C# (soluciones, códigos iniciales y arnés)
        run: dotnet test dotnet/challenges/Tests

      - name: Publicar el motor de C# en assets/labs/csharp
        run: npm run csharp

      - name: Compilar el laboratorio
        run: npm run build

      - name: Construir con el motor de GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Guardar el sitio para publicarlo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4

  deploy:
    name: Publicar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  latex:
    name: Compilar CV y cartas
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compilar con XeLaTeX (TeX Live completo)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: latex
          root_file: |
            cv-es.tex
            cv-en.tex
            carta-es.tex
            carta-en.tex
          latexmk_use_xelatex: true
      - name: Guardar los PDF para revisarlos
        uses: actions/upload-artifact@v4
        with:
          name: cv-y-cartas
          path: latex/*.pdf
